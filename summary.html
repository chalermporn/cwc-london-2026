erify; demo plants a failing sum and a broken DOM contract for Claude to diagnose."}, {"th": "ผู้พูดบอกว่าทีม Claude Code บันทึกวิดีโอการ verify ของ frontend change เกือบทั้งหมด เก็บบน S3 หรือแชร์ให้เพื่อนร่วมทีม และกล่าวว่า HTML spec ไม่ได้เปลืองโทเค็นกว่าในระยะยาวเพราะต้องวนแก้น้อยลง", "en": "The Claude Code team records frontend verification clips; the speaker says rich HTML specs save tokens long-term by cutting iterations."}], "numbers": [{"th": "ความยาวคลิป 31:43 เป็นเวิร์กชอปที่มี repo ให้ clone มีสาม phase และใช้ credits ผ่าน QR code"}, {"th": "ผู้พูดบอกว่า markdown ที่ยาวกว่าราว 200 บรรทัด มักไม่มีใครอ่าน"}, {"th": "ตั้ง effort แนะนำ xhigh (หรือ max) ผ่าน /effort"}, {"th": "โมเดลที่แนะนำสำหรับงานนี้ Opus 4.7 เพราะ vision ดีกว่าเดิม และไม่แนะนำ Sonnet"}, {"th": "ทิศทางดีไซน์ที่ให้ Claude สร้างเป็น HTML มี 4 แบบ"}, {"th": "ตัวอย่างความล้มเหลวที่ฝังไว้ในเดโม: ผลรวม 3 + 4 ไม่เท่ากับ 10"}], "quotes": [{"text": "the more capable the models get the more you should try to resist constraining them", "th": "ยิ่งโมเดลเก่ง ยิ่งควรต้านทานความอยากบีบกรอบให้มัน"}, {"text": "Claude is likely better at extracting what you want and what you need from you than you are in specifying it to Claude.", "th": "Claude น่าจะดึงสิ่งที่คุณต้องการออกจากคุณได้ดีกว่าที่คุณระบุให้ Claude เอง"}, {"text": "The Markdown file is the lingua franca of the AI native software development life cycle.", "th": "ไฟล์ markdown คือภาษากลางของ software development life cycle แบบ AI-native"}], "steps": ["Phase 1: เปิด Claude Code ตั้ง auto mode (shift tab), /effort เป็น xhigh, ลอง /fast แล้ววาง prompt ให้ Claude สัมภาษณ์ requirement ของแอปแบ่งบิลด้วย ask user question tool ตอบทีละข้อจนได้ spec", "Phase 2: สั่งให้ Claude สร้างสี่ทิศทางดีไซน์เป็น HTML แยกไฟล์ให้เทียบ เปิดคลิกดู แล้วถ่าย screenshot ส่ง feedback กลับ", "Phase 3: โหลดแอป to-do (React) ดู element ที่ publish state ลง DOM (data-verify unit, total, done, active) พร้อม schema, fixtures, invariants", "รัน verification dashboard ให้คนดู กดรันทั้งหมด พบเคสที่ฝังความผิด 3 + 4 != 10", "ให้ agent ขับผ่านเบราว์เซอร์ด้วย Playwright MCP อ่าน manifest ของ verification ที่อยู่ใน DOM แล้วรันเอง และบันทึกเป็นคลิปเป็นหลักฐาน", "ทดลองทำลาย contract (ลบ total stats ออกจาก DOM) เพื่อดูว่าเทสต์ล้มเพราะ contract ไม่ใช่แอป", "ให้ Claude (Opus 4.7) วินิจฉัยสาเหตุที่ verify ล้ม และรัน headless ด้วย bun verify แบบ CI"], "takeaways_th": ["ก่อนสั่ง agent รันงานยาว ให้ Claude สัมภาษณ์ requirement ด้วย ask user question tool แทนการเขียนสเปกเองทั้งหมด", "เปลี่ยนสเปกหรือแผนที่ยาวจาก markdown เป็น HTML ที่คลิกเทียบได้ โดยเฉพาะงาน UI แล้วใช้ screenshot ป้อน feedback", "ให้ component เผยแพร่ state/contract ลง DOM เช่น data attribute เพื่อให้ agent ตรวจได้โดยไม่ต้อง scrape โครงสร้างภายใน", "ออกแบบ verification ให้ครบสามพื้นผิว: dashboard สำหรับคน, ขับด้วย agent ผ่าน Playwright MCP, และ headless สำหรับ CI พร้อม probe ที่ผลักออกนอก happy path", "ตั้ง effort สูง (xhigh), ใช้ auto mode และลอง fast mode ตอนวนสเปก แล้วเก็บคลิป verification ไว้เป็นหลักฐานให้ทีม"], "caveats_th": ["ผู้พูดแนะนำตัวว่าชื่อ Arno (Applied AI team) สะกดชื่ออาจเพี้ยนจาก ASR และ transcript ไม่ได้ให้นามสกุล", "ชื่อ Tariq และบล็อก 'The Unreasonable Effectiveness of HTML files' มาจาก ASR ที่ผู้พูดอ้าง ไม่ได้ตรวจสอบ", "ผู้พูดเอ่ยถึง /goal ผ่านๆ ไม่ได้อธิบายการทำงาน จึงไม่ใส่เป็นรายละเอียดฟีเจอร์", "ข้อความ 'Paul' ใน transcript น่าจะเป็น 'Claude' ที่ ASR ฟังผิด ตัวเลข 200 บรรทัดเป็นประมาณการของผู้พูด", "ผู้พูดบอกว่าทีม Claude Code บันทึกคลิป verification เป็นประจำ แต่ไม่แน่ใจเรื่องระยะเวลาเก็บหรือบริบท"], "related_existing": ["claude-code-practices", "claude-code-workflows", "claude-code-model-config", "agent-trust-ladder-verification-first", "claude-code-mcp"], "dur": "31:43", "url": "https://www.youtube.com/watch?v=IlqJqcl8ONE", "asr": "yt-captions", "wiki": "cwc-london-30"}, {"n": 31, "id": "qOjleN2-50c", "title_en": "Making agentic workflows trustworthy and verifiable with a custom DSL", "title_th": "ทำให้ agent น่าเชื่อถือด้วยภาษา DSL ของตัวเอง (กรณี Elicit กับ AshPL)", "speakers": [{"name": "James Brady", "role": "Elicit (ใน transcript ถูกเขียนว่า 'Alissa'/'illicit' จาก ASR)"}], "track": "domain-case", "tags": ["agent-reliability", "evals", "cloud-platforms", "self-improving"], "tldr_th": "James Brady เล่าว่า Elicit ให้ research agent เขียนแผนงานเป็น AshPL ซึ่งเป็น DSL ย่อยของ Python ที่ Turing incomplete แล้วให้ตัว interpreter รันแผนนั้นจริง ทำให้กระบวนการตรวจสอบได้ ต่อยอดได้โดยไม่เพี้ยน และทำตามแผนจริง ข้อสรุปคือไม่ได้ชวนให้ทุกคนใช้ DSL แต่ให้ใส่ใจ mechanism ว่าคำตอบเกิดขึ้นอย่างไร", "tldr_en": "Elicit's research agent writes plans in AshPL, a Turing-incomplete Python subset that an interpreter actually executes, making the process legible, iterable without drift, and faithfully followed. The pitch: care about the mechanism.", "audience_th": "คนออกแบบ agent ที่ต้องการความน่าเชื่อถือสูง (งานวิจัย การตัดสินใจเสี่ยงสูง) และสนใจสถาปัตยกรรมเบื้องหลัง ควรเข้าใจ interpreter และ event sourcing คร่าวๆ", "points": [{"th": "คำถามตั้งต้น ถ้าสองระบบให้ผลลัพธ์ตัวอักษรเหมือนกัน เราเชื่อมันเท่ากันไหม คำตอบคือขึ้นกับกระบวนการข้างใน mechanism สำคัญไม่แพ้ผลลัพธ์ และไม่มี mechanism เดียวที่ถูกสำหรับทุกกรณี มี trade-off ระหว่างความเร็วกับความเข้มงวด", "en": "Identical outputs deserve different trust depending on the mechanism; there is no single correct design and a speed-versus-rigor trade-off exists."}, {"th": "Elicit วางตัวเรื่องความน่าเชื่อถือสูง คุณภาพสูง และ data provenance จึงตั้งสามข้อ (desiderata) คือ process ต้อง legible ทั้งต่อผู้ใช้และ agent อื่น, การ iterate ต้องไม่เพี้ยนจากเจตนาเดิม (fidelity), และระบบต้องทำตามแผนจริง (followed faithfully)", "en": "Three desiderata: legible process, iteration that retains fidelity, and a process that is faithfully followed."}, {"th": "AshPL เป็น DSL ที่ Turing incomplete ไม่มี loop ไม่มี recursion ไม่มี mutation เป็น purely functional แบบ reactive และเป็น subset แบบมีหลักการของ Python มี type และมี primitive เฉพาะโดเมน เช่น ดึงงานวิจัยหรือ clinical trial เหตุผลที่เลือกพื้นฐาน Python คือโมเดลมีตัวอย่างเยอะอยู่แล้ว ไม่ต้องเรียนไวยากรณ์ใหม่", "en": "AshPL is a typed, purely functional, Turing-incomplete Python subset with domain primitives; basing it on Python means the model already knows the syntax."}, {"th": "แกนของระบบคือ loop เขียนแล้วตีความแล้วเขียนใหม่ curator เป็นตัวเขียน AshPL (ใช้ Agent SDK และเคยลอง Pi) Python service parse ตรวจ syntax และ type check ถ้า error ส่งกลับไปแก้ทันทีโดยแทบไม่เสียต้นทุน แล้ว interpret ด้วยโค้ด Python ธรรมดา", "en": "Core loop: curator writes AshPL, a Python service parses, type-checks and interprets it, with cheap error kick-back to the curator."}, {"th": "สถาปัตยกรรมประกอบด้วย UI, event log แบบ append-only (event sourcing), Python service เป็น message broker, sandbox, wrapper ที่สลับ harness/โมเดลได้ และ gateway ที่เก็บ API key ไว้ เพื่อกัน user input หลอก curator ให้พิมพ์ env ออกมา", "en": "Architecture: UI, append-only event log, Python service, sandbox, swappable wrapper, and a gateway that isolates the API key from user input."}, {"th": "ทุกรอบ interpret โปรแกรมทั้งก้อนใหม่ตั้งแต่ต้น แต่เร็วเพราะ content-addressable store ทำ memoization (hash expression ถ้าเคยคำนวณแล้วก็ใช้ซ้ำ) ซึ่งเป็นไปได้เพราะภาษาเป็น pure ผู้พูดว่าการ interpret ทั้งโปรแกรมช่วยให้มั่นใจเรื่อง cohesion และกัน drift", "en": "The whole program is re-interpreted each time, kept fast by content-addressed memoization enabled by purity, which also guards against drift."}, {"th": "เดโมคือ research landscape ของบริษัทที่ลงทุนด้าน foundation model สำหรับชีววิทยา ได้ตารางเป็น artifact ที่คลิกดูโค้ด AshPL ที่สร้างตารางนั้นได้ มี visualization ที่ derive จากโค้ดเดียวกัน และต่อยอดด้วย join กับตาราง oversight bodies โดยโปรแกรมยาวขึ้นแต่ส่วนต้นเหมือนเดิมและ cache ได้", "en": "Demo: a research landscape on biology foundation models yields tables traceable to their AshPL, a derived graph, and layered follow-ups reusing cached work."}, {"th": "งานส่วนใหญ่ไม่ใช่ตัว DSL แต่เป็นวิศวกรรมซอฟต์แวร์ทั่วไป เช่น wrapper, interrupt handling, rehydrate session, credential isolation, จัดการ message ของโมเดล, event sourcing และทีม eval โดยเฉพาะที่ยากเพราะระบบเขียนโปรแกรมแล้วรันสดๆ", "en": "Most effort was conventional engineering (wrapper, interrupts, session rehydration, credential isolation, event sourcing) plus a dedicated eval team."}], "numbers": [{"th": "ความยาวคลิป 29:39 หัวข้อ Elicit research agent ที่ใช้ AshPL"}, {"th": "โปรแกรม AshPL ของตารางแรกยาวราว 100-150 บรรทัด ส่วนตารางที่ join แล้วยาวราว 1,000 บรรทัดขึ้นไป (ผู้พูดประมาณเอง)"}, {"th": "ตอนนี้ curator ใช้ Pi ร่วมกับโมเดลของ Anthropic ซึ่งผู้พูดบอกว่าเป็นชุดที่ดีที่สุดสำหรับพวกเขา และเคยลอง Agent SDK กับ Pi ร่วมกับโมเดลอื่นมาก่อน"}, {"th": "ผู้พูดบอกว่าเดโมจริงใช้เวลาทำงานรวมราวสองสามชั่วโมงรวมการต่อยอด ไม่ใช่ทำในห้องได้ทัน จึงเปิด session ที่บันทึกไว้"}, {"th": "รายการสิ่งที่ต้องสร้างรอบ DSL ผู้พูดไล่ไว้ราวแปดข้อ (DSL, wrapper, interrupt handling, rehydrate, credential isolation, message handling, event sourcing, eval)"}], "quotes": [{"text": "my pitch is that you should care a lot about the mechanism", "th": "ข้อเสนอของผมคือให้ใส่ใจกับ mechanism ให้มาก"}, {"text": "the Ash PL is not just a representation of a plan. It is literally the plan which is executable", "th": "AshPL ไม่ใช่แค่ตัวแทนของแผน แต่คือแผนที่รันได้จริง"}, {"text": "firstly it is Turing incomplete. It's relatively simple. There's no loops.", "th": "ข้อแรกคือมัน Turing incomplete ค่อนข้างเรียบง่าย ไม่มี loop"}], "steps": [], "takeaways_th": ["ถามตัวเองก่อนว่าผลิตภัณฑ์ต้องการ legibility, fidelity ตอนต่อยอด และ faithfulness ต่อแผนแค่ไหน ถ้าสูงมาก ให้ทำแผนเป็นของที่รันได้ ไม่ใช่แค่ข้อความ", "ถ้าจะทำ DSL ให้ย่อยจากภาษาที่โมเดลรู้จักดีอยู่แล้วเพื่อลดการสอนไวยากรณ์ และตัดฟีเจอร์ที่ไม่จำเป็น เช่น loop, recursion, mutation", "ใช้ type check กับ parse เป็นด่านราคาถูกก่อนรัน แล้วส่ง error กลับให้ agent แก้ ก่อนเสียโทเค็นกับขั้นตอนแพง", "ถ้ารันทั้งโปรแกรมใหม่ทุกรอบ ให้ทำ memoization ผ่าน content-addressed store เพื่อไม่ให้ซ้ำงาน", "แยก credential ออกจาก agent ผ่าน gateway และลงทุนกับ eval ตั้งแต่ต้น เพราะ eval ของระบบที่เขียนโปรแกรมสดๆ ยากแต่จำเป็น"], "caveats_th": ["ASR เขียนชื่อบริษัทเป็น 'Alissa' และ 'illicit' ชื่อที่ผู้พูดหมายถึงน่าจะเป็น Elicit (ผู้พูดพูดถึง elicit.com) และชื่อภาษา 'Ash PL/HPL/ASPL' คือ AshPL เดียวกัน", "ชื่อผู้พูด James Brady มาจากคำแนะนำตัวใน transcript ส่วนตำแหน่งไม่ได้ระบุ", "ผู้พูดอ้างความน่าเชื่อถือและความถูกต้องของระบบ แต่ในคลิปไม่มีตัวเลข benchmark ให้ตรวจสอบ", "ผู้พูดพูดถึงโมเดลรุ่นเก่าเป็น '3.5 Sonar' ซึ่งน่าจะเป็น Sonnet ที่ ASR เพี้ยน จึงไม่ใช้เป็นข้อเท็จจริง", "ชื่อ Pi (harness) และการเอ่ยถึง Codex มาจากคำพูดของผู้พูด ไม่ได้ตรวจสอบรายละเอียดผลิตภัณฑ์"], "related_existing": ["harness-engineering", "agent-trust-ladder-verification-first", "long-horizon-agents", "claude-agent-sdk"], "dur": "29:39", "url": "https://www.youtube.com/watch?v=qOjleN2-50c", "asr": "yt-captions", "wiki": "cwc-london-31"}, {"n": 32, "id": "tUoO4ucrNc0", "title_en": "Fighting financial crime with Claude Cowork", "title_th": "สู้อาชญากรรมการเงินด้วย Claude Cowork: MCP gateway, plugin และ evals", "speakers": [{"name": "Stefano Amorelli", "role": "Senior Staff Software Engineer ที่ fintech ฝรั่งเศสให้บริการ business banking สำหรับ SME (Whisper เขียนบริษัทเป็น 'Quanto' / 'Conto' ไม่คงที่)"}], "track": "domain-case", "tags": ["finance-ai", "mcp-tools-skills", "evals", "enterprise-adoption", "model-selection"], "tldr_th": "Stefano เล่าว่าทีมสร้างระบบช่วยนักสืบอาชญากรรมการเงินด้วย Claude Cowork plugin ที่ต่อข้อมูลผ่าน MCP gateway ซึ่งจัดการ auth, RBAC และ audit trail ให้ครบ และใช้ evals สร้างความเชื่อมั่น ข้อสรุปคือต้องวาง boundary ด้าน security/compliance ตั้งแต่ต้น แล้ว AI ใช้ใน workflow เสี่ยงสูงได้", "tldr_en": "A fintech engineer shows a Cowork plugin for financial-crime investigators behind a secure MCP gateway (OAuth, RBAC, audit trail), validated with evals, and argues start with evals and secure data access.", "audience_th": "ทีมในองค์กรที่ต้องนำ AI/MCP ไปใช้กับข้อมูลอ่อนไหว และต้องผ่านฝ่าย security กับ compliance", "points": [{"th": "กระบวนการเดิม: ระบบ alert อัตโนมัติ (ใช้ ML แบบ predictive ไม่ใช่ generative) สร้างเคส แล้วนักสืบเก็บข้อมูลจากหลายแหล่งด้วยมือ จอหลายใบ แท็บเบราว์เซอร์เป็นสิบ ก่อนตัดสินว่าเป็นอาชญากรรมไหม ทีมโฟกัสที่ agentic AI ใน second line of defense ซึ่งผู้พูดบอกว่ายังมีน้อยรายในอุตสาหกรรมที่ทำ", "en": "Alerts come from predictive ML; the manual investigation step (second line of defense) is where agentic AI is applied."}, {"th": "เลือก Opus 4.7 เพราะต้อง reason ข้าม context ยาว ผู้พูดอ้าง benchmark GraphWalks (หาข้อเท็จจริงที่กระจายใน context) ว่า Opus 4.7 นำ แต่ก็บอกว่างานอื่นอาจไม่ต้องใช้รุ่นใหญ่ ใช้ Claude Cowork เป็น UI ให้นักสืบเพราะ onboard คนที่ไม่ใช่สายเทคนิคง่าย", "en": "Opus 4.7 chosen for long-context reasoning (cites GraphWalks); Cowork used as the investigator UI."}, {"th": "ข้อกังวลเรื่อง MCP กับ security/compliance แก้ได้ด้วยการสร้าง boundary และ harness ที่ปลอดภัย: remote MCP servers แบบรวมศูนย์ OAuth, session token แบบ Paseto อายุสั้น, RBAC, audit trail และคงให้คนตัดสินใจในจุดวิกฤต", "en": "MCP security concerns addressed with centralized remote MCP servers, OAuth, short-lived Paseto tokens, RBAC, audit trail and human judgment on critical decisions."}, {"th": "สถาปัตยกรรม: Cowork plugin ต่อเข้า MCP gateway (ใช้ ContextForge แบบ open source) ที่ทำ SSO, ตรวจ token, resolve identity, ออก token อายุสั้น และเขียน audit ลงฐานข้อมูลแบบ append-only; ต่อ MCP server ปลายทางที่ deploy บน Kubernetes เรียกตรงไม่ได้ ใช้ streamable HTTP และเขียนด้วยภาษาอะไรก็ได้", "en": "Cowork plugin -> MCP gateway (ContextForge: SSO, token validation, RBAC, append-only audit) -> federated MCP servers on Kubernetes."}, {"th": "RBAC เขียนเป็นไฟล์ Terraform ที่ version ใน GitHub จึง audit ได้ และผู้ใช้จะไม่เห็นด้วยซ้ำว่ามี MCP server ที่ตัวเองไม่มีสิทธิ์ ส่วน tool call ทุกครั้งถูก instrument ด้วย OTel (บวก field เสริม) เก็บใน ClickHouse และดูผ่าน dashboard Grafana ใน production", "en": "RBAC defined in versioned Terraform; users can't even see unauthorized MCP servers; tool calls traced via OTel into ClickHouse/Grafana."}, {"th": "Cowork render inline widget แบบ interactive ได้ทันที (เร็วกว่า artifact เดิม) ให้นักสืบเห็น dashboard และสั่ง action จาก interface เดียว แทนการสลับหลายเครื่องมือ", "en": "Cowork renders fast interactive inline widgets, giving investigators one interface instead of many tools."}, {"th": "โครงสร้าง plugin: แบ่งเป็น sub skills แทน prompt 1,000 บรรทัด มี orchestrator skill เรียก sub skill ตามขั้น มี meta skill ตรวจผลตอนท้ายทุกครั้ง ใช้ XML structured prompt และระบุ MCP server/tool ที่ skill ใช้ไว้ล่วงหน้า", "en": "Plugin split into sub-skills with an orchestrator and an end-of-run meta skill; XML-structured prompts; tools listed per skill."}, {"th": "evals วัด 3 อย่าง: เรียก tool ถูกและถูกลำดับ, ไม่ hallucinate (ข้อมูลใน dashboard ต้องอ้างอิงเอกสาร), และ reasoning ถูก (ใช้ LLM as a judge) ช่วยทั้ง engineering, compliance และความเชื่อมั่นของผู้ใช้ เป้าหมายคือขยับจาก human in the loop ไป human on the loop", "en": "Evals cover tool use/order, grounding vs hallucination, and reasoning quality via LLM-as-judge; vision is moving to human on the loop."}], "numbers": [{"th": "โมเดลที่เลือก: Opus 4.7 (ผู้พูดว่าเป็น frontier model ที่ดีที่สุดสำหรับงาน long-context ตอนนี้)"}, {"th": "GraphWalks benchmark: วัดการหาข้อเท็จจริงที่กระจายใน context window ผู้พูดบอกว่า Opus 4.7 นำ (ไม่ได้อ่านตัวเลขคะแนน)"}, {"th": "Paseto tokens: เทคโนโลยีจากปี 2018 ใช้เป็น session token อายุสั้น payload base64 ไม่เข้ารหัสแต่ลงลายเซ็น"}, {"th": "Stack: ContextForge (MCP gateway), Terraform (RBAC), Kubernetes, streamable HTTP, OpenTelemetry, ClickHouse, Grafana"}, {"th": "การฟอกเงินทั่วโลก 2-5 ล้านล้านดอลลาร์สหรัฐต่อปี และตรวจพบ/ยึดได้สัดส่วนน้อยมาก (ตามผู้พูด)"}, {"th": "โปรเจกต์แรกใช้เวลาสร้างไม่กี่สัปดาห์ (ผู้พูดว่า a few weeks) ส่วน use case ใหม่ ๆ นำมาใช้ได้ภายในไม่กี่วัน"}], "quotes": [{"text": "Some people even say that the S in MCP stands for security.", "th": "บางคนถึงกับบอกว่า S ใน MCP ย่อมาจาก security"}, {"text": "So instead of creating one huge prompt of 1000 lines, we split it across different sub skills.", "th": "แทนที่จะเขียน prompt ยักษ์ 1,000 บรรทัด เราแตกเป็น sub skills"}, {"text": "I like to compare evals to TDD.", "th": "ผมชอบเปรียบ evals กับ TDD"}], "steps": [], "takeaways_th": ["เริ่มทำ evals ตั้งแต่ต้น เหมือน TDD: วัด tool use, grounding และ reasoning ก่อนขยายระบบ", "ถ้าต้องต่อ MCP กับข้อมูลอ่อนไหว ให้ใช้ gateway กลางที่รวม SSO, RBAC และ audit trail แทนให้แต่ละ MCP server ทำเอง", "เขียน RBAC เป็น code (เช่น Terraform) ให้ version และ audit ได้", "แตก plugin/skill เป็นชิ้นย่อย มี orchestrator กับ meta skill ตรวจผล และใช้ prompt แบบมีโครงสร้าง", "ทำงานร่วมกับผู้เชี่ยวชาญโดเมนเขียน plugin แล้วให้ทีมอื่นนำ MCP gateway เดิมไปสร้าง plugin ของตัวเอง"], "caveats_th": ["Transcript มาจาก Whisper large-v3 ที่ถอดเอง: ชื่อบริษัทของผู้พูดสะกดไม่คงที่ ('Quanto' และ 'Conto') ผู้สรุปจึงไม่ระบุชื่อบริษัทแน่ชัด ชื่อผู้พูดตามที่ MC แนะนำ อาจสะกดเพี้ยน", "ประโยคช่วงต้นมี Whisper ติด loop (ประโยค 'non-profit organization' ซ้ำ) ไม่ใช่เนื้อหาจริงของผู้พูด", "การอ้างว่า Opus 4.7 นำใน GraphWalks และตัวเลขการฟอกเงิน 2-5 ล้านล้านดอลลาร์เป็นข้ออ้างของผู้พูด ไม่ได้ตรวจกับแหล่งอิสระ", "ผู้พูดไม่ได้เปิดเผยตัวเลขผลลัพธ์ของ evals หรือข้อมูลลูกค้า (เดโมเป็นวิดีโอที่ปิดบังข้อมูล)"], "related_existing": ["claude-code-enterprise", "agentic-ai-enterprise", "mcp-live-artifacts-enterprise", "agent-trust-ladder-verification-first", "claude-code-security"], "dur": "27:52", "url": "https://www.youtube.com/watch?v=tUoO4ucrNc0", "asr": "whisper", "wiki": "cwc-london-32"}, {"n": 33, "id": "T8N0MED3IJo", "title_en": "Where code meets court: AI at the legal-technical frontier", "title_th": "งานสิทธิบัตรไม่เหมาะกับการ delegate ให้ agent: ออกแบบ AI แบบ collaboration", "speakers": [{"name": "Olly Cobb", "role": "Founding AI engineer, Solve Intelligence"}], "track": "domain-case", "tags": ["legal-ai", "agent-reliability", "subagents"], "tldr_th": "Olly Cobb จาก Solve Intelligence เล่าว่างานร่างสิทธิบัตรต่างจากงานเขียนโค้ด เพราะตรวจความถูกต้องไม่ได้ทันทีและการตัดสินใจแต่ละข้อผูกกันหมด โมเดล delegate ให้ agent วิ่งยาวเลยไม่เวิร์ก ทางที่เขาเสนอคือ collaboration โดยยึดสามหลัก ได้แก่ citations เป็นพลเมืองชั้นหนึ่ง, ใช้ general purpose agent ตัวเดียวรับ workflow เฉพาะทาง และ parallelize alignment แล้วค่อย sequence execution", "tldr_en": "Patent drafting resists the delegate-to-an-agent model because outputs can't be validated and decisions are entangled; Solve Intelligence builds for collaboration using first-class citations, one general-purpose agent behind specific workflows, and parallel alignment before sequential execution.", "audience_th": "คนที่สร้างผลิตภัณฑ์ AI ให้งานเฉพาะทางที่ตัดสินผิดแล้วแพง (กฎหมาย การเงิน) ไม่ต้องมีพื้นสิทธิบัตรมาก่อน ผู้พูดอธิบายให้ในคลิป", "points": [{"th": "ผู้พูดวางกรอบว่า software dev ได้ประโยชน์จาก AI ด้านการให้เหตุผลเชิงเทคนิค ส่วนงานกฎหมายได้ประโยชน์ด้านการกวาดเอกสารเป็นพันเป็นล้าน patent law อยู่ตรงกลางที่ต้องการทั้งสองอย่าง", "en": "Software benefits from technical reasoning, legal from trawling huge document sets; patent law needs both."}, {"th": "เล่าพื้นฐานสิทธิบัตร เป็นสัญญาสังคมระหว่างผู้ประดิษฐ์กับรัฐ เปิดเผยการทำงานของสิ่งประดิษฐ์ แลกกับสิทธิผูกขาด 20 ปี ต้องผ่านเกณฑ์ novel, non-obvious, useful และ sufficiently disclosed โดย claims เป็นหัวใจที่กำหนดขอบเขตการคุ้มครอง", "en": "A patent is a social contract (20-year monopoly for disclosure) with four criteria; claims define the scope."}, {"th": "ผู้พูดอธิบาย lifecycle ผ่าน prosecution (office action, การโต้แย้งหรือ amend claims, file history) ไปจนถึง enforcement และ litigation ข้อสรุปคือการตัดสินใจตอนร่างส่งผลอีกหลายปีข้างหน้า", "en": "Prosecution, file history and litigation mean drafting decisions have consequences years later."}, {"th": "เหตุผลหลักที่ delegation ไม่เวิร์ก ข้อแรก validate output ไม่ได้ (รัน patent ไม่ได้ ความถูกต้องขึ้นกับเหตุการณ์ในอนาคต) ข้อสอง การตัดสินใจ entangled กัน (แก้ claim 1 ย้อนไปกระทบ claims อื่น, spec, drawings) สองข้อนี้รวมกันจึงพัง", "en": "Unvalidatable outputs plus entangled decisions break the delegation model."}, {"th": "เหตุผลรองคือสิ่งประดิษฐ์เป็น out of distribution สำหรับโมเดล, hallucination ตรวจยากและแพงกว่า, ข้อมูลไม่ใช่ข้อความล้วน (line drawings, โครงสร้างเคมี, sequence ชีวภาพ) ซึ่งการเลือกวิธี represent มีผลต่อการ reason ส่วนโครงสร้างเอกสารที่สม่ำเสมอเป็นข้อที่ตัดสินได้สองทาง", "en": "Out-of-distribution inventions, costly hallucinations, non-text data; uniform structure cuts both ways."}, {"th": "ทางเลือกคือ collaboration: AI ยกประเด็นที่ต้องตัดสินใจขึ้นมาให้ทนายในจังหวะที่ต้องตัดสิน พร้อม trade-off แล้วลงมือทำตามที่ตัดสินแล้ว ผู้พูดบอกว่าไม่ใช่ขาวดำ แต่ผลผลิตหน้าตาต่างกันทั้ง UI/UX และชั้น AI", "en": "Collaboration: surface judgment calls with trade-offs, then execute on them."}, {"th": "หลักที่ 1 citations เป็น first-class citizen ข้อมูลทุกอย่างที่ LLM เห็นต้องอยู่ในรูปที่อ้างอิงได้ และ LLM คุยกับผู้ใช้หรือคุยกันเองต้องระบุที่มา ซึ่งมักต้องออกแบบ pattern ของ tool calling, subagents, compaction เอง", "en": "Principle 1: citations are first-class and must survive tool calls, subagents and compaction."}, {"th": "หลักที่ 2 ใช้ general purpose agent ตัวเดียวรับ workflow เฉพาะ ผู้ใช้กำหนดผ่าน interface (เช่น ร่าง claims ตามที่ตั้งค่าไว้) แล้วแปลงเป็นคำสั่งส่งเข้า agent ตัวเดิม อาจเสริม tool หรือ subagent ผู้ใช้จึงได้ทั้ง interface และ reasoning กับ citations ที่คุ้นเคย หลักที่ 3 parallelize alignment, sequence execution: ให้ sub-reviews ตามเกณฑ์รันขนาน สร้าง comments ให้ทนายตอบหรือ dismiss ก่อน แล้วค่อยให้ agent แก้เอกสารตามที่ตกลง", "en": "Principles 2 and 3: one general agent behind specific workflows; parallel review comments for human alignment, then sequential edits."}], "numbers": [{"th": "สิทธิบัตรให้สิทธิผูกขาด 20 ปีต่อผู้ประดิษฐ์ ตามที่ผู้พูดอธิบาย"}, {"th": "เกณฑ์ขอรับสิทธิบัตร 4 ข้อตามที่ผู้พูดบอก: novel, non-obvious, useful, sufficiently disclosed"}, {"th": "ในเดโม review รันแยก sub-review ขนานกัน 4 เกณฑ์ที่ Solve แนะนำ ผู้พูดบอกว่าใช้งานจริงอาจมีราว 30 เกณฑ์หรือมากกว่า"}], "quotes": [{"text": "you can't run a patent, unfortunately, and its correctness is really a function of events that haven't happened yet", "th": "รัน patent ไม่ได้ ความถูกต้องขึ้นกับเหตุการณ์ที่ยังไม่เกิด"}, {"text": "what we need here is something more akin to a model of collaboration rather than merely delegation", "th": "ที่ต้องการคือโมเดลแบบ collaboration มากกว่า delegation ล้วนๆ"}, {"text": "citations are actually a massive pain", "th": "citations เป็นเรื่องยุ่งยากมากจริงๆ"}], "steps": [], "takeaways_th": ["ก่อนทำ agent ให้โดเมนไหน ลองถามสองข้อก่อน ตรวจผลลัพธ์อัตโนมัติได้ไหม และการตัดสินใจแยกจากกันได้ไหม ถ้าไม่ใช่ทั้งคู่ delegation ล้วนไม่น่าเวิร์ก", "ออกแบบ citations ตั้งแต่ต้นให้ข้อมูลที่ป้อน LLM อ้างอิงได้ และเช็กว่ายังอยู่รอดผ่าน subagent กับ compaction", "ทำ workflow เฉพาะทางเป็น interface ที่แปลงเป็นคำสั่งเข้า general purpose agent ตัวเดียว แทนการแยกระบบ", "เจอบทตรวจสอบหลายเกณฑ์ ให้ออก comments ขนานก่อน รอมนุษย์ตกลง แล้วค่อยรันแก้แบบเรียงลำดับ กันข้อเสนอแก้ที่ชนกัน", "ถ้าโดเมนมีข้อมูลที่ไม่ใช่ข้อความ ลงแรงกับวิธี represent ข้อมูลให้โมเดลอ่าน เพราะผู้พูดบอกว่าเป็นจุดที่ application layer เพิ่มคุณค่าได้"], "caveats_th": ["transcript มาจาก Whisper large-v3 ที่ถอดเอง (ไม่ใช่คำบรรยายต้นฉบับ) ชื่อเฉพาะอาจเพี้ยน เช่น 'co-work' ในต้นฉบับน่าจะหมายถึง Cowork", "ช่วงอธิบายหลักที่ 1 ถึงต้นหลักที่ 2 ในไฟล์มีประโยคซ้ำและขาดหาย (ประโยคท้ายหลักที่ 1 ซ้ำกันเอง และเนื้อหาต่อไปโดดมาที่กลางหลักที่ 2) จึงสรุปหลักที่ 2 จากที่เดโมอธิบายเพิ่ม", "ประโยคเรื่อง 'the patent is not a specific syntax' ในต้นฉบับขาดความหมาย ไม่ได้ใช้ในสรุป", "ทุกข้ออ้างเรื่องข้อดีของแนวทางเป็นมุมมองของผู้พูดในฐานะผู้ทำผลิตภัณฑ์ ยังไม่มีตัวเลขวัดผลในคลิป"], "related_existing": ["ai-hallucination-factcheck", "multi-agent-patterns", "agent-trust-ladder-verification-first", "long-horizon-agents"], "dur": "32:15", "url": "https://www.youtube.com/watch?v=T8N0MED3IJo", "asr": "whisper", "wiki": "cwc-london-33"}, {"n": 34, "id": "M5uwBawBDpw", "title_en": "How AirOps chases friction to build AI products with Claude", "title_th": "AirOps ไล่แก้จุดฝืด ทำ agent ให้นักการตลาดใช้ได้จริงด้วย Claude Agent SDK", "speakers": [{"name": "Dylan", "role": "Product team, AirOps"}], "track": "agents-platform", "tags": ["managed-agents", "subagents", "enterprise-adoption", "agent-reliability", "mcp-tools-skills"], "tldr_th": "Dylan จาก AirOps เล่าการเปลี่ยนจาก workflow builder แบบ node ไปเป็น agent ชื่อ Quill และ Playbooks บน Claude Agent SDK กับ Managed Agents สำหรับนักการตลาดเนื้อหา โดยแก้สองจุดฝืดคือให้เข้ากับ workflow เดิมของคน (เอกสาร ความโปร่งใส human review) และทำ harness ให้คุณภาพสม่ำเสมอ (specialized tools กับ sub-agents) บทเรียนใหญ่คือจุดฝืดย้ายที่ไปเรื่อยๆ ต้องไล่ตามต่อ", "tldr_en": "AirOps moved from a node-based workflow builder to Claude-powered agents (Quill, Playbooks, Inbox), fitting marketers' document-based workflow with human review and using specialized tools and sub-agents for quality.", "audience_th": "ทีมโปรดักต์และวิศวกรที่ต้องส่ง agent เข้า workflow ของคนสายอาชีพที่ไม่ใช่นักพัฒนา และสนใจเรื่อง harness, sub-agent และ governance", "points": [{"th": "AirOps เป็นแพลตฟอร์ม growth marketing สำหรับ AI search (คล้าย SEO แต่สำหรับ ChatGPT, Gemini, Claude) ช่วยแบรนด์เห็นตำแหน่ง หาช่องว่าง สร้างหรืออัปเดตคอนเทนต์ และวัดผล ก่อนหน้านี้ใช้ workflow builder แบบลาก node ซึ่งชนเพดานความซับซ้อน ต้องสอนเรื่อง liquid text กับ JSON ให้นักการตลาด และโมเดลใหม่ออกทีก็ต้องไล่แก้ทุก step", "en": "AirOps does AI-search growth marketing; its node-based workflow builder hit a complexity ceiling and broke with every model update."}, {"th": "จุดหักเหคือ Opus 4.5 ที่เก่ง tool calling และทำตามคำสั่ง ทีมลองให้ LLM คอมไพล์เอกสารเป็น workflow (เปราะ) และ agent orchestration framework แบบเดิม (เปลี่ยนการ route ต้องแก้โค้ด) จึงลงทุนกับ Claude Agent SDK ที่คุม agent ผ่านไฟล์ markdown และ skills แทนโปรแกรม", "en": "After Opus 4.5, they tried LLM-compiled docs and traditional frameworks (both brittle) before settling on the Claude Agent SDK driven by markdown and skills."}, {"th": "ผลิตภัณฑ์ที่เพิ่งเปิดตัวชื่อ AirOps Next ประกอบด้วย Quill (agent ผู้ช่วยหลัก เข้าถึงข้อมูล AI search และ brand kit) กับ Playbooks (ประสบการณ์สร้างแบบเอกสาร ใกล้เคียง skill มี collaboration, governance, versioning) รวมถึง Inbox และ grid ผู้พูดอ้างกรณีลูกค้า Parallel ที่ได้ผลดีขึ้นและขึ้นระบบเร็วขึ้น", "en": "AirOps Next ships Quill, Playbooks (skill-like documents with versioning and governance), Inbox and a grid; a customer case is cited."}, {"th": "จุดฝืดแรก ต้องเข้ากับ workflow ที่นักการตลาดทำอยู่ ผู้พูดว่า use case ไม่จำกัดบังคับให้ต้องตั้งใจเลือก โฟกัส 'marketers' เอกสารคือสิ่งที่คุ้นเคย (ไม่ใช่ node) ต้องโปร่งใสว่าใช้ tool อะไรตอนไหน มีการควบคุม และบังคับ human review ระหว่างทางไม่ใช่แค่รีวิว PR ตอนจบแบบงานโค้ด", "en": "Friction one: fit the marketer's workflow with document-based building, transparency about tools, control, and human review enforced mid-run."}, {"th": "เดโม Playbook สั่งด้วย slash command กำหนด input/output/tools เพิ่ม MCP ใดก็ได้ ตั้ง trigger ตามเวลา webhook หรือ monitor (ร่วมกับ Parallel) และ insights เมื่อ metric ตก ในส่วน outline มอบหมายผู้รีวิวที่เท่านั้นที่ปลดบล็อก agent ได้ ผลโผล่ใน Inbox (ดู thought traces) และ grid ที่รีวิวระดับสเกล", "en": "Demo: slash-command playbooks with MCP, scheduled/webhook/monitor/insight triggers, assigned reviewers who unblock the agent, and Inbox/grid for review at scale."}, {"th": "จุดฝืดที่สอง ความสม่ำเสมอของคุณภาพ ผู้พูดเปรียบ harness เป็นรถ โมเดลคือเครื่องยนต์ ส่วนที่เหลือที่สร้างรอบๆ ก็สำคัญมาก เน้นสองส่วนคือ tools กับการจัดการ context โดย Agent SDK และ Managed Agents API ช่วยให้ iterate เร็ว", "en": "Friction two: consistency, framed as harness engineering where tools and context orchestration matter most."}, {"th": "specialized tools: แทนที่ agent จะไล่ใช้ primitive tools เป็นสิบๆ ครั้งเพื่อวิเคราะห์ว่าหน้าเว็บมีปัญหาอะไร ก็ทำ tool เดียวที่รับ URL แล้วคืนข้อมูลหน้านั้น content gaps เทียบคู่แข่ง keyword และ prompt เป้าหมาย รวมถึง tool เทียบหน้ากับหน้าที่ติดอันดับ เป็นแนวคล้าย code mode", "en": "Specialized tools replace many primitive calls: one URL-in call returns page analysis, content gaps and targets, plus a page-versus tool."}, {"th": "sub-agents: เริ่มจาก Claude ตัวเดียวแล้วค่อยเพิ่มเมื่อเจอจุดบกพร่อง มี compliance check (ให้คะแนนตามกฎแบรนด์), writing (context โฟกัส ไม่ปนงานวิจัย), brand kit ที่ดึง context ต้น run เก็บเป็น artifact ให้ทุกส่วนอ้างอันเดียวกัน และ custom sub-agent ให้ solutions architect สร้างเอง ผู้พูดย้ำว่า context window ใหญ่ขึ้นไม่ได้แปลว่าควรใช้เต็ม", "en": "Sub-agents added over time: compliance check, focused writing, brand-kit fetched once as an artifact, and custom ones; bigger context windows are not a reason to fill them."}], "numbers": [{"th": "ผู้พูดบอกว่ากรณีลูกค้า Parallel ได้ citation rate เพิ่ม 130% และ share of voice เพิ่ม 42% และขึ้นระบบได้ใน 1 สัปดาห์ จากปกติราวหนึ่งเดือนด้วย workflow builder"}, {"th": "specialized tool ลดการใช้โทเค็นราว 8% (ตัวเลขจาก ASR ผู้พูดพูดว่า 'an 8% decrease in like fewer tokens consumption') เมื่อเทียบกับการเรียก primitive tools วนหลายรอบ"}, {"th": "ก่อนมี tool เดียว agent เรียก tool ราว 20 ครั้งเพื่อดึง context ที่ต้องการ"}, {"th": "ลูกค้า enterprise 10 รายในช่วง beta เริ่มเผยแพร่คอนเทนต์ได้ภายในไม่เกิน 2 สัปดาห์"}, {"th": "Opus 4.5 คือจุดที่ทีมตัดสินใจลงทุน agent หนักขึ้น และผู้พูดยกตัวอย่าง Opus 4.7 ที่มี context window 1 ล้านโทเค็น"}], "quotes": [{"text": "making agents accessible is honestly really hard problem", "th": "การทำให้ agent เข้าถึงได้ง่ายเป็นปัญหาที่ยากจริงๆ"}, {"text": "just because it is, you know, larger doesn't mean that you should be like using the whole thing.", "th": "context window ใหญ่ขึ้นไม่ได้แปลว่าควรใช้จนเต็ม"}, {"text": "every single time a problem is solved, just that friction point always keeps moving.", "th": "ทุกครั้งที่แก้ปัญหาหนึ่งได้ จุดฝืดก็ย้ายไปที่อื่นเสมอ"}], "steps": [], "takeaways_th": ["ถ้าผู้ใช้ไม่ใช่นักพัฒนา ให้ห่อ skill เป็นรูปแบบที่เขาคุ้น เช่น เอกสาร แล้วเพิ่มความโปร่งใสว่าใช้ tool อะไร พร้อม versioning และ governance", "บังคับ human review ระหว่างทางด้วยการมอบหมายผู้รีวิวต่อ section ที่ปลดบล็อก agent ได้ และมีกล่องข้อความ (inbox) รวมงานรอรีวิว", "งานที่ agent ทำซ้ำบ่อย ให้รวมเป็น specialized tool ตัวเดียวแทนการให้ไล่ primitive tools ทีละตัว เพื่อลดโทเค็นและความเร็ว", "เริ่มจากเอเจนต์ตัวเดียว แล้วแตก sub-agent เฉพาะเมื่อคุณภาพติดขัด (compliance, writing, brand context) และดึง context ที่ใช้ร่วมกันครั้งเดียวเก็บเป็น artifact", "อย่าเติม context เต็ม window แม้โมเดลจะรองรับ และเตรียมแผนวัดผลเมื่อเปลี่ยน harness โดยไม่พึ่ง vibes"], "caveats_th": ["ASR เขียนชื่อบริษัทเป็น 'AerOps' และ 'Ahrefs Next' ในบางจุด ชื่อที่ถูกคือ AirOps / AirOps Next ตามชื่อคลิปและคำพูดส่วนใหญ่", "ผู้พูดแนะนำตัวว่าชื่อ Dylan อยู่ product team ไม่มีนามสกุล และตัวเลขทั้งหมดเป็นข้ออ้างของผู้พูดเอง ไม่มีหลักฐานแนบในคลิป", "ตัวเลข 8% ลดโทเค็นฟังจาก ASR ไม่ชัดว่าเป็นการลดของอะไรแน่ และเรื่อง Opus '46, 47' เป็นการพูดรวบรุ่นที่ ASR เขียน", "ชื่อลูกค้าบางราย (เช่น 'Animal' และ 'Rock Content') ฟังจาก ASR อาจเพี้ยน จึงไม่ได้ใส่เป็นข้อเท็จจริง", "ผู้พูดอ้างถึง 'AO insights' ซึ่งชื่ออาจเพี้ยนจาก ASR และเอ่ยถึง talks ก่อนหน้าเรื่อง dreaming sequences ซึ่งไม่ใช่ส่วนของคลิปนี้"], "related_existing": ["claude-agent-sdk", "claude-code-subagents", "harness-engineering", "context-management", "multi-agent-patterns"], "dur": "26:47", "url": "https://www.youtube.com/watch?v=M5uwBawBDpw", "asr": "yt-captions", "wiki": "cwc-london-34"}, {"n": 35, "id": "A3rmSUp6Dxg", "title_en": "How Metaview built self-improving prompts for application review", "title_th": "Metaview ทำ prompt คัดใบสมัครให้เรียนรู้จากการตัดสินใจของ recruiter เอง", "speakers": [{"name": "Nick Mayhew", "role": "Product Engineer, Metaview"}], "track": "domain-case", "tags": ["self-improving", "prompt-engineering", "model-selection", "agent-reliability"], "tldr_th": "Metaview สร้างระบบคัดใบสมัครที่ไม่ตั้งเกณฑ์ตายตัว แต่ให้ agent สังเกตว่า recruiter ผ่านหรือปัดใคร แล้วปรับ Ideal Candidate Profile (ICP) ซึ่งเป็น markdown prompt ให้ทันความต้องการที่เปลี่ยนไป ข้อสรุปคือ preferences ของผู้ใช้เปลี่ยนเสมอ ให้เขียนเป็นร้อยแก้วไม่ใช่กฎ และฝัง guardrail ในสถาปัตยกรรมให้ระบบเป็นแค่ apprentice", "tldr_en": "Metaview's application review keeps an Ideal Candidate Profile prompt up to date by watching recruiter decisions; design rules: expect preferences to evolve, use prose not rules, and build guardrails in so the system stays the apprentice.", "audience_th": "คนสร้างระบบ evaluation หรือ agent ที่ผู้ใช้เป็นคนตัดสินใจ และอยากรู้ว่าจะให้ prompt พัฒนาตามพฤติกรรมผู้ใช้ได้อย่างไร", "points": [{"th": "ผู้พูดบอกว่าตั้งแต่ปี 2023 LLM ทำให้ใบสมัครงานเพิ่มพรวด ผู้สมัครใช้ AI ช่วยเขียน recruiter จึงต้องการตัวช่วยคัดกรอง", "en": "LLMs flooded recruiters with applications, creating need for screening help."}, {"th": "ปัญหาแกนกลางคือเกณฑ์ของ hiring manager เปลี่ยนไปเรื่อยๆ (เช่น เพิ่งบอกว่าอยากได้ประสบการณ์ startup แล้วค่อยเพิ่ม zero-to-one) ถ้า prompt เป็นกฎที่ตั้งไว้ล่วงหน้า ต้องเขียนใหม่ทุกรอบ จึงต้องวางให้ prompt เปลี่ยนตาม preferences ตั้งแต่ฐานระบบ", "en": "Hiring criteria drift, so evaluation prompts must evolve as a foundation, not an add-on."}, {"th": "ขั้นตอน: ลบข้อมูลระบุตัวตนของผู้สมัคร (ชื่อ อีเมล เบอร์) แล้วจับคู่กับ ICP เพื่อสร้างผลประเมิน ส่วน ICP คือ prompt ที่เรียนรู้และปรับตัวเอง", "en": "Redact candidates, match against the ICP to produce an evaluation; the ICP is the self-improving prompt."}, {"th": "หลักคิดคือ human in the center ไม่ใช่แค่ in the loop: ระบบเป็น apprentice ช่วยงานหนักและชี้ข้อสังเกต ส่วนการผ่านหรือปัดผู้สมัครเป็นของ recruiter เสมอ", "en": "Human at the center; the system is an apprentice and never decides."}, {"th": "ICP agent รับ user messages (ผ่าน ปัด feedback แก้ ICP ด้วยมือ) และเพราะ feedback เป็นเชิงเปรียบเทียบกับสิ่งที่เพิ่งเห็น จึงมี tool เฉพาะชื่อ query files ไว้ไล่ resume ที่ลบข้อมูลตัวตนแล้ว เพื่อตีความคำอย่าง 'Python น้อยไป' ก่อนส่งให้ ICP manager agent ที่มีหน้าที่เดียวคือรักษา prompt ให้ทันสมัย", "en": "A query-files tool resolves relative feedback against past resumes before the ICP manager agent updates the prompt."}, {"th": "ทำไมเป็น workflow ที่มี agent ครอบอยู่ข้างบน: ปริมาณพันๆ ใบสมัครต่อวันรับต้นทุนไม่ไหวถ้าโยนทุกอย่างให้ agent จึงต้องประหยัด token", "en": "Volume forces an efficient workflow with an agent on top rather than one maximal agent."}, {"th": "ICP เป็นเอกสาร markdown ภาษาธรรมชาติ (role summary, must haves, nice to haves, red flags) ไม่ใช้ weighting หรือ if-statement เพราะ recruiter คิดและเขียนแบบนั้น และ LLM เก่งภาษา", "en": "ICP is plain markdown prose, no weights or conditionals."}, {"th": "เลือกโมเดล: Haiku ทำ evaluation ปริมาณสูง Sonnet ทำงานหาแพตเทิร์นที่ latency สำคัญน้อยกว่า ผู้พูดว่าใช้โมเดล Claude เพราะต้องการตัวที่คิดเชิงวิพากษ์ ไม่เชื่อ fluff ใน CV ตามคำผู้พูด ในเดโมเห็น Sonnet 4.6 เรียก tool อัปเดต ICP แล้วแสดง diff สีเขียวแดงให้ผู้ใช้ยืนยันหรือแก้", "en": "Haiku for evaluations, Sonnet for pattern finding; ICP changes shown as diffs for the user to confirm."}], "numbers": [{"th": "ลูกค้ารายหนึ่งได้ 2,740 ใบสมัครสำหรับงานเดียวใน 24 ชั่วโมง (ผู้พูดบอกว่าเกิดบ่อยกับงาน remote ระดับ junior)"}, {"th": "คำตอบของคำถามในใบสมัคร (เช่น ทำไมอยากทำงานที่นี่) ยาวขึ้นราว 50% ในสองปีที่ผ่านมา ตามที่ผู้พูดบอก"}, {"th": "โมเดลที่ใช้: Haiku สำหรับ evaluation, Sonnet สำหรับ ICP agent (ในเดโมเห็น Sonnet 4.6)"}, {"th": "ผู้พูดบอกว่าปกติเริ่มเห็นแพตเทิร์นทุก 100-200 ครั้ง จึงไม่ปรับ ICP จาก feedback ครั้งเดียว"}, {"th": "ประมวลผลหลายพันใบสมัครต่อวัน และมี input per token limit พิเศษจาก Anthropic ตามคำผู้พูด"}], "quotes": [{"text": "Make the user the master and make the system the apprentice.", "th": "ให้ผู้ใช้เป็นนาย และให้ระบบเป็นลูกมือ"}, {"text": "Allow them to reason in prose, not in flow charts.", "th": "ให้ LLM คิดเป็นร้อยแก้ว ไม่ใช่ flow chart"}, {"text": "Lean into what LLMs are good at, which is natural language.", "th": "ใช้จุดแข็งของ LLM คือภาษาธรรมชาติ"}], "steps": [], "takeaways_th": ["ถ้าระบบให้ผู้ใช้เป็นคนตัดสินใจ ให้ถือว่า preferences จะเปลี่ยนแน่ และออกแบบกลไกอัปเดต prompt ตั้งแต่วันแรก", "เก็บเกณฑ์ประเมินเป็นเอกสารภาษาธรรมชาติที่ผู้ใช้อ่านและแก้เองได้ แทน weighting หรือ if-statement", "แสดงการเปลี่ยน prompt เป็น diff ให้ผู้ใช้ confirm หรือแก้ก่อนมีผล และอย่าอัปเดตจากตัวอย่างเดียว รอให้เห็นแพตเทิร์น", "แยกงานปริมาณสูงที่ต้องถูกและเร็ว (โมเดลเล็ก) ออกจากงานหาแพตเทิร์นที่ใช้ความฉลาด (โมเดลใหญ่)", "ฝัง guardrail ในสถาปัตยกรรม ให้ระบบช่วยและแนะนำ แต่ไม่ overrule ผู้ใช้"], "caveats_th": ["transcript มาจาก Whisper large-v3 ที่ถอดเอง ชื่อเฉพาะอาจเพี้ยน เช่น 'clored models' = Claude models, 'Langchain/LandGraph' = LangChain/LangGraph, 'UPSA ICP tool' น่าจะเป็น upsert ICP tool", "ช่วงเล่าเรื่อง feedback เชิงเปรียบเทียบใน ICP agent มีประโยคซ้ำวนและขาดความหมายในไฟล์ จึงสรุปจากส่วนที่ชัดเท่านั้น", "ตัวเลข 2,740 และ 50% เป็นข้ออ้างของผู้พูด ไม่มีแหล่งอ้างอิงในคลิป", "ผู้พูดบอกว่ายังโต้เถียงกับตัวแทน Anthropic เรื่อง Claude Managed Agents ปัจจุบัน deploy บน LangChain/LangGraph"], "related_existing": ["prompt-engineering", "cheap-model-delegation", "agent-trust-ladder-verification-first", "skills-as-organization"], "dur": "16:46", "url": "https://www.youtube.com/watch?v=A3rmSUp6Dxg", "asr": "whisper", "wiki": "cwc-london-35"}, {"n": 36, "id": "uGroRwlC9y4", "title_en": "Teaching agents to learn from your team", "title_th": "สอน agent ให้เรียนรู้จากทีม: เคส Buzz ของ Warp กับ feedback loop รายวัน", "speakers": [{"name": "Petra", "role": "Head of developer experience, Warp"}], "track": "domain-case", "tags": ["self-improving", "agent-reliability", "prompt-engineering", "mcp-tools-skills"], "tldr_th": "Petra จาก Warp เล่าเคส Buzz agent ตอบ mention ในโซเชียลที่ต้องใช้ judgment และ taste ซึ่งเทสต์อัตโนมัติวัดไม่ได้ เธอแก้ด้วยสามอย่างที่ต้องมาด้วยกัน ได้แก่ เขียน skill เป็น principles แทน rules, สอนให้ agent เรียนรู้ว่าต้องแก้ instruction ตรงไหน และออกแบบ feedback loop รายวันผ่าน Slack emoji กับ pull request ข้อสรุปคือให้ลงแรงกับ feedback loop มากกว่าการขัด prompt แรกให้สมบูรณ์", "tldr_en": "Warp's Buzz agent handles judgment-heavy social replies by using principles instead of rules, a skill that teaches it to learn from feedback, and a daily Slack-to-PR loop; design the feedback loop rather than the perfect first prompt.", "audience_th": "คนที่สร้าง agent ประจำวันแล้วติดอยู่ที่ 80% (ใช้ได้เกือบแต่ไม่กล้าปล่อยเอง) โดยเฉพาะงานที่ต้องใช้ดุลพินิจ", "points": [{"th": "ผู้พูดถามผู้ฟังว่าใครเคยสร้าง agent ที่รันประจำแล้วยังใช้งานจริงและพอใจ มือลดลงมาก จึงตั้งโจทย์ว่า agent มักตายที่ช่อง 80% ที่ยังต้องคอยแก้ prompt จนแย่กว่าไม่มี agent", "en": "Many agents die at the 80% mark, costing more tuning time than they save."}, {"th": "Buzz เป็น agent ของ Warp ที่ดู social mentions แล้วตัดสินว่าจะ reply, like หรือ skip พร้อมร่างข้อความให้ ประกอบด้วยราว 15 skills แทบไม่มีโค้ด สร้างได้ในไม่กี่วัน และต่อกับ X API กับ Slack", "en": "Buzz triages mentions into reply, like or skip and drafts replies; ~15 skills, nearly zero code."}, {"th": "ทำไม loop แบบ Ralph loop ใช้ไม่ได้ตรงๆ: ต้องมี external check ที่ชัด (unit test, browser) งานที่ต้องใช้ judgment และ taste ไม่มีเทสต์ และ feedback จริงจากชุมชนช้าและซับซ้อน", "en": "External-check loops like Ralph work for code but not for taste-based tasks."}, {"th": "การลองครั้งแรกคือขัด prompt ผลออกมาเป็น checklist ของกฎ if X then Y ฟังเหมือนหุ่นยนต์และแตกเมื่อเจอสถานการณ์ใหม่ จึงสลับเป็น principles แบบที่อธิบายให้เพื่อนร่วมทีมใหม่ ผลคือ skill file สั้นลงราวหนึ่งในห้าแต่ output ดีขึ้น", "en": "Switching from brittle rules to principles gave a skill file about a fifth the length with better output."}, {"th": "พอให้ agent เรียนจาก feedback มันกลับไปเพิ่มกฎเฉพาะเคส (เช่น อย่าพูดเรื่องราคาในบรรทัดแรก) จึงต้องสอน 'วิธีเรียน' ด้วย skill อีกตัว ให้เทียบ instruction กับ output ที่คนต้องการ แล้วถามว่า instruction ควรเป็นอย่างไรจึงได้ผลนั้น และสรุปเป็นข้อที่ยืดหยุ่นกว่า", "en": "A second skill teaches Buzz to generalize feedback into flexible principles instead of narrow rules."}, {"th": "feedback loop รายวัน: Buzz ส่งข้อเสนอเข้า Slack channel พร้อมเหตุผล ทีมกด emoji บอกว่าทำอะไรจริง และเขียนโน้ตใน thread ได้ Buzz รันทุกวัน เทียบสิ่งที่เสนอกับสิ่งที่ทีมทำ แล้วเปิด pull request แก้ skill ใน Git repo ทีมรีวิวราว 60 วินาที", "en": "Daily loop: Slack suggestions, emoji reactions and notes, then Buzz opens a PR editing its skills."}, {"th": "ข้อสังเกต: ส่วนที่ยากที่สุดคือมนุษย์ ต้องทำให้ให้ feedback ง่ายที่สุดในเครื่องมือที่ใช้อยู่แล้ว และทำให้ agent เหมือนเพื่อนร่วมทีมที่มีชื่อกับบุคลิก ผู้พูดบอกว่ายังคงให้คน review/merge PR เพื่อไม่ให้ agent drift ไปทางแปลกๆ", "en": "Humans are the hard part: keep feedback low-friction, give the agent a teammate persona, keep PR review as control."}, {"th": "Buzz รันบน Oz ซึ่งเป็นแพลตฟอร์ม orchestration ของ Warp สำหรับ cloud agents ทริกเกอร์ด้วย schedule หรือ trigger คล้าย routines ที่เห็นในงานเมื่อวาน", "en": "Runs on Oz, Warp's cloud agent orchestration, via schedules and triggers."}], "numbers": [{"th": "Buzz ประกอบด้วยราว 15 skills แทบไม่มีโค้ด สร้างในไม่กี่วัน (ตามผู้พูด)"}, {"th": "skill file สั้นลงราวหนึ่งในห้าหลังเปลี่ยนจาก rules เป็น principles"}, {"th": "mentions ราวไม่กี่พันต่อเดือน ประมาณ 50% ถูก skip"}, {"th": "cloud agent runs ไม่กี่พันครั้งต่อเดือน รันบน Oz"}, {"th": "รีวิว PR ประจำวันใช้ราว 60 วินาที เพราะเป็นการแก้ภาษาอังกฤษไม่กี่บรรทัด"}, {"th": "ผู้พูดอ้างว่า draft ของ Buzz ตัดงานออกราว 90% เหลือ 10% ที่มีค่าที่สุดให้คนทำ"}], "quotes": [{"text": "The agent sort of needed to learn how to learn.", "th": "agent ต้องเรียนรู้วิธีเรียนรู้ด้วย"}, {"text": "Think about how your agent will improve over time and not just how to nail that initial prompt.", "th": "คิดว่า agent จะดีขึ้นตามเวลาอย่างไร ไม่ใช่แค่ทำ prompt แรกให้เป๊ะ"}, {"text": "The trickiest part of designing feedback loops is always the humans.", "th": "ส่วนที่ยากที่สุดของการออกแบบ feedback loop คือมนุษย์เสมอ"}], "steps": [], "takeaways_th": ["เขียน skill เป็น principles ที่อธิบายว่าคิดอย่างไรและทำไม ไม่ใช่รายการ if-then ลองดูว่า skill สั้นลงและยืดหยุ่นขึ้นไหม", "เพิ่ม skill ที่สอน agent ให้เทียบ instruction กับ output ที่ต้องการ แล้วสรุปเป็นหลักทั่วไป ไม่ใช่กฎเฉพาะเคส", "เก็บ skills ใน Git แล้วให้ agent เปิด PR แก้ instruction รายวัน ให้คนรีวิวเร็วๆ เพื่อคุมการ drift", "เก็บสัญญาณจากงานที่ทีมทำอยู่แล้ว เช่น emoji reaction กับ thread note ใน Slack ให้ภาระเพิ่มของคนน้อยที่สุด", "ตั้งชื่อและบุคลิกให้ agent ให้ทีมรู้สึกเป็นเพื่อนร่วมงาน เพื่อให้ feedback มีคุณภาพ"], "caveats_th": ["transcript มาจาก Whisper large-v3 ที่ถอดเอง ชื่อเฉพาะอาจเพี้ยน เช่น 'Cloud Code' = Claude Code, 'scale file' ในไฟล์น่าจะหมายถึง skill file, 'Ralph loop' ตามที่ได้ยิน", "ผู้พูดแนะนำตัวว่าชื่อ Petra และเป็นหัวหน้า developer experience ที่ Warp ไม่ได้บอกนามสกุล", "ตัวเลขเช่น 50% skip, 90%/10% และจำนวน mentions/runs ต่อเดือนเป็นคำบอกของผู้พูด ไม่มีหลักฐานในคลิป และ 'few thousand' ฟังจาก ASR อาจไม่ตรงทุกจุด", "คำว่า 'routines on the cloud code' ที่ผู้พูดอ้างถึงงานเมื่อวาน ไม่ได้อธิบายรายละเอียดในคลิปนี้"], "related_existing": ["agent-skills", "skills-as-organization", "loop-engineering", "claude-code-background-agents", "long-horizon-agents"], "dur": "28:29", "url": "https://www.youtube.com/watch?v=uGroRwlC9y4", "asr": "whisper", "wiki": "cwc-london-36"}, {"n": 37, "id": "K4-flzsPraE", "title_en": "Building the best agentic analytics harness: Powered by Claude, built with Claude Code", "title_th": "Omni สร้าง agent วิเคราะห์ข้อมูล Blobby: บทเรียนจาก harness, semantic layer และ evals", "speakers": [{"name": "Chris Merrick", "role": "Cofounder and CTO, Omni (ตามคำอธิบายคลิป และผู้พูดบอกว่าตนเป็น CTO)"}], "track": "domain-case", "tags": ["claude-code", "subagents", "evals", "model-selection", "agent-reliability"], "tldr_th": "Chris Merrick CTO ของ Omni เล่าว่าทีม engineering ราว 25 คนใช้ Claude Code เร่งความเร็ว และสร้าง agent วิเคราะห์ข้อมูลชื่อ Blobby บน semantic layer ใน 18 เดือน บทเรียนหลักคือเพิ่ม context ในนิยามข้อมูล, ให้ agentic loop กู้จาก error ได้, รวม sub-agent กลับเข้า agent ตัวนอก (consolidating the brain) และให้ Claude เขียน SQL แล้ว parse แทนรูปแบบ JSON ที่คิดขึ้นเอง", "tldr_en": "Omni's CTO describes building the Blobby analytics agent over 18 months: richer semantic-layer context, error recovery, merging sub-agent tools into the outer agent, and letting Claude write SQL that Omni parses.", "audience_th": "วิศวกรที่สร้าง agent บนข้อมูลองค์กรหรือออกแบบ agent harness แ aching กับ context engineering แล้วลดต่อด้วย Sonnet + Opus advisor (ผู้พูดสรุปว่าลดเกิน 10 เท่า; ตัวเลขเป็นของบริษัทสมมติในเดโม ไม่ใช่ราคา API จริง)", "talk": 4}, {"th": "ทำความสะอาด tool response: dedupe บทความจาก web search ก่อนส่งให้ Claude ลด input token 77% ต้นทุน 65% และ accuracy เพิ่ม 9% ตามที่ผู้พูดบอกว่าวัดด้วย eval", "talk": 10}, {"th": "ผู้พูดอธิบายว่า adaptive thinking ไม่ใช่ model router และการปิด thinking คือการถอด capability ไม่ใช่ลด effort ค่า default ของ Claude Code กับ claude.ai คือ extra high", "talk": 15}, {"th": "uncached token ราคาแพงกว่า cached ราว 10 เท่า (ตามผู้พูดอธิบาย KV cache) และไม่ควรใส่ข้อมูลที่เปลี่ยนตลอดไว้ต้น prompt", "talk": 2}, {"th": "ผู้พูดบอกว่า Opus 4.7 + adaptive thinking ทำให้ token เพิ่มราว 3 เท่าและ latency ราว 3 เท่าในตัวอย่างหนึ่ง จึงต้องชั่งกับคุณภาพที่ได้", "talk": 5}, {"th": "ถ้า eval ไม่มี ให้ถามทุก grader ว่าให้ข้อมูลที่ลงมือแก้ได้ไหม ใช้ code grader กับของที่นับได้ ใช้ model judge กับของที่ต้องใช้วิจารณญาณ และ calibrate เป็นระยะ", "talk": 28}], "talks": [2, 4, 5, 6, 10, 15, 28]}, {"title_th": "Memory และระบบที่เรียนรู้ด้วยตัวเอง: ปรับที่ prompt, skill หรือ memory ก็ได้ แต่ต้องมีคนคุม", "title_en": "Memory and self-improving systems: learn at the prompt, skill or memory layer, with a human in the loop", "body_th": ["คลิปสายนี้ตอบคำถามเดียวกันด้วยกลไกต่างชั้น Managed Agents ให้ memory store เป็น file system ที่แชร์ได้พร้อม version history และ dreaming เป็น batch นอก session ที่จัด memory ให้เป็นระเบียบ ส่วน Metaview, Warp และ Lovable ทำที่ชั้น prompt, skill และ platform ตามลำดับ", "ทุกเคสที่เล่ามีขั้นให้มนุษย์ยืนยันก่อนการเปลี่ยนมีผล เช่น diff ให้ recruiter confirm, PR รายวันให้คนรีวิว 60 วินาที หรือ PR ที่ agent เสนอให้วิศวกรรีวิว"], "evidence": [{"th": "ผู้พูดบอกว่า dreaming ช่วย Harvey เพิ่ม completion rate 6 เท่า และ Rakuten ลด first-pass error 97% (คำอ้าง) แนะให้แยก memory ระดับองค์กรแบบ read-only จากระดับงานแบบ read-write", "talk": 11}, {"th": "เวิร์กชอปเปรียบเทียบ agent ก่อนมี memory, หลังมี memory และหลัง dream โดย dream รันเป็น multi-agent batch ที่ไม่ทำลาย memory เดิม แต่ผลลงใน output store ใหม่ให้อ่าน diff ก่อนสลับ", "talk": 29}, {"th": "Metaview: agent ดูว่า recruiter ผ่านหรือปัดใคร แล้วปรับ Ideal Candidate Profile ที่เป็น markdown prompt โดยไม่ปรับจากตัวอย่างเดียว รอให้เห็นแพตเทิร์นทุก 100-200 ครั้ง (ตามผู้พูด)", "talk": 35}, {"th": "Warp (Buzz): เปลี่ยน skill จาก rules เป็น principles ทำให้ไฟล์สั้นลงราวหนึ่งในห้า และมี loop รายวันที่เปิด PR แก้ skill ให้คนรีวิว", "talk": 36}, {"th": "Lovable: Lovable Overflow ฉีดวิธีแก้ปัญหาเข้า context ก่อนผู้ใช้ติด ผู้พูดอ้างว่าอัตรา stuck ลด 5% และ vent tool ทำให้ merge fix ราว 10 รายการต่อวัน", "talk": 16}], "talks": [11, 16, 18, 24, 29, 35, 36]}, {"title_th": "Agent เฉพาะทาง: ยืมบทเรียนจาก coding agent ได้ แต่ต้องคิดเรื่อง verification ใหม่", "title_en": "Domain agents: borrow from coding agents, but rethink verification", "body_th": ["Legora เสนอกรอบสามถัง นำมาใช้ตรงๆ (planning, sub-agents, human in the loop), แปลงให้เข้าโดเมน (loop อ่าน-แก้-ตรวจกับเอกสาร docx) และคิดใหม่ (citation, tabular review) กรอบนี้อธิบายได้ว่าเคสอื่นในงานวางตัวเองตรงไหน", "จุดที่ทุกเคสเจอเหมือนกันคือ governance กับ security boundary ตั้งแต่ต้น Man Group ให้ skill มีเจ้าของ eval และ lifecycle เหมือน production code และเคสอาชญากรรมการเงินให้ MCP gateway จัดการ SSO, RBAC และ audit trail"], "evidence": [{"th": "Legora: ผู้พูดบอกว่ามีลูกค้ากว่า 1,000 ราย (คำอ้าง) แนะให้แปลงเอกสารที่ไม่ใช่ข้อความเรียบเป็น intermediate representation แล้วใช้ loop read, edit, verify", "talk": 12}, {"th": "Man Group: ผู้พูดบอกว่ามีสัญญาณเทรดที่ AI คิด backtest และเขียนข้อเสนอ รันด้วยเงินจริงแล้วโดยมีมนุษย์รีวิว ใช้ governed skills เกิน 100 ตัว", "talk": 9}, {"th": "ทีม fintech ฝรั่งเศส: Cowork plugin ต่อ MCP gateway (ContextForge) พร้อม RBAC ผ่าน Terraform และใช้ evals วัด tool use, grounding, reasoning ตั้งแต่ต้นแบบ TDD", "talk": 32}, {"th": "Omni: ผู้พูดเล่าบทเรียน 18 เดือนของ analytics agent เรื่อง context ใน semantic layer, error recovery และการรวม sub-agent เข้า agent ต     ${(SYN.themes||[]).length?`<nav class="noprint flex flex-wrap gap-2 py-4 text-sm">${SYN.themes.map((h,i)=>`<a href="#theme-${i+1}" class="px-3 py-1.5 rounded-full border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800">${i+1}. ${esc(T(h.title_th,h.title_en))}</a>`).join('')}</nav>`:''}
    <div class="space-y-5 mt-4">${themes}</div>
    ${aud?`<h2 class="mt-14 text-2xl font-semibold">ควรดูคลิปไหนก่อน</h2><div class="mt-4 grid gap-4 sm:grid-cols-2">${aud}</div>`:''}
    ${nums?`<h2 class="mt-14 text-2xl font-semibold">ตัวเลขที่ผู้พูดอ้างถึง</h2><p class="text-xs text-zinc-500 mt-1">ตามที่ผู้พูดบอกในคลิป ไม่ได้ยืนยันกับแหล่งอื่น</p><ul class="mt-4 space-y-2">${nums}</ul>`:''}
    ${oq?`<h2 class="mt-14 text-2xl font-semibold">ข้อสังเกต / ที่ยังไม่ชัด</h2><ul class="mt-4 list-disc pl-5 space-y-1.5 text-sm leading-relaxed">${oq}</ul>`:''}
    <h2 class="mt-14 text-2xl font-semibold">ทุกคลิปในเพลย์ลิสต์</h2>
    <table class="mt-4 w-full text-left"><tbody>${all}</tbody></table>
  </main>` + footer();
  lucide.createIcons();
}
render();
</script>
</body></html>
