มถังสำหรับสร้าง agent ในสายงานอื่นจากบทเรียนของ coding agent คือ นำมาใช้ตรงๆ (planning, sub-agents, human in the loop), แปลงให้เข้ากับโดเมน (แก้ docx ด้วย loop อ่าน-แก้-ตรวจ และ linting เอกสารกฎหมาย) และคิดใหม่เอง (citation, tabular review สำหรับ due diligence) ข้อสรุปคือให้โมเดลรู้สึกเหมือนอยู่ใน coding agent harness แล้วทำงานกฎหมาย", "tldr_en": "Legora's engineer shows a three-bucket framework for vertical agents: reuse coding-agent patterns, translate similar ones (docx editing loop, legal linting), and invent domain-specific pieces (citations, tabular review).", "audience_th": "คนที่สร้าง agent ในโดเมนนอกเหนือจากงานโค้ด (กฎหมาย บัญชี การแพทย์ ฯลฯ) และอยากหยิบ pattern ของ coding agent ไปใช้", "points": [{"th": "Legora สร้าง workspace AI ให้ทนายความ ผู้พูดบอกว่ามีลูกค้ากว่าพันราย รวมสำนักงานกฎหมายขนาดใหญ่ ก่อตั้งที่ Stockholm ราวหกเดือนก่อนพวกเขาตระหนักว่าโดเมนนอก coding ตามหลังอยู่ จึงเริ่มเรียนรู้จาก coding agent", "en": "Legora builds an AI workspace for lawyers; six months ago they realized non-coding verticals lagged and began learning from coding agents."}, {"th": "งานกฎหมายกับงานโค้ดคล้ายกันหลายด้าน ได้แก่ พึ่งงานเดิมมาก ทำกับเอกสารข้อความ มีข้อกำหนดเข้มในองค์กร และมีวัฒนธรรมรีวิว (partner รีวิวร่างของ associate เหมือน review PR) ผู้พูดบอกว่า knowledge work อื่นก็เทียบแบบนี้ได้", "en": "Legal and coding work share reliance on prior work, text documents, strict conventions and review culture."}, {"th": "สามถัง: (1) ใช้ซ้ำตรงๆ เช่น to-dos, planning, sub-agents, sandbox, human in the loop ซึ่งได้ฟรีเมื่อใช้ Anthropic agent SDK หรือ managed agents (2) แปลงให้เข้ากับโดเมน (3) สร้างใหม่ เช่น citation ที่อ้างอิงทุกคำตอบ และการทำงานกับเอกสารจำนวนมาก", "en": "Three buckets: reuse (planning, sub-agents, sandboxes, HITL), translate, and invent (citations, large document sets)."}, {"th": "ตัวอย่างใช้ซ้ำ: planning mode ให้ทนายวางแผนและสำรวจบริบทก่อนให้ agent ลงมือ และการขออนุมัติ tool call ที่อันตราย (ไม่อยากให้ลบเอกสารลูกค้าเอง) ใช้ UX ที่ coding agent พิสูจน์แล้วโดยไม่ต้องคิดใหม่", "en": "Reused directly: planning mode and approval of dangerous tool calls."}, {"th": "แปลงการแก้ docx: ระบบเดิมส่งเจตนาแก้ไปให้โมเดล reasoning อีกตัวแล้วแตกเป็นหลายคำสั่งย่อย ซึ่งมีปัญหา hand-off เมื่อ agent มี tool มากขึ้น ระบบใหม่ใช้ loop แบบ coding agent คือ read, edit, verify บน intermediate representation แบบข้อความเรียบของ docx", "en": "Docx editing moved from multi-model hand-offs to a read-edit-verify loop over a flat text representation."}, {"th": "POC แรกให้ agent แปลเอกสาร 10 หน้าจากอังกฤษเป็นสวีเดนทีละย่อหน้า ซึ่งงานนี้เคยทำให้ครบยากมาก agent วนอ่านเจอย่อหน้าที่ตกหล่นแล้วกลับไปแก้ ราว 10 นาทีก็แปลครบ และผู้พูดบอกว่ารันบน Haiku ด้วยซ้ำ", "en": "A 10-page English-to-Swedish paragraph translation POC completed exhaustively in ~10 minutes, even on Haiku."}, {"th": "ผู้พูดมอง mental model ว่าให้โมเดลรู้สึกเหมือนอยู่ใน coding agent harness แต่ทำงานกฎหมาย จะได้ประโยชน์จาก RL และ fine-tuning ที่ทำกับ harness แบบโค้ด และมี linting สำหรับเอกสารกฎหมาย (เช่นตรวจว่าการอ้างอิงข้ามข้อยังถูกต้องหลังลบย่อหน้า) พร้อมเพิ่มการ lint ด้วย LLM ได้", "en": "Make the model feel like it's inside a coding harness; add 'ESLint for legal documents', e.g. cross-reference checks."}, {"th": "สิ่งที่ต้องคิดใหม่คือ due diligence: Tabular Review เป็นตารางที่แถวคือเอกสารและคอลัมน์คือข้อมูลที่ให้ LLM สกัด agent ใช้เครื่องมือนี้เหมือนคนได้ และทนายตรวจคำตอบโดยดูเหตุผล citation และ mark verified เดโมแสดงทั้งการแก้สัญญาจ้างหลายฉบับพร้อม redline และจัดหมวดเอกสาร ~100 ไฟล์", "en": "Invented: Tabular Review for due diligence with citations and verification; demos show multi-document redlined edits and bulk review."}], "numbers": [{"th": "Legora มีลูกค้ากว่า 1,000 ราย ตามที่ผู้พูดบอก"}, {"th": "มูลค่าบริษัทเกิน $5 billion และเติบโตจาก 1 ไปถึง 100 million ARR แบบ 'record sprint' ตามที่ผู้พูดอ้าง"}, {"th": "POC แปลเอกสาร 10 หน้า อังกฤษเป็นสวีเดนทีละย่อหน้า ใช้เวลาราว 10 นาที ด้วยโมเดล Haiku"}, {"th": "เดโม due diligence ใช้เอกสารราว 100 ไฟล์ และเดโมแก้สัญญาจ้างเพิ่มวันหยุดคริสต์มาสหนึ่งสัปดาห์ให้ทุกคน"}, {"th": "ตัวอย่างเทมเพลต 50 หน้าที่ต้องเติมหลายจุด ใช้อธิบายปัญหา exhaustiveness ของระบบเดิม"}], "quotes": [{"text": "my mental model is kind of that you want to have the model almost feel like it's inside a coding agent harness, and it just does a legal task.", "th": "mental model คือให้โมเดลรู้สึกเหมือนอยู่ใน coding agent harness แต่ทำงานกฎหมาย"}, {"text": "It's basically ESLint, but for legal documents.", "th": "พูดง่ายๆ คือ ESLint สำหรับเอกสารกฎหมาย"}, {"text": "Whenever they ship something new, you steal the thing and benefit from it.", "th": "พอ coding agent ปล่อยของใหม่ ก็หยิบมาใช้ได้เลย"}], "steps": [], "takeaways_th": ["จัดฟีเจอร์ของ agent ตัวเองเป็นสามถัง: ใช้ซ้ำ (planning, sub-agents, approval), แปลง, และสร้างใหม่ ก่อนเริ่มออกแบบ", "ถ้าต้องแก้เอกสารที่ไม่ใช่ข้อความเรียบ ลองแปลงเป็น intermediate representation แบบข้อความแล้วใช้ loop read, edit, verify แทนการส่งต่อระหว่างโมเดลหลายตัว", "เพิ่มตัวตรวจแบบ static (เช่นการอ้างอิงข้ามข้อ) เป็น feedback loop ให้ agent ในโดเมนของตัวเอง", "เมื่อมีเอกสารจำนวนมาก ให้เครื่องมือแบบตาราง (แถวคือเอกสาร คอลัมน์คือข้อมูลที่สกัด) พร้อม citation เพื่อให้คนตรวจสอบได้", "ติดตามฟีเจอร์ใหม่ของ coding agent แล้วดูว่าอะไรหยิบมาใช้หรือแปลงได้"], "caveats_th": ["transcript ถอดด้วย Whisper large-v3 ในเครื่อง ไม่ใช่ข้อความต้นฉบับของผู้พูด ชื่อเฉพาะอาจเพี้ยน (Cloud Code = Claude Code, 'Ligora' ในบางจุดคือ Legora, 'your diligence' = due diligence, 'tracing documents' อาจเป็นเอกสารยาวอื่น)", "ชื่อผู้พูดสะกด Jacob ใน transcript แต่คำอธิบายคลิปใช้ Jakob จึงใช้ตามคำอธิบายคลิป และตำแหน่ง Staff Software Engineer มาจากคำอธิบายคลิป ไม่ใช่คำแนะนำตัวในเสียง", "ตัวเลขบริษัท (ลูกค้ากว่า 1,000 มูลค่ากว่า $5 billion ARR 1 ถึง 100 million) เป็นข้ออ้างของผู้พูด ไม่ได้ตรวจสอบกับแหล่งอื่น และยอดเงินอาจฟังคลาดเคลื่อน", "ช่วงท้ายเดโมมีประโยค 'It figured out the key points' ซ้ำหลายครั้งจาก ASR จึงไม่สรุปรายละเอียดตรงนั้น", "เคส Haiku เป็นข้ออ้างจากประสบการณ์ POC ครั้งเดียว ไม่ใช่ผลการประเมินเชิงระบบ"], "related_existing": ["claude-agent-sdk", "long-horizon-agents", "claude-code-subagents", "coding-agents-execution-layer", "harness-engineering"], "dur": "28:43", "url": "https://www.youtube.com/watch?v=nho1YAEPuwA", "asr": "whisper", "wiki": "cwc-london-12"}, {"n": 13, "id": "zenIB7XLZxQ", "title_en": "How to get to production faster with Claude Managed Agents", "title_th": "Claude Managed Agents: ให้แพลตฟอร์มดูแลโครงสร้าง agent แล้วไป production ได้เร็วขึ้น", "speakers": [{"name": "Michael", "role": "member of technical staff, Anthropic (Claude Managed Agents)"}, {"name": "Harrison", "role": "member of technical staff, Anthropic (Claude Managed Agents)"}, {"name": "Mike", "role": "Cloudflare (ผู้ร่วมเสวนา)"}, {"name": "Yvon", "role": "Daytona (ผู้ร่วมเสวนา ชื่อสะกดจาก ASR)"}, {"name": "Akshat", "role": "Modal (ผู้ร่วมเสวนา ชื่อสะกดจาก ASR)"}, {"name": "Luke", "role": "Vercel (ผู้ร่วมเสวนา)"}], "track": "agents-platform", "tags": ["managed-agents", "cloud-platforms", "mcp-tools-skills", "subagents", "agent-reliability"], "tldr_th": "ทีม Managed Agents อธิบายว่าคอขวดของ agent ตอนนี้คือโครงสร้างพื้นฐานรอบโมเดล ไม่ใช่ความฉลาด Managed Agents จึงให้ primitive สำเร็จรูป (agent, environment, session, event stream) พร้อมฟีเจอร์ขั้นสูง เช่น multi-agent, outcomes, memory, dreaming, self-hosted sandboxes และ MCP tunnels แล้วปิดด้วยเสวนากับ Cloudflare, Daytona, Modal, Vercel เรื่องการรัน sandbox ระดับใหญ่", "tldr_en": "Managed Agents packages agent infrastructure into primitives (agent, environment, session, event stream) with advanced features like outcomes, memory, dreaming, self-hosted sandboxes and MCP tunnels; a partner panel discusses sandbox fleets.", "audience_th": "นักพัฒนาที่จะ deploy agent จริงและอยากรู้ว่า Managed Agents จัดการอะไรให้ รวมถึงคนสนใจ sandbox/โครงสร้างพื้นฐานของ agent", "points": [{"th": "ผู้พูดเล่าเส้นทางความสามารถจาก Claude 3 ที่ทำงานสั้นๆ, Opus 4 ที่ Claude Code ขับทั้ง feature ได้, จนถึง Opus 4.7 ที่คนเคลียร์ backlog ทั้งก้อนแล้วตื่นมาเจอ PR พร้อม merge และมองว่างานระดับทั้งไตรมาสจะเสร็จในไม่กี่ชั่วโมง เช่น M&A pipeline ด้วย agent team", "en": "From Claude 3 to Opus 4.7: backlogs cleared overnight, quarter-sized work in hours."}, {"th": "ผู้พูดบอกว่าคอขวดตอนนี้คือโครงสร้างพื้นฐานรอบโมเดล ไม่ใช่ความฉลาด จากการวิจัยพบ 3 จุดติด คือ context management/memory, infrastructure (reliability, scalability, security, latency ซึ่งถูกอ้างเป็นตัวขวางอันดับหนึ่ง) และ observability", "en": "Bottleneck is infrastructure: context/memory, infra concerns (cited as number one), and observability."}, {"th": "agent ต้องการ credential ที่ปลอดภัย การเข้าถึงระบบภายใน และ identity/auth ของตัวเอง รวมถึงรูปแบบการใช้งานที่เปลี่ยนจากแชตตอบกลับ ไปเป็น outcome-oriented และการเริ่มงานแล้วกลับมาทำต่อทีหลังเป็นสัปดาห์หรือเดือน", "en": "Agents need credentials, identity, and outcome-oriented, resumable interaction models."}, {"th": "เริ่มใช้ 4 ขั้น: (1) define agent = system prompt, model, skills, tools, permissions (2) สร้าง environment/sandbox กำหนด network allow list และ package (3) เริ่ม session สั่งงาน (4) ฟัง event stream เพื่อดูและโต้ตอบ", "en": "Four steps: define agent, environment, session, listen to event stream."}, {"th": "event stream แบ่ง 4 กลุ่ม: user events (ข้อความ, รูป, เอกสาร, interrupt, tool result ของ custom tool, human-in-the-loop confirmation, outcome definition), agent events (ตอบ, เรียก tool, ประสานกับ agent อื่น), session events (สถานะ idle/running, error recovery, outcome processing) และ span events (บอกจุดเริ่ม/จบของงานยาวๆ)", "en": "Events: user, agent, session, and span events."}, {"th": "เดโมคอนโซลกับ agent สมมติชื่อ Pascal วิเคราะห์พฤติกรรมซื้อของชำ: เห็น event แบบ real time, ดู system prompt/model/MCP config ฝั่งขวา, ดู network กับ package ของ environment ทั้งหมดเปิดผ่าน API และมีปุ่ม Ask Claude ให้ Claude อ่าน transcript แล้วแนะนำการปรับ config เช่น Python script ที่ใช้เวลาเกิน 20 วินาที", "en": "Console demo with Pascal: live events, config view via API, Ask Claude suggests optimizations."}, {"th": "ทางเริ่มต้นที่แนะนำ: Claude API skill ใน Claude Code ที่รู้เรื่อง managed agents, CLI สำหรับคุม agent/session และ cookbooks ที่ copy ไปใช้ได้", "en": "Getting started: Claude API skill in Claude Code, a CLI, and cookbooks."}, {"th": "ฟีเจอร์ขั้นสูง: multi-agent orchestration (spawn agent thread ที่มี context window ของตัวเอง), outcomes (กำหนด rubric ให้ Claude วนปรับจนพอใจ), memory, dreaming (research preview) และที่ประกาศในงาน: self-hosted sandboxes (ใช้ compute ของตัวเองใน VPC โดย Anthropic ส่งสัญญาณเมื่อต้องการ sandbox ใหม่) กับ MCP tunnels (research preview เปิด private MCP server ให้ Claude โดยไม่ต้องเปิด public internet)", "en": "Advanced: multi-agent, outcomes, memory, dreaming, self-hosted sandboxes, MCP tunnels."}, {"th": "เสวนากับพาร์ตเนอร์ sandbox: Vercel ใช้พื้นฐานเดียวกันให้ build/sandbox/function (fluid compute) และมี firewall ฉีด secret ได้, Modal เน้น scale (หลักแสน sandbox ในไม่กี่นาที), GPU และหลาย region, Daytona เน้นว่า agent ต้องการสิ่งเดียวกับมนุษย์ (spec ต่างๆ, pause/resume/fork), Cloudflare มี micro VM กับ isolate ที่เบากว่า", "en": "Partner bets: Vercel unified compute, Modal scale/GPU, Daytona human-like environments, Cloudflare micro VM plus isolates."}, {"th": "ความท้าทายที่ผู้ร่วมเสวนาพูดถึง: security ตอน deploy (egress filtering, การกำหนด identity ตลอดสายเมื่อ agent สร้าง agent), permission ของ agent เทียบกับมนุษย์, การ resume งาน, และการทำงานแบบ multiplayer ที่ agent ยังเป็น single-player ส่วนที่ตื่นเต้น เช่น chief of staff ส่วนตัวให้ทุกคน, ให้ Claude hill-climb inference ด้วย profiler บน GPU sandbox, human emulator ที่ใช้ sandbox เข้าแอป legacy", "en": "Panel challenges: security, identity chains, resumability, multiplayer; excitement: personal chief of staff, inference hill-climbing, human emulators."}], "numbers": [{"th": "Opus 4.7 ถูกเรียกว่าโมเดลใหม่สุดที่ผู้พูดมี ('newest model that we have')"}, {"th": "event stream มี 4 ประเภท: user, agent, session, span"}, {"th": "ฟีเจอร์ขั้นสูง 6 อย่างที่ระบุ: multi-agent orchestration, outcomes, memory, dreaming, self-hosted sandboxes, MCP tunnels"}, {"th": "Modal (ผู้พูดบอก): ด้วย scheduler ของตัวเองสร้าง sandbox ได้หลักแสนในเวลาไม่กี่นาที"}, {"th": "พาร์ตเนอร์ self-hosted sandbox ที่ระบุ: Cloudflare, Daytona, Modal, Vercel"}, {"th": "ในเดโม Python script ที่ upload เข้า session ทำงานนานเกิน 20 วินาที ซึ่ง Ask Claude ชี้ว่าอาจ optimize ได้"}], "quotes": [{"text": "we're seeing that like the bottleneck towards increasing capabilities is really the infrastructure around these models and not so much the intelligence for them.", "th": "คอขวดของความสามารถที่เพิ่มขึ้นคือโครงสร้างพื้นฐานรอบโมเดล ไม่ใช่ตัวความฉลาด"}, {"text": "Every session that you start in Claude managed agents is effectively a log of events", "th": "ทุก session ใน managed agents คือ log ของ event"}, {"text": "basically just a way for you to get your private MCPs in your network exposed to Cloud Manager agents without having to do any fancy network configuration on your side", "th": "MCP tunnels คือทางเปิด private MCP ในเครือข่ายให้ managed agents โดยไม่ต้องตั้งค่าเครือข่ายซับซ้อน"}], "steps": ["Define agent: system prompt, model, skills, tools, permissions, identity", "สร้าง environment: sandbox พร้อม network allow list และ package ที่ติดตั้งไว้", "เริ่ม session แล้วสั่งงาน ให้ agent กลับมาหาเมื่อเสร็จ", "ฟัง event stream (user/agent/session/span events) เพื่อสังเกตและโต้ตอบ เช่น interrupt, ส่ง tool result, ยืนยัน human-in-the-loop", "เดโม Pascal: กดปุ่ม analyze ใน dashboard ของแอป -> ดู event และ config ใน console -> แอปแสดงผลผ่าน API -> สั่ง predictive analysis -> กด Ask Claude เพื่อให้ Claude อ่าน transcript แล้วแนะนำการปรับ config", "เริ่มพัฒนา: ใช้ Claude API skill ใน Claude Code, CLI และ cookbooks"], "takeaways_th": ["ก่อนสร้าง agent platform เอง ลองดูว่า primitive ของ Managed Agents (agent/environment/session/event stream) ครอบสิ่งที่ต้องทำเองอยู่แล้วแค่ไหน", "ใช้ event stream เป็นฐานของ observability และ UI ของแอปตัวเอง ไม่ต้องสร้าง logging แยก", "ถ้าข้อมูลหรือเครื่องมือต้องอยู่ใน VPC ให้พิจารณา self-hosted sandboxes กับ MCP tunnels แทนการเปิด public endpoint", "ใช้ outcomes (rubric) กับ multi-agent สำหรับงานที่ต้องวนปรับเอง และเปิด memory/dreaming สำหรับงานซ้ำ", "เริ่มด้วย Claude API skill ใน Claude Code กับ cookbooks เพื่อต่อ API ได้เร็ว"], "caveats_th": ["ผู้พูดสองคนแรกแนะนำตัวว่า Michael และ Harrison (ทั้งคู่ member of technical staff) แต่ transcript ไม่แยกผู้พูด จึงไม่รู้ว่าใครพูดช่วงไหน", "ชื่อพาร์ตเนอร์ได้ยินเป็น 'Mike' (Cloudflare), 'Yvon/Yvan' (Daytona), 'Akshat/Akshay' (Modal), 'Luke' (Vercel) สะกดตาม ASR ไม่แน่ใจ และ ASR เขียน Daytona เป็น 'Deta Una' ในบางที่", "ASR เขียน Claude เป็น 'Cloud' ในหลายที่ เช่น 'Cloud Manager agents' = Claude Managed Agents", "ช่วงที่พาร์ตเนอร์ขึ้นเวที มีประโยคที่ ASR ฟังเพี้ยน เช่น 'Sanitas the world' ไม่นำมาใส่", "คำว่า 'Karpathy's auto resource' น่าจะหมายถึง autoresearch ของ Karpathy แต่ transcript เขียนตามที่ได้ยิน", "ตัวเลขเรื่องขนาด sandbox fleet และข้ออ้างว่า infrastructure เป็นตัวขวางอันดับหนึ่ง เป็นคำพูดของผู้พูด ผมยืนยันเองไม่ได้", "ลูกค้าที่ถูกอ้างถึงอย่าง DoorDash เป็นข้ออ้างของผู้ร่วมเสวนา"], "related_existing": ["claude-agent-sdk", "claude-agent-sdk-runtime", "claude-code-mcp", "multi-agent-patterns", "long-horizon-agents"], "dur": "29:04", "url": "https://www.youtube.com/watch?v=zenIB7XLZxQ", "asr": "yt-captions", "wiki": "cwc-london-13"}, {"n": 14, "id": "jWWsLe4Gh5Y", "title_en": "Build a production-ready agent with Claude Managed Agents", "title_th": "สร้าง agent พร้อม production ด้วย Claude Managed Agents (เดโม Deal Desk)", "speakers": [], "track": "workshop", "tags": ["managed-agents", "subagents", "agent-memory", "mcp-tools-skills", "cloud-platforms"], "tldr_th": "เวิร์กชอปพาเขียนเว็บแอป Deal Desk ที่ต่อกับ Claude Managed Agents ผ่าน SDK ตั้งแต่ list session ไปจนถึง chat view และ outcomes แล้วไล่ดู multi-agent แบบ live ใน developer console ผู้พูดสรุปว่าของที่ต้องสร้างเอง (agent loop, sandbox, durable storage, auth) Managed Agents ให้มาพร้อมใช้", "tldr_en": "A hands-on session building a Deal Desk web app on Claude Managed Agents: list/retrieve sessions, chat via events and streaming, outcomes, multi-agent threads, and live debugging in the console. The speaker argues Managed Agents replaces the agent loop, sandbox fleet, storage and auth you would otherwise build.", "audience_th": "นักพัฒนาที่อยากเริ่มสร้างผลิตภัณฑ์บน Managed Agents API รู้ TypeScript/SDK เบื้องต้นก็พอ", "points": [{"th": "Managed Agents คือชุด API endpoint ที่ใช้ได้ด้วย API key ทั่วไป ให้ primitive สำหรับ agent พร้อม production เช่น เครื่องคอมพิวเตอร์ให้ Claude, credential vault, tool harness, retry/error recovery, memory, context management และ multi-agent เลือกใช้เฉพาะชิ้นที่ต้องการได้", "en": "Managed Agents is a set of API endpoints exposing production-ready agent primitives (computer, credential vaults, tool harness, retries, memory, multi-agent) you can pick and choose."}, {"th": "building block หลักมี 4 อย่าง คือ agent (เหมือน template: system prompt, skills, tools, MCP servers, permission ต่อ tool เช่น file read auto-execute แต่ bash ต้องให้ผู้ใช้อนุมัติ), environment (template ของ sandbox: network access, pre-install package จาก npm/pip), session (บทสนทนาต่อเนื่อง ใส่ GitHub repo หรือไฟล์ล่วงหน้าได้) และ events", "en": "Four core primitives: agent (template with per-tool permissions), environment (sandbox template), session (ongoing conversation with repos/files), and events."}, {"th": "events แบ่งเป็น user events (ข้อความ รูป เอกสาร interrupt tool result confirmation และ outcomes), agent events (ข้อความ compaction tool call multi-agent coordination), session events (สถานะ retry error idle terminate รวมถึง outcome processing) และ span events (บอกจุดเริ่ม/จบของงานยาว)", "en": "Events: user, agent, session and span events."}, {"th": "outcomes คือการส่งไฟล์หรือข้อความที่เขียนเป็น spec/rubric ให้ Claude ทำรอบแรก แล้วเข้าโหมดวนตรวจงานตัวเองกับ rubric จนผ่าน ผู้พูดบอกว่าพบว่าทรงพลังมากและเป็นวิธีตั้ง agent ให้สำเร็จ", "en": "Outcomes: a rubric/spec Claude iterates against until satisfied; the speaker calls it very powerful."}, {"th": "ประกาศวันเดียวกัน คือ self-hosted sandboxes (ใช้ Cloudflare, Modal, Vercel หรือ fleet ของตัวเอง เก็บข้อมูลไว้ใน VPC/perimeter) และ MCP tunnels (secure tunnel ไป private MCP server โดยไม่ต้องเปิดออก internet)", "en": "Self-hosted sandboxes and MCP tunnels were announced to keep data and MCP servers inside your own perimeter."}, {"th": "เดโม Deal Desk เป็นแอปสมมติสำหรับตัดสินใจลงทุน/ซื้อกิจการ ใช้ multi-agent ที่เปิดตัวเมื่อ 2 สัปดาห์ก่อน มี agent หลายตัวคนละ persona (เช่น macro trends กับ financial analysis) ต่อ Linear MCP และไฟล์ที่อัปโหลด", "en": "The Deal Desk demo uses multi-agent with differently-skilled agents connected to Linear MCP and uploaded files."}, {"th": "ฝั่งโค้ด เริ่มจาก stub ที่ยังไม่ implement แล้วเติม client.beta.sessions.list กับ retrieve session จากนั้นให้ Claude Code เขียนส่วน send events และ stream events เอง โดยอาศัย Claude API skill ที่มากับ Claude Code", "en": "Code: implement sessions.list/retrieve by hand, then let Claude Code (with its built-in Claude API skill) implement event sending and streaming."}, {"th": "ใน developer console ดู session แบบ live ได้ เห็น agent ย่อยแต่ละตัวเป็นเส้นแนวนอน มี context window ของตัวเอง ดู input/output ของแต่ละ event และเวลาที่ tool call ใช้ รวมถึงดู/แก้ memory store ได้ agent มี versioning ย้อนกลับได้", "en": "The console shows live sessions with per-agent threads, event inputs/outputs, timings, memory stores, and versioned agents."}], "numbers": [{"th": "multi-agent feature เปิดตัว \"2 weeks ago\" ตามที่ผู้พูดบอก"}, {"th": "ผู้พูดกล่าวถึง Opus 4.7 ว่าเขียนเอกสารยาวมากได้ (เป็นเหตุผลที่มี span events)"}, {"th": "ในเดโมมี sub agent 4 ตัวที่ coordinator เรียกมาทำงาน ตามที่ผู้พูดบอกขณะดู console"}, {"th": "เดโมมีบริษัทสมมติ 3 แห่ง: Bridgewell Dynamics, Norwood Automation, Acme Robotics"}], "quotes": [{"text": "Claude can help you build your own Claude", "th": "Claude ช่วยคุณสร้าง Claude ของคุณเองได้"}, {"text": "Claude code ships by default with the Claude API skill", "th": "Claude Code มาพร้อม Claude API skill เป็นค่าเริ่มต้น"}, {"text": "without Claude ever seeing what those tokens are", "th": "โดย Claude ไม่เคยเห็น token เหล่านั้น (พูดถึง credential vault)"}], "steps": ["ตั้งต้นจาก repo starter (โฟลเดอร์ production-ready agents มีทั้ง starter กับ solution) แล้วรันเซิร์ฟเวอร์ด้วย Bun เพื่อทดสอบ local", "เติม endpoint list sessions ด้วย client.beta.sessions.list จาก Anthropic SDK แล้ว sidebar แสดง session ของ workspace", "เติม retrieve session (to-do ข้อ 4) ได้ API response ของ get session: agent, tools, Linear MCP, outcomes", "ใช้ Claude Code (พร้อม Claude API skill) อ่าน to-do ที่เหลือแล้วเขียน send events กับ stream events เอง", "ใน UI สร้าง session ใหม่ เลือก Linear MCP และ memory stores (เรียก create session endpoint)", "ส่ง outcome definition event ผ่าน suggestion chip ให้ประเมิน 3 บริษัทตาม rubric แล้วดู agent delegate ให้ sub agent", "เปิด developer console ดู session แบบ live: threads ของแต่ละ agent, event, เวลา tool call", "ดู/แก้ memory store และ agent version ใน console", "ปิดด้วยสรุปว่าไม่ต้องสร้าง agent loop, sandbox fleet, durable storage, auth เอง"], "takeaways_th": ["เริ่มจากกำหนด agent + environment แล้วสร้าง session ก่อน ที่เหลือคือส่ง/รับ events", "ใช้ outcomes (rubric) เมื่ออยากให้ agent ตรวจงานตัวเองซ้ำก่อนส่งผล", "เก็บ token ของ MCP ไว้ใน credential vault เพื่อไม่ให้เข้า context ของ Claude", "ข้อมูลที่ห้ามออก perimeter ให้ดู self-hosted sandboxes และ MCP tunnels", "ให้ Claude Code เขียนส่วน integration ให้ โดยอาศัย Claude API skill แล้วใช้ console debug"], "caveats_th": ["ผู้พูดไม่ได้แนะนำชื่อใน transcript จึงใส่ speakers เป็น []", "transcript เป็น auto-caption ใช้ \"Cloud Managed Agents\" แทน Claude Managed Agents ทั้งหมด", "ข้อความ code จริงที่พิมพ์ไม่ปรากฏครบใน transcript มีแค่ชื่อ client.beta.sessions.list", "ผู้พูดระบุว่าเดโมและบริษัททั้งหมดเป็นของสมมติ ผลการประเมินในเดโมไม่ใช่ข้อมูลจริง", "เรื่อง plugins ในคำถามจากผู้ฟัง ผู้พูดบอกว่ายังไม่มี กำลังพัฒนา"], "related_existing": ["claude-code-background-agents", "multi-agent-patterns", "claude-code-mcp", "claude-agent-sdk", "long-horizon-agents"], "dur": "27:23", "url": "https://www.youtube.com/watch?v=jWWsLe4Gh5Y", "asr": "yt-captions", "wiki": "cwc-london-14"}, {"n": 15, "id": "T7KqH7kYnE4", "title_en": "The thinking lever", "title_th": "ปุ่ม thinking และ effort: ให้ Claude ใช้ compute ตอนรันมากน้อยแค่ไหน", "speakers": [{"name": "Alexander Briken", "role": "applied AI research team, Anthropic (สะกดนามสกุลตาม ASR)"}], "track": "models-prompting", "tags": ["extended-thinking", "model-selection", "evals", "prompt-engineering"], "tldr_th": "Alexander อธิบาย test-time compute ว่าเมื่อ Claude ใช้ token คิดมากขึ้นคุณภาพก็ดีขึ้น โดยมี 3 ทางใช้ compute คือ thinking, tool calling และ text ควบคุมได้ด้วย effort กับ budget เขาย้ำว่า adaptive thinking ไม่ใช่ model router และการปิด thinking ไม่ใช่การลด effort แต่คือการถอด capability ออก คำแนะนำคือเปิด thinking ไว้ ทดสอบด้วย eval และเมื่อไม่แน่ใจเริ่มที่ extra high", "tldr_en": "More test-time compute improves results; control it with effort levels and budgets, keep thinking enabled (adaptive thinking), evaluate per task, and default to extra high when unsure.", "audience_th": "นักพัฒนาที่ใช้ Claude API/Claude Code และสงสัยว่าควรตั้ง effort กับ thinking ระดับไหน ควรรู้จักโมเดล Haiku/Sonnet/Opus ในระดับพื้นฐาน", "points": [{"th": "test-time compute คือการใช้ token ตอน inference เพื่อให้โมเดลแก้โจทย์ได้ดีขึ้น เหมือนที่เพิ่ม compute ตอน train ก็ได้โมเดลฉลาดขึ้น ผู้พูดโชว์กราฟว่าทั้งขนาดโมเดลและจำนวน token ที่ใช้คิดดันคะแนนขึ้น และเห็นแนวเดียวกันในหลาย benchmark (Deep Search QA, OSWorld, Humanity's Last Exam)", "en": "Test-time compute raises performance, like train-time compute; shown across several benchmarks."}, {"th": "เดโมสด: prompt เดียว (จำลองรถบนถนนวันเวย์กับไฟจราจร) รันบน Opus 4.7 ที่ low, high และ max effort พบว่า low ใช้ราว 50 วินาที ราว 4,600 output token ได้ผลพอใช้ high ใช้เวลาและ token ราวสองเท่า ละเอียดขึ้น (มีรถหลายแบบ ไฟจราจรเหนือถนน) ส่วน max ใช้ราว 10 เท่า ละเอียดที่สุด", "en": "Live demo on Opus 4.7: low ~50s/4,600 tokens; high ~2x; max ~10x with the most detailed result."}, {"th": "ผู้พูดอ้างกราฟ METR ว่างานที่โมเดลทำได้ยาวขึ้นตามรุ่น และ Mythos ทำงานเทียบเท่ามนุษย์ราว 16 ชั่วโมงที่ความแม่นยำ 50% (ตามที่ผู้พูดบอก)", "en": "Speaker cites a METR chart: Mythos at roughly 16 human-hours at 50% accuracy."}, {"th": "compute ตอนรันมี 3 ช่อง: thinking (scratch pad), tool calling (ช่องทางกับโลกภายนอก เช่น web search, MCP, เขียนไฟล์) และ text (ข้อความ/คำถามกลับที่ตอบผู้ใช้) ผู้ใช้คุมได้ด้วย effort (dial จาก low ถึง max) และ budget (เช่น max token หรือ task budgets ใน API)", "en": "Compute goes to thinking, tool calls, and text; controlled via effort and budgets."}, {"th": "วิวัฒนาการ: คิดก่อนแล้วค่อย tool call หลายครั้ง -> interleaved thinking (คิดหลังทุก tool call) -> adaptive thinking ที่ให้โมเดลเลือกเองว่าจะคิด เรียก tool หรือเขียน text ตอนไหน หรือไม่คิดเลยก็ได้ ผู้พูดบอกว่ามันไม่ใช่ model router และ benchmark ทั้งหมดรันบน adaptive thinking ซึ่ง Pareto efficient กว่า interleaved", "en": "Interleaved to adaptive thinking; not a router; Pareto efficient vs interleaved."}, {"th": "thinking toggle เป็นตัวแทนของ effort ที่แย่ เพราะการปิดคือการถอด capability หนึ่งใน 3 อย่างของ Claude ออก ควรให้ Claude รู้ว่ามีเครื่องมือคิดแล้วตัดสินเองเหมือนที่ให้ search tool แล้วให้เลือกว่าจะค้นเมื่อไร", "en": "A thinking toggle removes a capability rather than expressing effort."}, {"th": "แนวปฏิบัติ: วัดด้วย eval ที่ยากและตรงงานจริง สังเกต diminishing returns (max ใช้ token ราวสองเท่าของ extra high แต่ดีขึ้นนิดเดียวในกราฟตัวอย่าง) และ low เหมาะงานที่ไม่ติดที่ความฉลาด เช่น classification, summarization, data extraction", "en": "Use hard evals; note diminishing returns at max; low suits classification, summarization, extraction."}, {"th": "rule of thumb: max เมื่อรู้ว่างานยากจริง, extra high เป็นค่า default ของ Claude Code และ claude.ai (สมดุลดีสุดตามผู้พูด), high ถ้างานต้องการความฉลาดอยู่บ้าง, medium/low เพื่อลด token และ latency ตัวอย่างเสริม: Claude Plays Pokémon ที่ low effort Claude ใช้วิธีเลี่ยงการสู้ (repel, potion, escape rope) จนจบเร็วขึ้น", "en": "Rules of thumb per level; Pokemon example where low effort found an avoidance strategy."}, {"th": "โมเดลเล็ก effort สูง หรือโมเดลใหญ่ effort ต่ำ: เทียบ Opus กับ Haiku 4.5 บนโจทย์จำลองรถ Haiku ใช้เวลาครึ่งเดียวแต่ใช้ token เท่ากัน และผลแย่กว่ามาก ผู้พูดสรุปว่าถ้างานต้องการความฉลาดแม้นิดเดียว ใช้โมเดลใหญ่แม้ตั้ง effort ต่ำก็ดีกว่า โมเดลเล็กเหมาะงานง่ายที่ผลลัพธ์ไม่ซับซ้อน ส่วนอนาคตอยากให้ผู้ใช้กำหนดงบ/เวลา แล้ว Claude จัดสรร compute เอง", "en": "Larger model at low effort beats Haiku when intelligence matters; future: user sets budget, Claude allocates."}], "numbers": [{"th": "เดโม low effort บน Opus 4.7: ราว 50 วินาที และราว 4,600 output token"}, {"th": "high effort ใช้เวลาและ token ราวสองเท่าของ low; max ใช้ราว 10 เท่า (ตามที่ผู้พูดบอกในเดโม)"}, {"th": "กราฟ internal agentic coding benchmark: โมเดลใหญ่สุดได้ประมาณต่ำกว่า 80% (ผู้พูดอ้างลอยๆ จากกราฟ)"}, {"th": "Mythos: งานเทียบเท่ามนุษย์ราว 16 ชั่วโมงที่ความแม่นยำ 50% บนกราฟ METR (ตามที่ผู้พูดบอก)"}, {"th": "ค่า default ของ Claude Code และ claude.ai คือ effort extra high (ตามที่ผู้พูดบอก)"}, {"th": "effort level ที่กล่าวถึง: low, medium, high, extra high, max"}, {"th": "Haiku 4.5 ใช้เวลาประมาณครึ่งหนึ่งของ Opus แต่ใช้ token เท่ากันในโจทย์จำลองรถ"}], "quotes": [{"text": "Adaptive thinking isn't a model router.", "th": "adaptive thinking ไม่ใช่ตัว route ไปหาโมเดล"}, {"text": "a thinking toggle is actually a poor proxy for the amount of effort that a model should put in.", "th": "สวิตช์เปิดปิด thinking เป็นตัวแทนที่แย่ของระดับความพยายามที่โมเดลควรใช้"}, {"text": "And then finally, when in doubt, go with extra high.", "th": "สุดท้าย ถ้าไม่แน่ใจ ให้ใช้ extra high"}], "steps": ["เดโม: รัน prompt จำลองรถบนถนนวันเวย์กับไฟจราจรบน Opus 4.7 ที่ low effort แล้วดูเวลา/token/ผล", "รันซ้ำที่ high effort แล้วเทียบ: เวลา token สองเท่า ผลละเอียดขึ้น", "รันที่ max effort: ราว 10 เท่า ผลละเอียดที่สุด", "เทียบกับ Haiku 4.5 บน prompt เดิม: เวลาครึ่งเดียว token เท่ากัน ผลด้อยกว่า"], "takeaways_th": ["เปิด thinking (adaptive) ไว้เป็น default แล้วควบคุมต้นทุนด้วย effort ไม่ใช่ปิด thinking", "สร้าง eval ที่ยากและตรงงานจริง แล้วทดสอบหลาย effort level เพื่อหาจุดที่ผลลัพธ์เริ่มไม่คุ้ม", "ถ้ายังไม่มี eval เริ่มที่ extra high; ลดเป็น high/medium/low สำหรับงานเน้น latency เช่น classification, summarization, extraction", "ถ้างานต้องการความฉลาดแม้เพียงเล็กน้อย เลือกโมเดลใหญ่ effort ต่ำก่อนโมเดลเล็ก effort สูง", "สำหรับงานยาว ให้ลองใช้ budget (max tokens / task budgets) เพื่อคุมต้นทุน"], "caveats_th": ["ชื่อผู้พูดสะกดตาม ASR ('Alexander Briken') ไม่แน่ใจนามสกุล", "ตัวเลขเดโม (50 วินาที, 4,600 token, 2x, 10x) เป็นตัวเลขที่ผู้พูดอ่านจากหน้าจอ ผมไม่ได้เห็นภาพ", "ไม่ได้ยินชัดว่า 'extra high' กับ 'max' ต่างกันกี่เท่า ผู้พูดพูดว่า max ใช้ token 'double the amount' ของ extra high ในกราฟตัวอย่างเท่านั้น", "ชื่อโมเดล 'Mythos' และ 'Opus 47' มาจาก ASR สะกดเดาว่า Opus 4.7", "ท่อน 'Deep Search QA' อาจเป็นชื่อ benchmark ที่ ASR เขียนเพี้ยน ('Deep Search QA')", "ข้ออ้างว่า adaptive thinking Pareto efficient กว่า interleaved เป็นของผู้พูด ไม่มีตัวเลขใน transcript"], "related_existing": ["claude-code-model-config", "token-economics", "llm-fundamentals", "claude-code-costs", "prompt-engineering"], "dur": "21:17", "url": "https://www.youtube.com/watch?v=T7KqH7kYnE4", "asr": "yt-captions", "wiki": "cwc-london-15"}, {"n": 16, "id": "mhW-XXnDFSU", "title_en": "How Lovable vibecodes production software at scale", "title_th": "Lovable ทำให้แพลตฟอร์ม vibe coding ซ่อมตัวเองได้ยังไง (Lovable Overflow + vent tool)", "speakers": [{"name": "Fabian Hedin", "role": "Cofounder และ CTO ของ Lovable (ตามคำอธิบายคลิป; ใน transcript ผู้พูดไม่ได้พูดชื่อตัวเอง)"}], "track": "domain-case", "tags": ["agent-reliability", "self-improving", "agent-memory"], "tldr_th": "CTO ของ Lovable เล่าว่า ผู้ใช้ที่ไม่ใช่นักพัฒนาพอติดขัดแล้วหลุดจากแพลตฟอร์มง่ายมาก ทีมเลยสร้างระบบให้แพลตฟอร์มซ่อมตัวเอง 2 ชั้น ชั้นแรกคือ Lovable Overflow คลังปัญหาและวิธีแก้ที่ฉีดเข้า context ของ agent ก่อนผู้ใช้ติด ชั้นที่สองคือ vent tool ที่ให้ agent ส่งความหงุดหงิดกลับมา แล้ว agent อีกตัวเปิด PR ให้วิศวกรรีวิว ผู้พูดอ้างว่าลดอัตรา stuck ได้ 5% และ merge fix เข้า production ราว 10 รายการต่อวัน", "tldr_en": "Lovable's CTO describes two self-healing systems for a consumer vibe-coding platform: Lovable Overflow (a curated problem/solution corpus injected into the agent's context) and a vent tool through which the agent reports platform friction and agents open PRs for engineers to review.", "audience_th": "คนที่สร้างแพลตฟอร์ม agent ให้ผู้ใช้ทั่วไป และอยากรู้วิธีเอา failure จริงมาวนปรับปรุงระบบ (ไม่ต้องรู้ Lovable มาก่อน)", "points": [{"th": "Lovable เริ่มจากแนวคิดทำซอฟต์แวร์ให้คนที่เขียนโค้ดไม่เป็น (ผู้พูดเรียกว่า 99%) UI เป็นแชตซ้ายกับ preview ขวา ซึ่งแทบไม่เปลี่ยนมาตลอด แต่ความสามารถของโมเดลข้างหลังเปลี่ยนไปมาก ผู้พูดบอกว่าโมเดลเริ่มเอื้อให้ abstraction แบบนี้ใช้ได้จริงเมื่อราวปีครึ่งก่อน", "en": "Lovable targets non-coders ('the 99%'); the chat-plus-preview UI barely changed while model capability did, and became viable about 1.5 years ago."}, {"th": "หลักการสองข้อของทีม คือทำ production grade software ไม่หยุดที่ prototype และทำให้ผู้ใช้ที่ไม่ใช่เทคนิคใช้ได้ ซึ่งยากกว่า เพราะไม่มีผู้เชี่ยวชาญอยู่ใน loop คอยช่วย", "en": "Two principles: chase production-grade software, and do it for non-technical users with no expert in the loop."}, {"th": "ผู้พูดเทียบกับคำกล่าวเก่าว่า 10% สุดท้ายกินเวลา 90% แล้วบอกว่าใน vibe coding ก็เป็นแบบเดียวกัน ได้เวอร์ชันแรกเร็วแต่การทำให้จบกินเวลานาน ถ้าผู้ใช้ติดแล้วแก้เองไม่ได้ ถือเป็นประสบการณ์ที่แย่ที่สุด เป้าหมายทางเทคนิคคือให้ทุกแอปที่สร้างบนแพลตฟอร์มช่วยให้แอปถัดไปดีขึ้น", "en": "Last-10%-takes-90% applies to AI coding too; getting stuck is the worst experience for non-technical users; goal is that every app improves the next."}, {"th": "นิยามคำว่า stuck มี metric ภายในชื่อ is_stuck เป็นจริงเมื่อผู้ใช้ขอสิ่งเดิมซ้ำ 3 ครั้งติด บ่นเรื่องผลงาน หรือขอแล้วหายไปเลย ใช้ classification model ขนาดเล็กตัดสิน แล้วแบ่งเป็น 3 กลุ่ม คือแก้ได้ด้วยการ prompt ใหม่ / เรื่องง่ายที่แพลตฟอร์มยังไม่รองรับ / ต้องลงทุนใหญ่ เช่น server side rendering เพื่อ SEO ที่เพิ่งปล่อยเมื่อสัปดาห์ก่อน", "en": "is_stuck = same request 3x in a row, complaints, or abandonment, detected by a small classifier; three buckets from promptable to big-investment (e.g., SSR shipped last week)."}, {"th": "Lovable Overflow ตั้งชื่อตาม Stack Overflow เป็นคลังคำอธิบายปัญหาพร้อมวิธีแก้ พอผู้ใช้พิมพ์ปัญหา เช่น scroll กระตุก ระบบจะค้นคลังโดยดู tech stack กับเวอร์ชัน package แล้วให้ lightweight model ปรับความรู้ให้เข้ากับสถานการณ์ก่อนฉีดเข้า main agent ไม่ใช่ dump ดิบๆ", "en": "Lovable Overflow searches a problem/solution corpus using stack and package versions, and a lightweight model adapts the knowledge before injecting it into the main agent."}, {"th": "ความรู้ในคลังมีอายุ ระบบเลยเก็บ success ratio ต่อไฟล์ความรู้ และตัดทิ้งเมื่อล้าสมัย พร้อมเติมความรู้ใหม่ ผู้พูดบอกว่าการจูนจังหวะ deprecate กับเพิ่มความรู้เป็นส่วนสำคัญที่สุดของการทำให้ระบบนี้ใช้ได้ และเคยลองทำแล้วล้มเหลวเพราะยังไม่จูนสัญญาณให้ดี", "en": "Each knowledge file tracks a success ratio and is pruned when stale; tuning add/deprecate is critical, an earlier attempt failed for lack of good signals."}, {"th": "vent tool คือ tool ของ agent ชื่อ vent --send_feedback ใช้ได้ครั้งเดียวต่อข้อความผู้ใช้ เมื่อเอกสาร tool หรือพฤติกรรมแพลตฟอร์มทำให้งานช้าลงหรือแย่ลง ข้อความไปลง Slack แล้ว agent อีกตัวคัด dedupe สืบสวน และเปิด PR ให้วิศวกรรีวิว ผู้พูดบอกว่าราว 50% ของ PR มีเหตุผลถูกต้อง", "en": "The vent tool sends agent frustration to Slack; another agent dedupes, investigates and opens PRs; about 50% make sense per the speaker."}, {"th": "ตัวอย่างที่ผู้พูดเล่า คือ tool copy ไฟล์พังกับชื่อไฟล์ที่มีอักขระพิเศษ แล้วมี PR merged ใน production ภายใน 10 นาที, agent บ่นเรื่อง type ของ Framer Motion, ช่วง production incident ยอด vent พุ่งจนกลายเป็นสัญญาณแรกของ incident หลายครั้ง และ agent ที่ vent ซ้ำ 43 ครั้งก็เสนอ dedupe safeguard เองจนถูก merge", "en": "Examples: a file-copy bug fixed in 10 minutes, Framer Motion type complaints, vent spikes as the first incident signal, and an agent proposing its own dedupe safeguard after venting 43 times."}, {"th": "บทเรียนที่ผู้พูดสรุป คือการเรียนรู้จาก failure ผูกกับโมเดลที่ใช้ เมื่อมีโมเดลใหม่ต้องจูนหรือตัดความรู้ที่โมเดลรู้อยู่แล้วออก ความรู้มี half-life และระบบต้องจูนตลอดด้วยสัญญาณจากข้อมูลจริงของแพลตฟอร์ม", "en": "Lessons: learnings are model-specific, knowledge has a half-life, and the system needs constant tuning from real platform signals."}], "numbers": [{"th": "ผู้พูดบอกว่าแพลตฟอร์มมี 50 ล้านโปรเจกต์ และเว็บที่สร้างบน Lovable มี 600 ล้าน monthly visits (คำอธิบายคลิปเขียน 600M+ monthly sessions)"}, {"th": "GPT-Engineer repo ของผู้ร่วมก่อตั้ง Anton เกิดเมื่อราว 35 เดือนก่อน และผู้พูดบอกว่าเป็น repo ที่ได้ stars เร็วที่สุดบน GitHub ในตอนนั้น"}, {"th": "is_stuck เป็นจริงเมื่อขอสิ่งเดิมซ้ำ 3 ครั้งติด"}, {"th": "ผลของ Lovable Overflow เวอร์ชันแรกเทียบกับไม่มี: อัตรา stuck ลดลง 5% และ publish rate เพิ่มขึ้น 2% ผู้พูดบอกว่า 5% นี้อยู่ในระดับเดียวกับที่ metric ขยับเมื่อมีโมเดลรุ่นใหม่"}, {"th": "vent tool: merge fix เข้า production ราว 10 รายการต่อวัน และ PR ราว 50% ที่ agent เสนอมีเหตุผลถูกต้อง"}, {"th": "ตัวอย่างบั๊ก tool copy ไฟล์ มี PR merged ใน production ภายใน 10 นาทีหลังได้รับ vent"}, {"th": "agent เรียก vent 43 ครั้งในกรณีที่ spam Slack ก่อนเสนอ dedupe safeguard เอง"}, {"th": "ผู้พูดบอกว่ามีแอปใหม่ราว 200,000 ต่อวัน และข้อความหลายล้านต่อวัน ใช้เป็นสัญญาณจูนระบบ"}], "quotes": [{"text": "every app that is built on the platform should help improve the next", "th": "ทุกแอปที่สร้างบนแพลตฟอร์มควรช่วยให้แอปถัดไปดีขึ้น"}, {"text": "if you give the agent a tool to tell you when it's feeling frustration, that's another way to do it", "th": "ถ้าให้ agent มี tool บอกเราตอนมันหงุดหงิด นั่นก็เป็นอีกทางหนึ่ง"}, {"text": "knowledge has a half-life", "th": "ความรู้มีครึ่งชีวิต"}], "steps": [], "takeaways_th": ["ถ้าทำแพลตฟอร์ม agent ให้ผู้ใช้ทั่วไป นิยาม metric ว่าผู้ใช้ติดขัดตอนไหน (ขอซ้ำ บ่น หายไป) ก่อน แล้วค่อยออกแบบระบบแก้", "ทำคลังความรู้ปัญหา/วิธีแก้ แล้วฉีดเข้า context เฉพาะตอนเกี่ยวข้อง พร้อมวัด success ratio ต่อรายการเพื่อตัดความรู้ที่ล้าสมัย", "ลองให้ agent มี tool ส่ง feedback เรื่อง tool/doc/platform ที่ใช้ไม่ได้ แล้วต่อเข้า Slack กับ agent คัดกรองที่เปิด PR ให้คนรีวิว", "ใช้ปริมาณ vent เป็นสัญญาณเสริมตอนสืบ incident ควบคู่กับ monitoring ปกติ", "เมื่อเปลี่ยนโมเดล ทบทวนคลังความรู้ด้วย บางอย่างต้องจูนใหม่ บางอย่างโมเดลรู้อยู่แล้วจนไม่ต้องมี"], "caveats_th": ["transcript มาจาก Whisper large-v3 ที่ถอดเอง ไม่ใช่ caption ทางการ ชื่อเฉพาะและตัวเลขอาจเพี้ยน", "ชื่อ Fabian Hedin มาจากคำอธิบายคลิป ผู้พูดไม่ได้พูดชื่อตัวเองใน transcript", "ประโยค 50,000 million apps now ฟังเพี้ยนชัดเจน (ช่วงต้นผู้พูดพูดว่า 50 million projects) จึงใช้ 50 ล้านโปรเจกต์ตามช่วงต้น; stack rate ที่ได้ยินน่าจะเป็น stuck rate", "ผลลดอัตรา stuck 5% และ publish rate +2% เป็นตัวเลขที่ผู้พูดรายงานเอง ไม่มีหลักฐานอิสระ และเป็นของเวอร์ชันแรกของระบบ", "ผู้พูดเสนอไอเดียให้ agent contribute เข้า open source library แต่บอกว่ายังไม่อนุญาตและไม่แน่ใจว่าทำอะไรไปแล้ว ไม่ใช่ฟีเจอร์ที่ใช้อยู่"], "related_existing": ["harness-engineering", "context-management", "agent-skills"], "dur": "31:10", "url": "https://www.youtube.com/watch?v=mhW-XXnDFSU", "asr": "whisper", "wiki": "cwc-london-16"}, {"n": 17, "id": "XFaeIbL-lvE", "title_en": "Building AI-native at enterprise scale: monday.com, Doctolib, and Delivery Hero", "title_th": "สามบริษัทยุโรปปรับเป็น AI-native บนโค้ดเก่า (monday.com, Doctolib, Delivery Hero)", "speakers": [{"name": "Rebecca", "role": "Anthropic Go-To-Market team (ผู้ดำเนินรายการ)"}, {"name": "Ruslan (ชื่อเพี้ยนใน ASR: ถูกเรียกต่างกันหลายแบบ)", "role": "engineering leader ที่ monday.com"}, {"name": "Alex", "role": "ตัวแทน Doctolib (ที่ transcript เขียนว่า Dr. Lib); ตำแหน่งไม่ได้ยิน"}, {"name": "Ulrich Schäfer", "role": "VP Tech Foundations ที่ Delivery Hero"}], "track": "enterprise", "tags": ["enterprise-adoption", "claude-code", "evals", "mcp-tools-skills"], "tldr_th": "แพเนลผู้นำเทคโนโลยีจากสามบริษัทที่ก่อตั้งก่อนยุค LLM เล่าว่าปรับเป็น AI-native บน codebase เก่ายังไง Delivery Hero สร้าง agent HeroGen ที่ส่ง PR เข้า production เฉลี่ย 173 รายการต่อวัน, Doctolib ทำ skills marketplace ให้ทั้งองค์กร, monday.com ใส่ Claude ในตัวผลิตภัณฑ์ (monday Vibe) บทสรุปร่วมคือ ลองใช้เลย อย่ารอสภาพที่สมบูรณ์ และเมื่อโมเดลเปลี่ยนต้องวัดแบบ end-to-end", "tldr_en": "Panel of Delivery Hero, Doctolib and monday.com leaders on becoming AI-native on old codebases: an autonomous PR agent, an org-wide skills marketplace, and in-product vibe coding, with advice to start now and evaluate model changes end-to-end.", "audience_th": "ผู้นำวิศวกรรมหรือทีม platform ในองค์กรขนาดใหญ่ที่มี codebase เก่าและกำลังวางแผนนำ Claude ไปใช้ทั้งภายในและในผลิตภัณฑ์", "points": [{"th": "ทั้งสามบริษัทก่อตั้งช่วง 2011-2013 ก่อนยุค LLM และไม่มีใครเริ่มจาก greenfield monday.com อายุราว 14 ปี เป็น monolith ที่กำลังแยกออก, Doctolib ครึ่งหนึ่งเป็น monolith อายุกว่าทศวรรษ อีกครึ่งเป็น distributed services ใหม่, Delivery Hero ให้บริการกว่า 60 ตลาด", "en": "All three were founded 2011-2013 with legacy codebases: monday.com ~14 years/monolith, Doctolib half monolith, Delivery Hero in 60+ markets."}, {"th": "Delivery Hero (Ulrich): สร้าง HeroGen ระบบ autonomous software delivery รับ Jira ticket หรือ GitHub issue แล้วทำจนได้ PR ที่ merge ได้ พัฒนาช่วงครึ่งหลังของปีก่อน เปิดตัว Q1 ผู้พูดบอกว่าเฉลี่ย 173 PR ที่ merge เข้า production ต่อวันในช่วง 10 วันล่าสุด และราว 7,000 PR ตั้งแต่เปิดตัวเดือนกุมภาพันธ์", "en": "Delivery Hero (Ulrich): HeroGen takes Jira/GitHub issues to mergeable PRs; ~173 merged PRs/day (last 10 days) and ~7,000 since February."}, {"th": "Doctolib (Alex): ผู้พูดบอกว่าพนักงานใช้ Claude ใกล้ 100% รวมถึงสายที่ไม่ใช่ engineer หลักคิดคือให้ platform team เป็นผู้เปิดทางและทำให้แนวปฏิบัติที่ดีขยายต่อ จึงสร้าง skills marketplace ดู skill ที่ถูกใช้มากและมาแรงได้ มี environment ที่ต่อ tool ให้พร้อมและแพ็ก skill เข้าไปตั้งแต่ onboarding รวมทั้งช่อง Build with AI ที่คึกคักที่สุดของบริษัท", "en": "Doctolib (Alex): near-100% adoption, skills marketplace, preconfigured dev environment, and a lively Build with AI channel; platform team enables and scales what engineers find."}, {"th": "monday.com (Ruslan): ใช้ Claude ทั้งภายในและในผลิตภัณฑ์ monday Vibe แปลง prompt เป็น PRD แล้วสร้างแอปในนาที ทำ POC ได้ในไม่กี่วันเพราะลงทุน open platform ให้นักพัฒนาภายนอกไว้ก่อน ทำให้ Vibe ใช้ API, SDK และ deployment ชุดเดียวกับนักพัฒนาภายนอก ส่วนที่ยากต่อคือการทำให้ทุกฟีเจอร์เปิดผ่าน API", "en": "monday.com (Ruslan): monday Vibe turns a prompt into a PRD and a working app in minutes; early investment in the open platform enabled a POC in days; making every feature API-accessible is the long road."}, {"th": "เมื่อโมเดลเปลี่ยน Delivery Hero (Ulrich) บอกว่า Opus รุ่นเมื่อพฤศจิกายนปีก่อนคือจุดที่ HeroGen ใช้งานได้จริง และยังอยู่กับ Opus 4.5 เพราะยังไม่มี A/B testing กับ volume พอจะตัดสินย้ายโมเดล ส่วน Doctolib (Alex) มีทีม eval เข้มงวดสำหรับผลิตภัณฑ์ AI แต่ฝั่ง development process ยังเป็นความรู้สึกอยู่", "en": "Delivery Hero: Opus release in November made HeroGen real; still on Opus 4.5 for lack of A/B volume. Doctolib: strict evals for products, vibes for dev process."}, {"th": "monday.com (Ruslan) เล่าว่าตอนย้ายจาก Opus 4.5 เป็น 4.6 system prompt ที่จูนไว้ย้ายมาไม่ได้ ต้องคิดและจูนใหม่ โดยทำงานใกล้ชิดกับ solution engineers ของ Anthropic ระบบของ Vibe เป็น multi-model (มี orchestrator กับ workflow ที่มี action แบบ deterministic) จึงต้องวัด end-to-end แล้วตามด้วย A/B test", "en": "monday.com: 4.5 to 4.6 needed prompt rework with Anthropic solution engineers; multi-model system means end-to-end eval plus A/B testing."}, {"th": "สถาปัตยกรรมของ HeroGen ต่อเข้า Jira, GitHub Issues (เร็วๆ นี้ GitLab) แทนที่จะสร้างหน้าแชตใหม่ ต่อ CI เพื่อป้อน failure กลับให้ agent แก้ และต่อกับทีม security ให้ช่องโหว่ระดับโค้ดถูก assign ให้ agent ผู้พูดบอกว่า success rate (สัดส่วน PR ที่ merge ต่อที่ถูกปฏิเสธ) ขึ้นถึง 85% เพราะ council of agents คือหลายโมเดลรีวิวโค้ดเดียวกันเพื่อลดจุดบอด โดยต้นทุนไม่ได้เพิ่มมากอย่างที่คาด", "en": "HeroGen integrates with Jira/GitHub/CI/security; success rate reached 85% via a council of agents (multiple models reviewing the same code) without much extra cost."}, {"th": "บทเรียนด้านสถาปัตยกรรมจาก Doctolib (Alex) คือ codebase เล็กที่มีมาตรฐานและเอกสารชัดทำให้โมเดลทำงานดีกว่า ใน monolith ต้องบอกบริบทเพิ่มว่าแบบไหนคือวิธีใหม่ อีกข้อคือ bottleneck ย้ายที่ ต้องคิดกระบวนการใหม่ ไม่ใช่แค่โค้ด ส่วน monday.com (Ruslan) จะเน้น API-first ให้เร็วกว่านี้ และออกแบบ identity กับ permission ให้ agent เป็น first-class user", "en": "Doctolib: small standardized codebases work better, bottlenecks move. monday.com: would go API-first earlier and make agents first-class users in identity/permissions."}, {"th": "ช่วง lightning round ผู้ร่วมแพเนลเอนไปทาง specialist agents หลายตัวที่มี generalist ประสานงาน วิศวกรระดับสูงกลับมาลงมือสร้างโค้ดและสร้าง context layer (ที่เรียกว่า AI brains) และคำแนะนำปิดท้ายคือเริ่มใช้เลย โดย Delivery Hero ตั้ง mandate ให้ทุกทีมทำฟีเจอร์แบบ end-to-end ด้วย AI ในไตรมาสนี้", "en": "Lightning round: specialists orchestrated by a generalist; senior engineers hands-on again and building context layers ('AI brains'); advice: start now, no waiting for perfect conditions."}], "numbers": [{"th": "Delivery Hero / HeroGen (Ulrich): เฉลี่ย 173 PR ที่ merge เข้า production ต่อวันในช่วง 10 วันล่าสุด และราว 7,000 PR ตั้งแต่เปิดตัวเดือนกุมภาพันธ์ (คำอธิบายคลิปเขียนว่า merge 100+ PR ต่อวัน)"}, {"th": "Delivery Hero: success rate ของ HeroGen = PR ที่ถูก merge ต่อ PR ที่วิศวกรปฏิเสธโดยตรง ผู้พูดบอกว่าขึ้นถึง 85% จาก council of agents"}, {"th": "Delivery Hero: ยังใช้ Opus 4.5 ตั้งแต่ Opus รุ่นเดือนพฤศจิกายนปีก่อนที่ทำให้ระบบใช้งานได้จริง"}, {"th": "monday.com (Ruslan): บริษัทอายุราว 14 ปี; ย้ายจาก Opus 4.5 เป็น 4.6 แล้วต้องจูน system prompt ใหม่"}, {"th": "Doctolib (Alex): ผู้พูดบอกว่าการใช้ Claude อยู่ใกล้ 100%; codebase ครึ่งเป็น monolith อายุกว่าทศวรรษ อีกครึ่งเป็น distributed ที่สร้างในไม่กี่ปีนี้; PR ราวครึ่งหนึ่งยังเข้า monolith"}, {"th": "Delivery Hero: ให้บริการกว่า 60 ตลาด"}], "quotes": [{"text": "you need to build for the next model, not for the current one", "th": "ต้องสร้างเพื่อโมเดลรุ่นถัดไป ไม่ใช่รุ่นปัจจุบัน"}, {"text": "It's literally treating it as a completely different thing.", "th": "ต้องปฏิบัติต่อโมเดลใหม่ราวกับเป็นของคนละอย่างเลย"}, {"text": "stop waiting for perfect conditions, perfect use cases, also enough AI-ready work", "th": "เลิกรอสภาพที่สมบูรณ์ use case ที่สมบูรณ์ หรืองานที่พร้อมสำหรับ AI"}], "steps": [], "takeaways_th": ["ต่อ agent เข้ากับจุดที่ทีมทำงานอยู่แล้ว เช่น Jira, GitHub, CI แทนการสร้างหน้าแชตใหม่ เพื่อให้คนยอมใช้", "ลองให้หลายโมเดลรีวิวโค้ดเดียวกัน (council of agents) เพื่อลดจุดบอดของโมเดลตัวเดียว", "ตั้ง platform team ให้ทำหน้าที่เก็บแนวปฏิบัติที่วิศวกรคิดค้นเอง แล้วแพ็กเป็น skills marketplace กับ environment ที่พร้อมใช้ตั้งแต่ onboarding", "ก่อนเปลี่ยนรุ่นโมเดล เตรียม A/B testing กับ eval แบบ end-to-end และเผื่อเวลาจูน prompt ใหม่ อย่าสมมติว่าใช้แทนกันได้", "ถ้าจะเปิดระบบให้ agent เรียกใช้ ลงทุน API ที่สะอาดและ identity/permission ที่รองรับ agent ให้เร็ว", "เริ่มจากงานซ้ำๆ ที่เป็นภาระ ปล่อยให้ Claude ทำเต็มที่ แทนการรอ refactor ใหญ่เสร็จก่อน"], "caveats_th": ["transcript มาจาก Whisper large-v3 ที่ถอดเอง ไม่แยกผู้พูด การระบุว่าใครพูดอะไรอนุมานจากการแนะนำตัวและที่ผู้ดำเนินรายการเรียกชื่อ", "ชื่อผู้ร่วมแพเนลจาก monday.com ถูกเรียกต่างกันใน transcript (Ruslan / Rosalind / Roslyn / Rodrigue) น่าจะเป็นคนเดียวกันที่แนะนำตัวว่า Ruslan แต่ไม่แน่ใจ; ชื่อ Alex มาจากที่ผู้ดำเนินรายการเรียก และ ASR สะกดบริษัทเป็น Dr. Lib ซึ่งตรงกับชื่อใน title คลิปคือ Doctolib", "ส่วน lightning round ผู้ตอบแต่ละข้อไม่ชัด เพราะไม่แยกผู้พูด (เช่น คำตอบเรื่อง specialist กับเรื่องวิศวกรระดับ principal กลับมาเขียนโค้ด และ metric ที่ดูทุกเช้า) จึงสรุปเป็นภาพรวม ยกเว้นข้อที่บริบทชัด", "transcript ช่วงคำตอบเรื่อง best engineers มีประโยคซ้ำและขาดตอน (ASR เสียหาย) เนื้อหาตรงนั้นอ่านต่อเนื่องไม่ได้ทั้งหมด", "ตัวเลขและ success rate 85% เป็นข้ออ้างของผู้พูด ไม่มีหลักฐานอิสระ; ตัวเลข 173 ต่อวันเป็นค่าเฉลี่ย 10 วันล่าสุด ขณะที่คำอธิบายคลิปเขียน 100+ ต่อวัน", "ชื่อโมเดลที่ฟังได้ (Opus 4.5, 4.6) มาจาก ASR ยังไม่ได้ยืนยันกับแหล่งอื่น; monday.com ใช้คำว่า post-model ซึ่งน่าจะหมายถึงโมเดลระดับ Opus แต่ไม่แน่ใจ"], "related_existing": ["agentic-ai-enterprise", "claude-code-enterprise", "agent-skills", "multi-agent-patterns"], "dur": "29:10", "url": "https://www.youtube.com/watch?v=XFaeIbL-lvE", "asr": "whisper", "wiki": "cwc-london-17"}, {"n": 18, "id": "VueeyKcquoA", "title_en": "From one person to 80: Scaling a hypergrowth engineering org with Claude Code", "title_th": "Base44 โตจากคนเดียวเป็นทีม 80 คน ด้วย Claude Code และหลัก keep it simple", "speakers": [{"name": "Yoav", "role": "lead product ที่ Base44"}, {"name": "Gabriel", "role": "lead ฝั่ง AI (app builder agent) ที่ Base44"}], "track": "claude-code", "tags": ["claude-code", "evals", "devex", "mcp-tools-skills"], "tldr_th": "ทีม Base44 เล่าว่าเมื่อทีมโตจากวิศวกรคนเดียวเป็นราว 80 คน (หลัง Wix เข้าซื้อและควบรวมทีมอื่น) ใช้ Claude Code แก้คอขวดทีละช่วงด้วยวิธีที่เรียบง่ายตั้งใจ เช่น prompt เดียวช่วย onboard, ให้ Claude สรุป comment จาก PR เก่าเป็นกฎรีวิว, ใช้ frustration ของผู้ใช้เป็นสัญญาณ A/B test, แล้วช่วงหลังขยับเป็น bot ตัดสิน experiment, eval ที่มี user simulator และ QA agent บนเบราว์เซอร์", "tldr_en": "Base44 leaders show how they used Claude Code to remove onboarding, code review, experimentation, eval and QA bottlenecks while growing from one engineer to ~80, keeping each solution deliberately simple.", "audience_th": "ทีมสตาร์ทอัพหรือ product engineering ที่กำลังโตเร็วและอยากรู้ว่าจะใช้ Claude Code จัดการ onboarding รีวิว ทดลอง และ QA โดยไม่สร้างกระบวนการหนัก", "points": [{"th": "Base44 เป็นแพลตฟอร์ม vibe coding เริ่มโดย solo founder ปลายปี 2024 ผู้พูดบอกว่ามีกำไรภายในเมษายน 2025 แล้ว Wix เข้าซื้อ ทีมจึงขยายอย่างรวดเร็วจากสองคนเป็นราว 15 วิศวกร และเจอ 4 ปัญหา คือ onboarding, code review, การทดสอบกับผู้ใช้ และ product surface ที่กว้าง", "en": "Solo-founder vibe-coding platform, profitable by April 2025, acquired by Wix, grew 2 to ~15 engineers and hit onboarding, review, user validation and wide surface-area problems."}, {"th": "หลักที่ย้ำทั้งงานคือ keep everything simple onboarding ไม่ทำเอกสารที่ต้องอัปเดต แต่ให้วิศวกรใหม่รัน 2 prompt คือให้ Claude ไล่ commit ทั้งหมดแล้วบอกว่าใครสนใจอะไร (ได้แผนที่องค์กร) และขอ mermaid chart ว่า component ที่จะแตะทำงานยังไง ผู้พูดเล่าว่าวิศวกรใหม่ทำ WhatsApp integration เสร็จตั้งแต่พฤหัสถึงเช้าวันอาทิตย์ จากที่คาดว่า 1-2 สัปดาห์", "en": "Onboarding via two prompts (map of who cares about what from commits; mermaid chart of a component), no maintained docs; a new engineer shipped a WhatsApp integration in Thursday-to-Sunday vs expected 1-2 weeks."}, {"th": "Code review ไม่สเกลเพราะผู้ก่อตั้งดูแลทุก PR ทีมให้ Claude อ่าน comment จาก PR ที่สะสมใน repo แล้วสรุปสิ่งที่สำคัญที่สุดเป็น instruction สำหรับรีวิว รันซ้ำทุกไม่กี่วัน แทนการนั่งคิดกฎเอง", "en": "Claude distilled the founder's past PR comments into review instructions, rerun every few days."}, {"th": "การวัดคุณภาพ agent: ทีมเล็กเกินจะทำ eval suite เต็มรูป จึงใช้ข้อสังเกตว่าเมื่อทุกอย่างปกติผู้ใช้เงียบ ถ้าพังจะเสียงดัง ให้โมเดลเล็ก (ผู้พูดเรียกในที่นี้ว่า Haiku) จัดระดับ frustration ของแต่ละข้อความ แล้วปล่อยเวอร์ชันใหม่ให้ผู้ใช้เปอร์เซ็นต์น้อยๆ และดู frustration ใช้ได้ทั้งตอนเปลี่ยน infra, prompt หรือโมเดล", "en": "Classify user frustration per message with a small model and A/B test agent versions on a small share of users; works for infra, prompt or model changes."}, {"th": "ช่วงสอง ทีมโตจาก 40 เป็นราว 80 คนในคืนเดียวหลังรับคนภายนอก คนย้ายจาก Wix และควบรวมอีกผลิตภัณฑ์ (ในช่วงแนะนำ Yoav พูดว่า 50 ถึง 80) Gabriel เล่า 3 ปัญหา คือสเกลการทดลอง, eval และ QA", "en": "Phase two: ~40 to ~80 engineers overnight after external hires, Wix movers and a merged product; three challenges: experiments, evals, QA."}, {"th": "Experimentation: สร้าง bot ที่คอมเมนต์บน PR ว่า ship ได้เลย graduate หรือต้อง A/B test นานเท่าไร ใช้ KPI อะไร และเปิด experiment บน PostHog (transcript เขียน post-hoc) ให้ ส่วนกฎ ทีมไม่ตั้งคณะกรรมการ แต่ให้ Claude กลั่นจาก 100 experiment ล่าสุดกับ PR ที่ตรงกัน ผ่าน PostHog MCP ได้ร่างแรกใน 2-3 ชั่วโมง แล้วทำ dashboard กลางด้วยผลิตภัณฑ์ตัวเอง ต่อ BigQuery, PostHog, GitHub", "en": "A PR bot verdicts ship/graduate/A-B test with duration and KPIs; guidelines distilled by Claude from the last 100 experiments via the PostHog MCP; central dashboard built on Base44 itself."}, {"th": "Evals: ทีมไม่มีกำลังทำโครงการสามเดือน จึงสร้าง user simulator ที่เมื่อแอปบางส่วนใช้ไม่ได้ ไม่ถือว่า eval ล้ม แต่ส่งข้อความปฏิเสธกลับไปให้ agent แก้ต่อ แล้ววัด latency จำนวนรอบ ต้นทุน และ credits CI/CD จะเปิดแอป Base44 จริงทุกครั้งที่โค้ด AI เปลี่ยน และใช้ Stagehand จำลองการกระทำผู้ใช้ มี scenario ที่ทดสอบ compaction ด้วย", "en": "A user simulator feeds rejections back to the agent; CI/CD spins up a real Base44 app per AI-code change and drives it with Stagehand; measures latency, turns, cost, credits."}, {"th": "QA: ห่อ flow หลักไว้เป็น skills ให้ Claude Code ใช้เบราว์เซอร์ (Playwright MCP) โดยไม่ต้องเรียนรู้แพลตฟอร์มใหม่ทุกครั้ง ทำ CLI ที่ซ่อน API/database เพื่อ setup สถานการณ์ทดสอบ แล้วรวมเป็น meta skill ว่าด้วย QA เมื่อเปิด PR agent จะวางแผนทดสอบ ทดสอบกับแอป Base44 และรายงานพร้อม screenshot ผู้พูดบอกว่าใช้ได้ราว 80% ของเวลา", "en": "Skills wrap main flows; CLIs abstract APIs/DB for test setup; a QA meta-skill triggers on PRs, tests via browser and reports with screenshots; works ~80% of the time per speaker."}, {"th": "บทสรุป: เรียบง่ายและเลื่อนสิ่งที่ซับซ้อน (เช่น eval) ไปจนถึงจังหวะที่เหมาะ, เข้ารหัส taste ของทีมจากการกระทำที่ผ่านมา, ใช้ผลิตภัณฑ์ตัวเองถ้าทำได้ และ bottleneck จะย้ายที่เรื่อยๆ ตอนนี้กำลังทำ post-validation หลัง PR ถึง production", "en": "Keep it simple, delay complexity until the right moment, encode team taste from past actions, dogfood, and expect the bottleneck to keep moving (next: post-production validation)."}], "numbers": [{"th": "Base44 เริ่มปลายปี 2024 และมีกำไรภายในเมษายน 2025 ตามที่ผู้พูดเล่า"}, {"th": "ขนาดทีม: จาก solo founder เป็นราว 15 วิศวกรหลัง Wix เข้าซื้อ แล้วจาก 40 เป็นราว 80 คนในคืนเดียว (ช่วงแนะนำพูดว่า 50 ถึง 80 ซึ่งขัดกับช่วงหลัง)"}, {"th": "WhatsApp integration: คาดว่า 1-2 สัปดาห์ แต่วิศวกรใหม่ onboard วันพฤหัสแล้ว PR พร้อมเช้าวันอาทิตย์ มีคอมเมนต์รีวิวจาก PR model แค่ 2-3 ข้อ"}, {"th": "กลั่นกฎ experiment จาก 100 experiment ล่าสุดใน PostHog ได้ร่างแรกภายในไม่กี่ชั่วโมง"}, {"th": "ระยะเวลาทดสอบต่อฟีเจอร์: บางตัว 7 วัน บางตัวต้องเต็มเดือนเพราะกระทบ conversion และ premium rate ในระดับเปอร์เซ็นต์เล็กๆ"}, {"th": "QA skill ครอบคลุมประมาณ 80% ของเวลา ที่เหลือ agent จะเขียนว่าทดสอบไม่ได้และชี้ความสามารถที่ขาด; skill ไม่จำเป็นต้องครอบคลุม 100% แค่ราว 80% ของ flow"}], "quotes": [{"text": "you need to keep everything very very simple", "th": "ต้องรักษาทุกอย่างให้เรียบง่ายมากๆ"}, {"text": "when things start to break, that's when users get really, really loud inside the chat", "th": "พอของเริ่มพัง ผู้ใช้จะเสียงดังขึ้นมากในแชต"}, {"text": "the bottleneck will keep moving", "th": "bottleneck จะย้ายที่ไปเรื่อยๆ"}], "steps": [], "takeaways_th": ["แทนเอกสาร onboarding ที่ต้องอัปเดต ลองให้คนใหม่รัน prompt ให้ Claude สรุป commit history และวาด mermaid ของ component ที่จะแตะ", "ให้ Claude กลั่น comment รีวิวเก่าเป็นไฟล์ instruction แล้วรันซ้ำเป็นระยะ เพื่อขยายมาตรฐานของคนรีวิวหลัก", "ถ้ายังไม่พร้อมทำ eval ใหญ่ ใช้ frustration ของผู้ใช้เป็น metric ในการ A/B test เวอร์ชัน agent", "ห่อ flow ที่ทดสอบซ้ำบ่อยเป็น skills และทำ CLI สำหรับ setup ข้อมูลทดสอบ เพื่อให้ Claude Code ทำ QA ผ่านเบราว์เซอร์ได้", "ให้ Claude กลั่นกฎการตัดสินใจ (เช่น เมื่อไรต้อง A/B test) จากประวัติการทำงานจริง แล้วค่อยปรับต่อ ไม่ต้องตั้งคณะกรรมการ"], "caveats_th": ["transcript มาจาก Whisper large-v3 ที่ถอดเอง ไม่แยกผู้พูด ชื่อเฉพาะอาจเพี้ยน: Yoav และ Gabriel ผู้พูดแนะนำตัวเองในคลิปจริง แต่ไม่มีนามสกุล", "ASR เพี้ยนหลายจุด: post-hoc = น่าจะ PostHog, Naiku = น่าจะ Haiku, stage hand = Stagehand, ชื่อผู้ก่อตั้งที่ถูกเรียกว่า Maur/More น่าจะเป็นคนเดียวกันแต่สะกดไม่แน่ใจจึงไม่ระบุ", "ตัวเลขขนาดทีมไม่สอดคล้องกัน: ช่วงแนะนำพูดว่าจาก 50 ถึง 80 แต่ช่วงเนื้อหาบอกว่า 40 เป็นราว 80 และช่วงแรก 15 วิศวกร ผู้พูดอาจพูดผิดหรือ ASR ฟังผิด", "ช่วงเดโม eval ใน transcript มีประโยคซ้ำและเสียหาย (ฟังไม่ได้ว่าเดโมแสดงอะไร) จึงสรุปได้เฉพาะที่พูดไว้ ไม่รวมสิ่งที่อยู่บนหน้าจอ", "ผลลัพธ์ทั้งหมด (เช่น QA ใช้ได้ 80%, PR ผ่านใน Thursday-Sunday) เป็นคำอ้างของผู้พูด ไม่มีตัวเลขเชิงสถิติรองรับในคลิป"], "related_existing": ["claude-code-practices", "claude-code-workflows", "agent-skills"], "dur": "23:58", "url": "https://www.youtube.com/watch?v=VueeyKcquoA", "asr": "whisper", "wiki": "cwc-london-18"}, {"n": 19, "id": "eSP7PLTXNy8", "title_en": "Build a proactive agent workflow with Claude Code", "title_th": "สร้าง workflow agent เชิงรุกด้วย routines ใน Claude Code", "speakers": [{"name": "Maya", "role": "applied AI team, Anthropic"}], "track": "workshop", "tags": ["claude-code", "self-improving", "devex", "mcp-tools-skills"], "tldr_th": "routines คือฟีเจอร์ใน Claude Code ที่รัน session บน managed infrastructure ของ Anthropic เริ่มได้จาก schedule, GitHub event หรือ webhook ผู้พูดเดโมทำ routine อัปเดต docs อัตโนมัติ และให้กรอบตัดสินใจ 3 เรื่อง คือ trigger, context, steering", "tldr_en": "Routines run remote Claude Code sessions on managed infrastructure, triggered by schedule, GitHub events or webhooks. The talk demos a docs-automation routine and frames design as trigger, context, steering.", "audience_th": "นักพัฒนาที่ใช้ Claude Code อยู่และอยากให้รันเองโดยไม่ต้องดูแล cron/infra", "points": [{"th": "ปัญหาของ proactive agent ตอนนี้มี 3 ข้อ คือ ต้องตัดสินใจว่ารันที่ไหน (ไม่ควรรันบนเครื่องตัวเอง เพราะปิดเครื่องแล้วจบ ต้องจัดการ hosting, persistence, auth), ต้องคิดว่าจะ trigger เมื่อไหร่, และ headless session ดู/คุม/resume ลำบาก", "en": "Three pain points: where to run, when to trigger, and lack of visibility/steering in headless sessions."}, {"th": "routine คือ automation ที่เปิด remote Claude Code session โดยกำหนดแค่ prompt, repo, connector และ trigger ที่เหลือ Claude Code จัดการ ทำงานบน managed infrastructure ไม่ผูกกับ laptop", "en": "A routine = prompt + repos + connectors + trigger, run on managed infrastructure."}, {"th": "trigger มี 2 แบบ คือ time-based schedule และ event-based (GitHub events แบบ native หรือ POST ไป webhook/endpoint พร้อม payload เป็น context) ตัวอย่างเช่น ทำเมื่อ cut release หรือเมื่อ PR ที่ติด label \"need docs\" ถูก merge", "en": "Triggers: schedule or event (native GitHub events, or POST to a webhook with payload)."}, {"th": "ทุก routine คือ Claude Code session ที่เปิดดู ถามต่อ steer และ resume ได้จาก web, CLI และ desktop", "en": "Every routine is a normal Claude Code session you can open, steer and resume."}, {"th": "กรณีศึกษาภายใน: weekly PR ของ Claude Code เพิ่ม 200% ตั้งแต่ต้นปี วิศวกรที่ดูแล docs จึงตั้ง routine ให้รีวิวสิ่งที่ merge เข้า main เทียบกับ docs repo แล้วเปิด PR อัปเดต docs ทุกสัปดาห์ ผ่านคำสั่ง /schedule", "en": "Docs team case: weekly routine via /schedule compares merged changes to the docs repo and opens PRs."}, {"th": "ตัดสินใจ 3 เรื่อง: trigger (เมื่อไหร่), context (repo + connector เช่น Google Drive, Slack — context ที่ให้คือเพดานความสำเร็จ), steering (ทำให้ Claude ซื่อสัตย์)", "en": "Three design decisions: trigger, context (the ceiling of success), steering."}, {"th": "วิธี steer: agent-on-agent review (routine หนึ่งสร้าง PR อีก routine รีวิวก่อนคน), เข้าไปดู/ถามกลางทางจาก Claude Code บนเว็บ, และ verify output เช่น render หน้า docs ที่แก้", "en": "Steering: generator/critic routines, live intervention, and verifying outputs (e.g. render the doc page)."}, {"th": "เดโมที่สอง: routine trigger จาก GitHub issue opened ที่สืบสวนว่าเป็น docs gap หรือไม่ ถ้าใช่เปิด PR และ ping Slack ผู้พูดสั่งหยุด session กลางทางเพราะมี PR อยู่แล้ว เพื่อโชว์การ steer แบบ real time", "en": "Second demo: issue-opened trigger; speaker halts the session live to show steering."}], "numbers": [{"th": "weekly PRs ของ Claude Code เพิ่มขึ้น 200% ตั้งแต่ต้นปีใหม่ ตามที่ผู้พูดบอก"}, {"th": "routine ตัวอย่างรันทุกวันจันทร์ 10:00 น. เชื่อม GitHub และ Slack"}, {"th": "trigger มี 2 ประเภทหลัก: schedule และ event (GitHub native หรือ webhook POST)"}], "quotes": [{"text": "we believe that coding agents shouldn't wait for you to press enter to get started", "th": "เราเชื่อว่า coding agent ไม่ควรรอให้คนกด enter ก่อนเริ่ม"}, {"text": "Every routine is really just a Claude Code session under the hood", "th": "ทุก routine ก็คือ Claude Code session ธรรมดาเบื้องหลัง"}, {"text": "Proactive agents beat reactive agents. We want Claude to go from a tool to a teammate.", "th": "agent เชิงรุกชนะเชิงรับ เราอยากให้ Claude เปลี่ยนจากเครื่องมือเป็นเพื่อนร่วมทีม"}], "steps": ["เปิด Claude Code ใน terminal แล้วพิมพ์ /schedule ตามด้วยคำสั่ง เช่น ทุกสัปดาห์ให้รีวิวสิ่งที่ merge เข้า main เทียบกับ docs repo แล้วสร้าง PR ถ้ามีการเปลี่ยนแปลง", "ตอบคำถามที่ Claude ถามกลับ เช่น เวลาที่ให้รัน และจะแจ้งเตือนทาง Slack ไหม", "Claude สร้าง routine และ instructions ให้ ไปดูได้ที่ Claude Code บนเว็บ (claude.ai แท็บ Code แล้วเลือก routines)", "ตรวจ routine: เชื่อม 2 repo (source code กับ docs), รันทุกวันจันทร์ 10:00, ต่อ GitHub และ Slack", "เปิด session ที่รันแล้ว ดู Claude อ่านซอร์ส PR ที่ merge change log เทียบกับ docs แล้วเปิด PR", "สร้าง routine ใหม่ trigger จาก GitHub event ชนิด issue opened ต่อ docs repo, source repo, Slack และ GitHub MCP", "สร้าง issue ทดสอบ ดู run ใหม่ที่ได้ context จาก issue แล้ว steer ให้หยุด session", "ตัวอย่างต่อยอด: deploy verifier (CD pipeline POST ไป webhook, ต่อ Datadog/Grafana/Slack), on-call investigator, PM triage backlog รายสัปดาห์"], "takeaways_th": ["ลองหา task ประจำวันที่เปลี่ยนเป็น routine ได้ แล้วเริ่มด้วย /schedule", "ก่อนสร้างทุก routine ตอบ 3 ข้อ: trigger อะไร, context อะไรที่ต้องให้, steer อย่างไร", "ให้ routine ที่สร้างงาน กับ routine ที่รีวิวงาน แยกกัน", "เริ่มจาก human-in-the-loop (agent วิเคราะห์ คนตัดสิน) แล้วค่อยเพิ่มสิทธิ์เมื่อไว้ใจ", "ทุกเอาต์พุตควร verify ได้ เช่น render หน้า docs"], "caveats_th": ["ผู้พูดแนะนำตัวว่า Maya อยู่ applied AI team ของ Anthropic ไม่มีนามสกุล", "transcript เป็น auto-caption ใช้ \"Cloud Code\" แทน Claude Code", "คนที่ดูแล docs ถูกเรียกว่า \"Sarah\" (ชื่อจาก ASR)", "ตัวเลข 200% เป็นข้ออ้างของผู้พูด ไม่ได้ระบุช่วงเวลาที่แน่ชัดนอกจาก \"since the beginning of the new year\"", "deploy verifier เป็นแนวคิด/ตัวอย่างสมมติ ไม่ได้เดโมจริง"], "related_existing": ["claude-code-automation", "claude-code-background-agents", "claude-code-workflows", "claude-code-mcp", "multi-agent-patterns"], "dur": "22:03", "url": "https://www.youtube.com/watch?v=eSP7PLTXNy8", "asr": "yt-captions", "wiki": "cwc-london-19"}, {"n": 20, "id": "TQd_YQvydVg", "title_en": "Build AI agents using Claude in Microsoft Foundry", "title_th": "สร้าง AI agent ด้วย Claude บน Microsoft Foundry (เวิร์กชอป cupcake agent)", "speakers": [{"name": "Marlene Mungami", "role": "senior developer advocate, Microsoft"}, {"name": "Liam Hampton", "role": "Microsoft (ผู้ร่วมเวิร์กชอป)"}, {"name": "Chris Snoring", "role": "ผู้ร่วมเวิร์กชอป (ไม่ระบุตำแหน่ง)"}], "track": "workshop", "tags": ["cloud-platforms", "mcp-tools-skills", "enterprise-adoption", "model-selection"], "tldr_th": "เวิร์กชอปบน Microsoft Foundry: deploy Claude Sonnet 4.6, ลองใน playground, ต่อเข้า VS Code ด้วย endpoint+key, สร้าง cupcake agent ด้วย Microsoft Agent Framework แล้วเสียบ MCP server ของร้านให้ดึงข้อมูล คำสั่ง prompt และ banner", "tldr_en": "A Microsoft Foundry workshop: use Claude Sonnet 4.6 in the playground, wire endpoint and key into VS Code, build an agent with Microsoft Agent Framework, and give it a cupcake-store MCP server for tools and prompts.", "audience_th": "นักพัฒนาที่ใช้ Azure/Microsoft อยู่และอยากใช้ Claude สร้าง agent บน Foundry ต้องรู้ Python เบื้องต้น", "points": [{"th": "ผู้พูดมองว่าอุตสาหกรรมเปลี่ยนจาก single-turn ไปเป็น agentic system ซึ่งมีโจทย์ใหม่ 3 ข้อ คือ multi-step reasoning บน long context, ความน่าเชื่อถือ/observability/ความปลอดภัย และการเชื่อมต่อ tool กับแหล่งข้อมูล", "en": "Industry shift to agentic systems brings three challenges: long-context reasoning, reliability/security, tool connectivity."}, {"th": "Microsoft Foundry ถูกแนะนำเป็นแพลตฟอร์มรวมสร้าง AI application และ agent ประกอบด้วย models (รวม Claude), agent service, tools/integrations และ ML services เช่น fine-tuning", "en": "Foundry: unified platform with models, agent service, tools/integrations and ML services."}, {"th": "ผู้พูดบอกว่ามี connector และ MCP tool built-in กว่า 1,400 ตัว (เช่น SAP, ServiceNow) พร้อมฟีเจอร์ enterprise: security, observability, governance, ผสานกับ Defender, Purview, Entra ID", "en": "1,400+ built-in connectors/MCP tools plus enterprise security/governance integrations."}, {"th": "เหตุผลที่ใช้ Claude บน Foundry ตามผู้พูด 4 ข้อ: reasoning ระดับดีสุดสำหรับ agent, สร้าง/orchestrate agent และให้ tool ในแพลตฟอร์มเดียว, enterprise features, และวงจร prototype ถึง production เร็วด้วย evaluation/observability/monitoring ในตัว", "en": "Four claimed advantages: reasoning, agent building/orchestration, enterprise features, faster path to production."}, {"th": "workshop ทำบน Skillable VM ผ่าน aka.ms/cloudworkshop โจทย์คือร้านคัพเค้ก Sparkles ที่ลูกค้าเยอะเกินคนรับออเดอร์ จึงสร้าง agent มารับออเดอร์", "en": "Workshop on Skillable VM; scenario is a cupcake shop 'Sparkles' needing an ordering agent."}, {"th": "ใน Foundry เลือก Build > Models เห็น Claude Sonnet 4.6 เปิด playground แก้ system prompt ลองคุยได้ ใช้เทียบโมเดลและ prompt", "en": "Playground in Foundry to test Claude Sonnet 4.6 with different system prompts."}, {"th": "ดึง target URI กับ API key จากแท็บ details ใส่ไฟล์ .env ใน VS Code โดยต้องลบ v1/messages ท้าย endpoint ให้ลงท้ายด้วย anthropic แล้วตั้ง model เป็น Claude Sonnet 4.6", "en": "Copy target URI and API key to .env; strip v1/messages so endpoint ends with anthropic."}, {"th": "สร้าง agent ด้วย Microsoft Agent Framework (open source ของ Microsoft, Python และอาจมี TypeScript) แล้วต่อ cupcake store MCP server เป็น tool ได้ข้อมูลรสชาติจริง พร้อมดึง prompt (agent instructions กับ welcome banner) จาก MCP server ด้วย", "en": "Agent built with Microsoft Agent Framework; MCP server supplies tools, prompts and instructions."}], "numbers": [{"th": "Foundry มี built-in connectors และ MCP tools มากกว่า 1,400 ตัว ตามที่ผู้พูดบอก"}, {"th": "ผู้พูดบอกว่า Opus 4.7 เป็น \"daily driver\" ของตน"}, {"th": "โมเดลใน workshop: Claude Sonnet 4.6"}, {"th": "รสคัพเค้กจาก MCP: classic vanilla, lemon sponge, red velvet, chocolate"}, {"th": "เทมเพลต endpoint ต้องตัด v1/messages ออก ให้ลงท้าย anthropic"}, {"th": "ลิงก์เวิร์กชอป: aka.ms/cloudworkshop (ตามที่พูด)"}], "quotes": [{"text": "you can't just rely on the models getting better", "th": "จะพึ่งแค่โมเดลที่เก่งขึ้นอย่างเดียวไม่ได้"}, {"text": "MCP is Model Context Protocol, and this is an open standard for letting AI agents talk to external systems", "th": "MCP คือ Model Context Protocol มาตรฐานเปิดให้ agent คุยกับระบบภายนอก"}, {"text": "a good example of why it needs the MCP server because it needs to have that context available for it to be able to know which flavors are available", "th": "ตัวอย่างว่าทำไมต้องมี MCP server: agent ต้องมี context นั้นจึงรู้ว่ามีรสอะไรบ้าง"}], "steps": ["เปิด aka.ms/cloudworkshop กด Launch เพื่อเปิด VM บน Skillable (คลิกกล่องเขียวเพื่อกรอกค่าอัตโนมัติ)", "เปิด Edge > Microsoft Foundry ล็อกอินด้วย username/password ที่ให้มา เลือก project", "Start building > Build > Models ดู Claude Sonnet 4.6 เปิด playground ลองคุยและเปลี่ยน system prompt (เช่น sentient cupcake ตอบด้วยมุกฟรอสติ้ง)", "ไปแท็บ details คัดลอก target URI และ API key", "เปิด VS Code แก้ .env: ใส่ endpoint (ตัด v1/messages ให้ลงท้ายด้วย anthropic), API key และชื่อ model Claude Sonnet 4.6", "เปิด agent.py วางโค้ด Microsoft Agent Framework: import agent, สร้าง chat client (อ่านค่า deployment/key/endpoint จาก .env), นิยาม cupcake agent แล้วรันตามคำสั่งใน terminal", "วางบล็อกโค้ดต่อ cupcake store MCP server ผ่าน URL ส่งเป็น tool ให้ agent (ต้อง save ไฟล์แล้วรันใหม่) ถามรสวันนี้", "โหลด instructions และ welcome banner เป็น prompt จาก MCP server", "คุยกับ agent: สร้าง customer ID ใหม่ (ชื่อ นามสกุล เมือง) เลือกรส red velvet", "อ่าน voucher 6 ตัวอักษรจากแดชบอร์ดหน้าห้อง ใส่ให้ agent รอออเดอร์ขึ้น ready for pickup และรับคัพเค้ก"], "takeaways_th": ["จะใช้ Claude บน Foundry ต้องมี endpoint (ตัด v1/messages), API key และชื่อ deployment", "ใช้ playground ทดลองโมเดลกับ system prompt ก่อนเขียนโค้ด", "MCP server ให้ได้ทั้ง tools, prompts, resources ใช้ส่ง persona/banner ของ agent ได้", "Microsoft Agent Framework เป็นทางเริ่มสร้าง agent บน Foundry แบบ open source", "ทำเวิร์กชอปซ้ำที่บ้านได้ โค้ดและเนื้อหาจะแชร์ (ผู้พูดบอก) และมี free Azure credits"], "caveats_th": ["ASR สะกด Foundry เป็น \"Boundary\" หลายครั้ง และนามสกุล Marlene Mungami / Chris Snoring อาจเพี้ยน", "ผู้พูดหลักคือ Marlene ส่วน Liam กับ Chris ถูกแนะนำชื่อแต่ไม่ได้พูดใน transcript", "ข้ออ้างเรื่อง 1,400 connectors และข้อดีของ Claude บน Foundry เป็นคำของผู้พูด ไม่ได้ยืนยัน", "โค้ดในเวิร์กชอปไม่ได้อ่านออกเสียงครบ จับได้แค่โครงและชื่อไฟล์", "transcript ใช้ \"Cloud\" แทน Claude ในบางที่ และ \"AI Foundry\" ปนกับ Microsoft Foundry"], "related_existing": ["microsoft-agent-framework", "microsoft-foundry-hosted-agent", "claude-code-mcp", "claude-code-enterprise"], "dur": "34:16", "url": "https://www.youtube.com/watch?v=TQd_YQvydVg", "asr": "yt-captions", "wiki": "cwc-london-20"}, {"n": 21, "id": "zFslvuvYifQ", "title_en": "Coding is no longer the constraint: Scaling devex to teams and agents at Spotify", "title_th": "Spotify กับ Honk: เมื่อการเขียนโค้ดไม่ใช่คอขวด วางมาตรฐานให้ทั้งทีมและ agent", "speakers": [{"name": "Niklas Gustavsson", "role": "Chief Architect & VP of Engineering, Spotify (ชื่อและตำแหน่งจากคำอธิบายคลิป ผู้พูดแนะนำตัวว่า Niklas)"}], "track": "enterprise", "tags": ["devex", "enterprise-adoption", "claude-code", "agent-reliability", "mcp-tools-skills"], "tldr_th": "Niklas เล่าว่า Spotify ใช้ AI เขียนโค้ดทั้งองค์กร และสร้าง Honk เป็น background coding agent บน Agent SDK ต่อเข้ากับ Fleet Shift (แพลตฟอร์ม migration) กับ Backstage (catalog ซอฟต์แวร์) ข้อสรุปคือ stack ที่เป็นมาตรฐานเดียวกันทำให้ทีมเก่งขึ้น agent ก็เก่งขึ้นด้วย พอโค้ดไม่ใช่คอขวด คอขวดก็ย้ายไปอยู่ที่การตัดสินใจและการ review ของคน", "tldr_en": "Spotify's Chief Architect describes Honk, a background coding agent built on the Claude Agent SDK and wired into Fleet Shift and Backstage, and argues that standardization, tests and guardrails make agents effective while the bottleneck shifts from coding to human decisions and review.", "audience_th": "วิศวกร / engineering lead ที่ดูแลองค์กรใหญ่ และอยากรู้ว่าต้องเตรียม codebase กับ platform อย่างไรให้ agent ทำงานได้ดี", "points": [{"th": "Spotify วิศวกรเกือบ 3,000 คน deploy ราว 4,500 ครั้งต่อวัน backend อยู่ใน monorepo 40 ล้านบรรทัด และมี polyrepo อีกหลายพัน การใช้ AI coding tools พุ่งหลัง Opus 4.5 ออกเมื่อเดือนพฤศจิกายนปีก่อน", "en": "About 3,000 engineers, ~4,500 deploys/day, a 40M-line backend monorepo plus thousands of polyrepos; AI tool adoption exploded after the Opus 4.5 release."}, {"th": "ผู้พูดบอกว่าวิศวกรเกิน 99% ใช้เครื่องมือ AI ทุกสัปดาห์ 94% ในแบบสำรวจรอบล่าสุดบอกว่าทำงานมีประสิทธิภาพขึ้น และ PR frequency เพิ่มขึ้น 76% โดย PR ส่วนใหญ่ agent เขียนร่วมกับ developer", "en": "Speaker reports >99% weekly AI tool use, 94% self-reported productivity gain, and a 76% rise in PR frequency, with most PRs co-authored by an agent."}, {"th": "ก่อนมี AI Spotify เจอปัญหา production code โตเร็วกว่าจำนวนวิศวกร 7 เท่า จึงสร้าง fleet management (ระบบข้างใต้ชื่อ Fleet Shift) ให้ automation สร้าง validate และ merge PR งานบำรุงรักษาเอง ถึงตอนนี้ merge ไปแล้ว 2.5 ล้าน PR ส่วนใหญ่ auto-merge", "en": "Pre-AI, code grew 7x faster than headcount, so Spotify built fleet management (Fleet Shift); 2.5M automated maintenance PRs merged, mostly with no human in the loop."}, {"th": "script แบบ deterministic ใช้ได้ดีกับการแก้ config หรือ bump dependency แต่พอเป็นการแก้ API call ที่ซับซ้อน script ก็บวมเพราะโค้ดมี API surface กว้าง ทีมเลยลองใช้ LLM แทน ผลที่ได้คือ Honk", "en": "Deterministic scripts break down on complex code changes because code has a wide API surface; LLMs replaced them, resulting in Honk."}, {"th": "Honk ใช้ Claude ผ่าน Agent SDK ห่อใน harness ของ Spotify รันใน Kubernetes pod พร้อม verification tools เช่นสั่ง build บน CI หลาย OS และ Fleet Shift ทำหน้าที่ schedule/orchestrate งานข้ามหลายพัน repo Java migration ล่าสุดที่เคยใช้หลายทีมหลายเดือนเหลือวิศวกรคนเดียวใช้ 3 วัน", "en": "Honk wraps the Agent SDK in Spotify's harness inside Kubernetes pods with CI verification tools; the latest Java migration took one engineer three days instead of months."}, {"th": "คนใช้ Honk ผ่าน Slack ด้วยการ @mention แล้วได้ PR กลับมา และสัปดาห์นี้ (Hack Week) ปล่อย Honk V2 alpha ที่ผูกกับ agent orchestration tool ชื่อ Chirp มี shared session หลายคนช่วยกันได้ ผู้พูดเปรียบว่าเป็น Google Docs สำหรับ Claude", "en": "Developers invoke Honk from Slack; Honk V2 alpha adds Chirp orchestration, multi-device use and shared multiplayer sessions."}, {"th": "Spotify เชื่อมานานว่ายิ่งใช้เทคโนโลยีน้อยยิ่งไว จึงบังคับ stack มาตรฐานผ่าน Backstage, technology radar, golden state และ Sound Check พร้อม lint/static analysis ที่ให้ feedback ทันทีตอน Claude เขียนโค้ด ผู้พูดบอกว่า codebase ที่กระจัดกระจาย Claude ทำได้แย่กว่า", "en": "Standardization via Backstage (catalog, tech radar, golden state, Sound Check) plus lint feedback helps agents; fragmented codebases make Claude perform worse."}, {"th": "Backstage เปิดเป็น MCP/CLI ให้ agent หาเจ้าของ component แล้วไปถามทีมใน Slack ได้ ส่วนวิศวกรรมที่ดี (test ที่ agent เรียกเองได้, โค้ดสม่ำเสมอ, วัดผลทุกอย่าง) ยังจำเป็นเท่าเดิม", "en": "Backstage is exposed to agents as MCP/CLI tools; strong engineering practices (tests agents can invoke, consistency, measurement) remain essential."}, {"th": "PR เพิ่ม 76% แปลว่า review หนักขึ้น Spotify เริ่ม auto-approve PR ที่ปลอดภัยพอ และเอาแรงคนไปไว้ที่จุดสำคัญ ส่วน prototype ที่เคยใช้หลายวันหรือหลายสัปดาห์ ตอนนี้ใครก็ใช้ Claude ใน client monorepo ทำได้ในไม่กี่นาที คอขวดย้ายไปที่การตัดสินใจว่าจะ ship อะไร", "en": "More PRs means a review burden; some are auto-approved. Anyone can now prototype in minutes in the real codebase, moving the bottleneck to decision-making."}], "numbers": [{"th": "วิศวกรใกล้ 3,000 คน · deploy ราว 4,500 ครั้ง/วัน · backend monorepo 40 ล้านบรรทัด"}, {"th": "ผู้พูดบอกว่า >99% ของวิศวกรใช้ AI coding tools ทุกสัปดาห์ และ 94% รายงานว่าผลิตภาพดีขึ้น"}, {"th": "PR frequency เพิ่ม 76% (ผู้พูดบอกว่าตัวเลขขยับตลอดช่วงเตรียมสไลด์) และมี PR ให้ review มากขึ้นตามนั้น"}, {"th": "production code โตเร็วกว่าจำนวนวิศวกร 7 เท่า (ก่อนมี AI)"}, {"th": "Fleet Shift merge แล้ว 2.5 ล้าน automated maintenance PR; migration ตัวอย่างหนึ่งเล็ก ๆ ครอบคลุม 39 repo"}, {"th": "Java migration ล่าสุดใช้ 3 วันด้วยเครื่องมือเหล่านี้ (จากเดิมหลายสัปดาห์ถึงหลายเดือน)"}, {"th": "จุดเปลี่ยนการใช้งาน: Opus 4.5 release เดือนพฤศจิกายนปีก่อน"}], "quotes": [{"text": "the need for strong engineering practices has not gone away with agents. It remains as important as it was before.", "th": "ความจำเป็นของแนวปฏิบัติวิศวกรรมที่ดีไม่ได้หายไปเพราะมี agent และยังสำคัญเท่าเดิม"}, {"text": "Simply, if Claude has a lot of other code to look at, and that code looks roughly consistent, Claude will do a better job.", "th": "ถ้า Claude มีโค้ดอื่นให้ดูเยอะและโค้ดเหล่านั้นหน้าตาสม่ำเสมอ Claude ก็ทำงานได้ดีขึ้น"}, {"text": "And this has brought prototyping for something that could take days or weeks to literally taking minutes now.", "th": "การทำ prototype ที่เคยใช้หลายวันหรือหลายสัปดาห์ ตอนนี้เหลือไม่กี่นาที"}], "steps": [], "takeaways_th": ["ทำ codebase ให้สม่ำเสมอก่อน: ลดความหลากหลายของ stack ที่ไม่จำเป็น แล้ว agent จะทำงานได้ดีกว่าใน repo ที่หน้าตาคล้ายกัน", "ฝัง guardrail เป็น lint / static analysis ให้ agent ได้ feedback ทันทีว่าใช้ pattern ผิด แทนการเขียนกฎเป็นเอกสารอย่างเดียว", "ให้ agent เรียก test และ verification tools ได้เอง จะได้ทำงานอิสระและได้ผลดีขึ้น", "เปิด internal catalog (เช่น Backstage หรือระบบเทียบเท่า) เป็น MCP หรือ CLI ให้ agent ถามเจ้าของ component ได้", "วางแผนรับ review load: ตัดสินว่า PR แบบไหนปล่อยผ่านอัตโนมัติได้ และให้คนดูเฉพาะจุดเสี่ยง"], "caveats_th": ["Transcript มาจาก Whisper large-v3 ที่ถอดเอง ชื่อเฉพาะอาจเพี้ยน (เช่น Hiram's Law ที่ผู้พูดอ้างถึง ซึ่งอาจเป็นชื่ออื่น ผู้พูดบอกเพียงว่ามาจากวิศวกรที่ Google)", "คำอธิบายคลิปเขียน 96% และ 60% ต่างจากที่ผู้พูดพูดใน transcript (>99% และ 76%) สรุปนี้ยึดตามที่ได้ยิน อาจเป็นสไลด์คนละรอบ", "ตัวเลขทั้งหมดเป็นข้ออ้างของ Spotify เอง ยังไม่มีหลักฐานอิสระยืนยัน", "ชื่อผู้พูดและตำแหน่งเต็มมาจากคำอธิบายคลิป ใน transcript ผู้พูดบอกแค่ชื่อ Niklas", "ช่วงท้ายมีประโยคเพี้ยน เช่น 'post-pandemic' น่าจะหมายถึง post-agent / หลังจาก agent ทำงาน"], "related_existing": ["backstage", "claude-agent-sdk", "harness-engineering", "agent-trust-ladder-verification-first", "claude-code-large-codebases"], "dur": "27:36", "url": "https://www.youtube.com/watch?v=zFslvuvYifQ", "asr": "whisper", "wiki": "cwc-london-21"}, {"n": 22, "id": "5YHIrTYxM3w", "title_en": "AI with Claude on AWS: From code to orchestration", "title_th": "ใช้ Claude บน AWS: ตั้งแต่ Claude Code บน Bedrock ถึง agent orchestration", "speakers": [{"name": "Antonio Rodriguez", "role": "Amazon Web Services (นักพัฒนา/ผู้บรรยายเวิร์กชอป)"}], "track": "workshop", "tags": ["cloud-platforms", "enterprise-adoption", "claude-code", "subagents", "mcp-tools-skills"], "tldr_th": "ภาพรวมความร่วมมือ Anthropic-AWS และ 3 ทางใช้ Claude บน AWS (Bedrock, Claude platform on AWS, Claude Desktop/Enterprise) ตามด้วยเวิร์กชอป Claude Code บน Bedrock 3 โมดูลบนโปรเจกต์ Excalidraw ที่ AWS แจก account ให้ทดลอง", "tldr_en": "Overview of the Anthropic-AWS partnership and three ways to use Claude on AWS, followed by a three-module Claude Code on Bedrock workshop built around an Excalidraw repo.", "audience_th": "ทีมที่อยู่บน AWS หรืองาน regulated ที่อยากใช้ Claude Code ผ่าน Bedrock รู้จัก Claude Code มาบ้างแล้ว", "points": [{"th": "ผู้พูดเล่าว่า Amazon ลงทุนหลายพันล้านดอลลาร์ใน Anthropic และเป็น primary cloud provider โดย Anthropic ผูกพันใช้งานบน AWS มากกว่า 100 พันล้าน (หน่วยตามที่ได้ยิน) เช่น Project Rainier และชิป Trainium รุ่น 3", "en": "Speaker cites multi-billion Amazon investment, Anthropic as AWS's primary-cloud customer, Project Rainier and Trainium 3."}, {"th": "จุดขายของ Bedrock 3 ข้อ: ฟีเจอร์ครบ (fine-tune รวม Haiku, evaluation, prompt optimization, distillation, knowledge bases, guardrails, automated reasoning checks), ความปลอดภัย (ข้อมูลอยู่ใน AWS boundary, PrivateLink, zero operator access) และ scalability กับการเลือก region เช่น London หรือ EU เพื่อ GDPR", "en": "Bedrock pitch: comprehensive features, security/zero operator access, scalability with region choice."}, {"th": "ผู้พูดระบุว่าไม่มีใครจาก Amazon หรือ Anthropic เข้าถึง instance ได้ และข้อมูลไม่ถูกใช้เทรนโมเดล", "en": "Claimed zero operator access and no training on customer data."}, {"th": "ข้อดีอื่น: data sovereignty, ใบเรียกเก็บเงินรวม, observability ผ่าน CloudWatch/CloudTrail, SLA, auth ผสาน SSO/OAuth/IAM กับ Entra ID หรือ Okta, compliance เช่น FedRAMP กับ HIPAA", "en": "Other benefits: sovereignty, consolidated billing, CloudWatch/CloudTrail, SLAs, identity integration, compliance."}, {"th": "สำหรับ agent มี Amazon Bedrock AgentCore สำหรับ host agent อย่างปลอดภัย ใช้ได้กับ framework เปิด เช่น LangChain, CrewAI และ Claude Agent SDK", "en": "Bedrock AgentCore hosts agents and works with LangChain, CrewAI and Claude Agent SDK."}, {"th": "ใช้ Claude บน AWS ได้ 3 ทาง: (1) Bedrock โดยตรง ล่าสุดเพิ่ม Opus 4.7 และ Messages API (2) Claude platform on AWS ที่ GA เมื่อไม่กี่วันก่อน เป็น gateway ส่งคำขอไป Anthropic ได้ feature parity บิลและ access control อยู่ AWS (3) Claude Desktop/Claude Code ผ่าน Claude Enterprise ใน AWS Marketplace หรือ 3P setup ที่ชี้ไป Bedrock", "en": "Three routes: Bedrock, Claude platform on AWS (GA days ago), Claude desktop/Code via Marketplace or 3P."}, {"th": "เวิร์กชอป Introduction to Claude Code on AWS ใช้ repo Excalidraw: โมดูล 1 ตั้งค่าพื้นฐาน, โมดูล 2 context + Playwright MCP จับ screenshot ไดอะแกรม + Git workflows, โมดูล 3 sub agents, plugins, custom skills, hooks และ advanced config และมีเวิร์กชอปขั้นสูงเรื่อง team standards, cost control, dashboards, ROI และ Agent SDK บน AgentCore", "en": "Workshop modules 1-3 on Excalidraw plus an advanced workshop on team standards, cost, ROI and AgentCore."}, {"th": "ปิดด้วยตัวอย่างตั้งค่า Claude Code ชี้ Bedrock (region, default model, ลด token, rate limit, telemetry) ซึ่งสั่งให้ Claude ตั้งค่าตัวเองหรือทำมือผ่าน settings ก็ได้", "en": "Closing: settings to point Claude Code at Bedrock (region, model, token limits, telemetry)."}], "numbers": [{"th": "Anthropic ผูกพันการใช้งานบน AWS \"more than 100 billion\" ตามที่ได้ยิน (หน่วยไม่ชัด)"}, {"th": "Trainium รุ่นที่ 3 ที่ AWS สร้างขึ้นสำหรับ Claude ตามที่ผู้พูดบอก"}, {"th": "Bedrock เพิ่ม Opus 4.7 และรองรับ Messages API"}, {"th": "Claude platform on AWS เป็น GA \"since a few days ago\""}, {"th": "ผู้พูดเริ่มทำงานกับ Anthropic เมื่อมากกว่า 3 ปีก่อน ตอน Claude 2 เปิดตัว"}, {"th": "ลิงก์เข้า account เวิร์กชอป: join.thatworkshop.aws (ตามที่ได้ยิน)"}], "quotes": [{"text": "We have zero operator access in the platform, which means that no one from Amazon or from Anthropic can actually get access to those instances", "th": "แพลตฟอร์มมี zero operator access ไม่มีใครจาก Amazon หรือ Anthropic เข้าถึง instance ได้"}, {"text": "Cloud platform on AWS is actually generally available since a few days ago", "th": "Claude platform on AWS เปิดให้ใช้ทั่วไปเมื่อไม่กี่วันก่อน (ASR เขียน Cloud แทน Claude)"}, {"text": "it's giving you the best of both worlds", "th": "ได้ข้อดีทั้งสองฝั่ง"}], "steps": ["เข้า join.thatworkshop.aws ใส่ access code ที่แสดงบนจอ ยอมรับ terms แล้วกด join event (ห้ามอัปโหลดข้อมูลลับหรือข้อมูลส่วนบุคคล)", "เปิด URL ที่ได้ไปยัง terminal และ VS Code UI ใน environment ที่ AWS เตรียมให้", "โมดูล 1: ใช้ Claude Code บน AWS ตั้งค่าและชี้ไปที่ repo Excalidraw", "โมดูล 2: จัดการ context ใช้ Playwright MCP ถ่าย screenshot ไดอะแกรมแล้วให้ Claude แก้อัตโนมัติ และลอง Git workflows", "โมดูล 3: sub agents, plugins, custom skills, hooks และ advanced configuration", "ทางเลือก: รันบนเครื่องตัวเองโดยตั้ง Claude Code ชี้ Bedrock หรือใช้ Claude Desktop ชี้ Bedrock", "ตั้งค่าเอง: กำหนด region ของ Bedrock, default model
