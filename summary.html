const TALKS = [{"n": 1, "id": "6amLO7I9xdg", "title_en": "Code with Claude London 2026: Opening Keynote", "title_th": "คีย์โน้ตเปิดงาน Code with Claude ลอนดอน: โมเดล แพลตฟอร์ม และ Claude Code ใน 3 ชั้น", "speakers": [{"name": "Lisa", "role": "Research PM team, Anthropic (พูดเรื่องโมเดล)"}, {"name": "Angela และ Caitlyn", "role": "ฝั่ง Claude platform (พูดและเดโม Claude Managed Agents; transcript ไม่ได้บอกนามสกุล)"}, {"name": "Cat", "role": "ฝั่ง Claude Code (transcript เขียน 'Kad'/'Cat'; พูดเรื่องฟีเจอร์และลูกค้าองค์กร)"}, {"name": "Boris", "role": "ผู้สร้าง Claude Code (transcript เขียน 'Boris Churnney'; เดโมช่วงท้าย)"}], "track": "keynote", "tags": ["product-keynote", "managed-agents", "claude-code", "model-selection", "enterprise-adoption"], "tldr_th": "คีย์โน้ตเปิดงาน Code with Claude ครั้งแรกนอก San Francisco เล่าเป็น 3 ชั้น คือโมเดล (Opus 4.7, Mythos preview) แพลตฟอร์ม (Claude Managed Agents ที่เพิ่ม self-hosted sandboxes กับ MCP tunnels) และ Claude Code (agents view, routines, autofix) ข้อสรุปหลักคือ ความสามารถของโมเดลโตแบบ exponential แต่องค์กรส่วนใหญ่ยังรับไปใช้แบบ linear ช่องว่างตรงนี้คือสิ่งที่นักพัฒนาต้องปิด", "tldr_en": "Opening keynote in three layers: models (Opus 4.7, Mythos preview), the Claude platform (Managed Agents with new self-hosted sandboxes and MCP tunnels), and Claude Code (agents view, routines, autofix). Core message: model capability is exponential while organizations adopt linearly, and developers close that gap.", "audience_th": "เหมาะกับคนที่อยากเห็นภาพรวมทิศทางผลิตภัณฑ์ Anthropic ก่อนเลือกเซสชันย่อย ไม่ต้องมีพื้นฐานลึก", "points": [{"th": "0:00 วิวัฒนาการของการเขียนโค้ด: ผู้พูดเปิดด้วยเรื่องหัดเขียนโปรแกรมบนเครื่องคิดเลข TI-83 ตอนอายุ 13 แล้วบอกว่าระยะห่างระหว่าง 'มีไอเดีย' กับ 'มันรัน' กำลังหดลงอีกรอบ ยกตัวอย่าง Spotify กับ Binty", "en": "Opens with learning to code on a TI-83 calculator and argues the distance from idea to running program is collapsing again; cites Spotify and Binty."}, {"th": "7:07 ยุค exponential: ผู้พูดไล่ไทม์ไลน์จาก Opus 4 เมื่อปีก่อน มาถึง agent ที่รันข้ามคืน และ Mythos ที่เจอช่องโหว่อายุ 27 ปีใน OpenBSD แล้วชี้ว่าโมเดลโตแบบ exponential แต่องค์กรส่วนใหญ่ยังใช้ AI แบบ linear", "en": "Timeline from Opus 4 to overnight agents to Mythos finding a 27-year-old OpenBSD bug; capability is exponential but organizational adoption is linear."}, {"th": "11:52 ความสามารถของโมเดล: Lisa บอกว่าส่งโมเดล frontier 8 ตัวใน 12 เดือน ตัวอย่างลูกค้าของ Opus 4.7 มี AMP, Rakuten, Claude Design แล้วมองไปข้างหน้าที่ judgment/code taste, context ที่เหมือนไม่มีขีดจำกัด และ multi-agent coordination โดยใช้ 'task horizon' เป็นตัววัด", "en": "Lisa: eight frontier models in 12 months; Opus 4.7 customer examples; future focus on judgment, effectively infinite context, multi-agent coordination, measured by task horizon."}, {"th": "16:52 สร้างเพื่ออนาคต: ให้ออกแบบสำหรับโมเดลรุ่นถัดไป ไม่ใช่รุ่นปัจจุบัน scaffolding (loop, instructions, tools) ที่เคยช่วยอาจกลับมาฉุด Claude เมื่อโมเดลเก่งขึ้น ให้ใช้ primitive ทั่วไปอย่าง file system กับ sandbox และทำ evals ที่ยากขึ้นเรื่อยๆ", "en": "Build for the next model; scaffolding can hold smarter models back; prefer general primitives like file systems and sandboxes; keep making harder evals."}, {"th": "20:40 Claude Managed Agents: เสนอ advisor strategy (โมเดลเล็กรันงาน ขอคำปรึกษาจากโมเดลใหญ่ผ่าน tools array ของ messages API) แล้วประกาศ self-hosted sandboxes (รองรับ Daytona, Cloudflare, Vercel, Modal) กับ MCP tunnels ที่ให้ agent เข้าถึง MCP server หลัง firewall ได้ พร้อมเดโม growth agent ของบริษัทสมมติ Counter", "en": "Advisor strategy via the tools array; new self-hosted sandboxes (Daytona, Cloudflare, Vercel, Modal) and MCP tunnels for MCP servers behind a firewall; demo with fictional company Counter."}, {"th": "30:36 Claude Code และ routines: Cat เล่าว่าตอนนี้คนส่วนใหญ่รันแบบ auto mode แล้วตรวจตอนงานเสร็จ มีหน้า desktop กับ agents view ใน CLI สำหรับดูหลาย session ฟีเจอร์ใหม่คือ code review, remote control บนมือถือ, autofix, routines และ Cloud Security ยกตัวอย่าง Shopify กับ Mercado Libre", "en": "Cat: most users run auto mode; desktop app and CLI agents view for many sessions; code review, remote control, autofix, routines, Cloud Security; Shopify and Mercado Libre examples."}, {"th": "39:50 เดโมและปิดงาน: Boris เดโมทีมสมมติ Acme Pay ให้ Claude ทำ refunds เอง ตรวจเองในเบราว์เซอร์ เจอ race condition แล้วแก้ จากนั้นให้ routine กับ CI autofix ดูแล PR ต่อ สรุปว่า 'default' เปลี่ยนจากการพิมพ์ prompt เอง เป็นให้ Claude เป็นคน prompt Claude Code", "en": "Boris demos Acme Pay: Claude builds refunds, verifies in the browser, fixes a race condition; routines and CI autofix babysit the PR. The default shifts to Claude prompting Claude Code."}], "numbers": [{"th": "Spotify: ผู้พูดบอกว่า background agent ที่สร้างบน Claude merge เข้า production มากกว่า 1,000 PR ต่อเดือน และลดเวลา migration ได้เกิน 90%"}, {"th": "Binty: ผู้พูดบอกว่าใช้ Claude API ลดขั้นตอนการขอใบอนุญาตครอบครัวอุปถัมภ์ไปได้ 20 วัน"}, {"th": "API volume บน Claude platform โตเกือบ 17 เท่า และนักพัฒนา Claude Code เฉลี่ยใช้เกิน 20 ชั่วโมงต่อสัปดาห์ (ตามที่ผู้พูดบอก)"}, {"th": "Lisa: ส่งโมเดล frontier 8 ตัวในรอบ 12 เดือน; Rakuten รายงานว่า Opus 4.7 แก้งาน production engineering ได้มากกว่ารุ่นก่อน 3 เท่า"}, {"th": "Advisor strategy: Eve Legal บอกว่าได้คุณภาพระดับโมเดล frontier ที่ต้นทุนต่ำลง 5 เท่า"}, {"th": "องค์กรที่ใช้ Claude Code ทั้งบริษัทบอกว่า PR ต่อวิศวกรเพิ่ม 200%"}, {"th": "Mercado Libre: วิศวกร 23,000 คน รีวิวเกิน 500,000 PR ปรับปรุงแอปเกิน 9,000 ตัว เป้า 90% autonomous coding ภายใน Q3 ปีนี้"}, {"th": "Mythos อ่าน source tree ของ OpenBSD ทั้งหมดและเจอช่องโหว่อายุ 27 ปี (ตามที่ผู้พูดบอก)"}], "quotes": [{"text": "You describe a problem and the program shows up.", "th": "คุณอธิบายปัญหา แล้วโปรแกรมก็โผล่มา"}, {"text": "Scaffolding is what we call the parts of the agent that aren't Claude.", "th": "scaffolding คือส่วนของ agent ที่ไม่ใช่ Claude"}, {"text": "The default isn't I'm going to prompt Claude code. The default is now I'm going to have Claude prompt Cloud Code.", "th": "ค่าเริ่มต้นไม่ใช่ 'ฉันจะ prompt Claude Code' แต่เป็น 'ฉันจะให้ Claude เป็นคน prompt Claude Code'"}], "steps": [], "takeaways_th": ["ออกแบบ architecture ให้พร้อมรับโมเดลรุ่นถัดไป ทบทวน scaffolding ที่เคยเขียนไว้ชดเชยโมเดลรุ่นเก่าว่ายังจำเป็นไหม", "ทำ evals ที่ยากขึ้นเรื่อยๆ และทำให้การอัปเกรดโมเดลเป็นเรื่องง่าย เพราะงานที่เคยพังแล้วเริ่มผ่านคือสัญญาณให้ปล่อยของใหม่", "ถ้าต้นทุนกับคุณภาพบีบกัน ลอง advisor strategy: โมเดลเล็กลงมือ โมเดลใหญ่เป็นที่ปรึกษา", "ถ้าองค์กรมีข้อจำกัดเรื่อง network หรือ data ให้ดู self-hosted sandboxes กับ MCP tunnels ของ Managed Agents", "เริ่มตั้ง routines ให้งานซ้ำๆ (triage issue, ดู PR, CI) แล้วตรวจแค่ตอนผลออกมา โดยต้องให้ Claude verify งานตัวเองได้ก่อน"], "caveats_th": ["Transcript เป็น YouTube auto-caption: 'Cloud Code'/'Quad' = Claude Code/Claude, 'Kad' น่าจะเป็น Cat, 'Boris Churnney' สะกดเพี้ยน", "ผู้พูดคนเปิดงานไม่ได้ถูกแนะนำชื่อในช่วงต้น (Lisa พูดว่า 'Like Boris mentioned' จึงน่าจะเป็น Boris แต่ transcript ไม่ยืนยันตรงๆ) จึงไม่ได้ใส่ชื่อแยก", "Angela และ Caitlyn มีเฉพาะชื่อต้น ส่วนตำแหน่งไม่ได้พูดไว้ ที่ใส่ไว้คือสิ่งที่อนุมานจากเนื้อหาที่พวกเขานำเสนอ", "ตัวเลขทั้งหมด (Spotify, Binty, 17x, 200%, Mercado Libre ฯลฯ) เป็นข้ออ้างของผู้พูด ไม่ได้ตรวจสอบกับแหล่งอื่น", "ชื่อโมเดลและฟีเจอร์ (Mythos preview, Opus 4.7, Cloud Security, Claude Design) ตามที่ได้ยินใน caption เท่านั้น"], "related_existing": ["claude-code-surfaces", "claude-code-automation", "claude-code-background-agents", "harness-engineering", "long-horizon-agents"], "dur": "46:27", "url": "https://www.youtube.com/watch?v=6amLO7I9xdg", "asr": "yt-captions", "wiki": "cwc-london-01"}, {"n": 2, "id": "tuY2ChJIx48", "title_en": "Beyond the basics with Claude Code", "title_th": "Claude Code ขั้นต่อไป: ปรับแต่ง agent ให้ scale ในงาน software engineering จริง", "speakers": [{"name": "Daisy Holman", "role": "engineer ในทีม Claude Code (สะกดตาม Whisper), เคยเป็น chair ของ C++ committee"}], "track": "claude-code", "tags": ["claude-code", "mcp-tools-skills", "subagents", "devex", "prompt-caching"], "tldr_th": "ผู้พูดวางกรอบการปรับแต่ง Claude Code เป็น 3 อย่าง คือ access, knowledge, tooling แล้วไล่ดู MCP, skills, hooks, subagents ว่าตัวไหน scale ได้เมื่อ monorepo มี skill เป็นแสน เพราะ context window เป็นทรัพยากรจำกัดและ KV cache ทำให้เปลี่ยนของต้นๆ prompt แล้วแพง สรุปคือ hooks เป็น zero overhead จริง ส่วน MCP/skills/subagents ยังต้องจ่ายค่า description ใน system prompt ตลอด ช่วงท้ายเล่าวิธีทำงานแบบ parallel + async ด้วย worktrees, /loop, auto mode", "tldr_en": "Customizing Claude Code through access, knowledge and tooling, and judging MCP, skills, hooks and subagents by how they scale against a fixed context window and the KV cache. Hooks are the only true zero-overhead primitive; the talk ends with parallel/async workflows (worktrees, /loop, auto mode).", "audience_th": "วิศวกรที่ใช้ Claude Code อยู่แล้วและต้องการวางระบบ customization ให้ทีม/monorepo ขนาดใหญ่ (รู้จัก MCP, skills, hooks เบื้องต้นมาก่อน)", "points": [{"th": "ถ้า Claude เข้าถึงสิ่งที่วิศวกรเข้าถึงไม่ได้ ก็ทำงานแทนไม่ได้ ผู้พูดชี้ว่างานส่วนใหญ่ไม่ได้อยู่ใน source code แต่อยู่ใน Slack, อีเมล, design doc, CI/CD, dashboard จึงต้องต่อ Claude เข้ากับสิ่งเหล่านี้ เคล็ดลับคือทำงานทั้งวันโดยไม่ออกจาก Claude Code แล้วจดทุกครั้งที่ต้อง alt-tab ไปหยิบข้อมูล นั่นคือสิ่งที่ Claude ยังขาด", "en": "Claude must reach what you reach: Slack, email, design docs, CI/CD, dashboards. Note every time you alt-tab, then connect those things."}, {"th": "เรื่อง knowledge ผู้พูดบอกว่า fine-tuning ไม่เวิร์กกับ convention ของ codebase (เสี่ยง hallucination เพิ่ม, ไม่คุ้มเพราะ frontier model เปลี่ยนเร็ว) ทางที่เหลือคือ in-context learning ซึ่งก็คือไฟล์ข้อความ เช่น CLAUDE.md และ skills", "en": "Fine-tuning does not fit codebase conventions; in-context learning (text files like CLAUDE.md and skills) is the lever you have."}, {"th": "เรื่อง tooling เปรียบ post-tool-use hooks เป็น 'red squigglies' ของ agent คือ linter/LSP/เตือนว่าไฟล์นี้ generated ที่ชี้นำแต่ไม่บล็อก และ override ได้ แยกจากเครื่องมือที่ชดเชยความไม่ฉลาด (hard block) ซึ่งไม่ scale ตามความฉลาดของโมเดล", "en": "Post-tool-use hooks act like red squigglies: overridable nudges (linters, LSP, generated-file reminders) that scale with intelligence, unlike hard blocks."}, {"th": "context window เป็นเป้าที่นิ่ง (ราว 1M token ใน Opus 4.7 ตามที่พูด) เปรียบเหมือนรัน NPM บน Arduino ต้องใส่เฉพาะสิ่งสำคัญที่สุดในรูปเล็กที่สุด หลัก 'don't pay for what you don't use' และยังมีข้อจำกัด KV cache คือถ้าแก้ของต้น prompt ทุก token ที่ตามมาจะกลายเป็น uncached (แพงกว่าราว 10 เท่า) ต้องวางของ stable ไว้หน้า ของ volatile ไว้ท้าย", "en": "Context is a fixed budget like NPM on an Arduino; KV cache means editing early prompt content makes later tokens uncached, so put stable content first and volatile last."}, {"th": "MCP ออกแบบมาสำหรับ chatbot ที่ไม่มี shell: ถ้ามี CLI อยู่แล้ว การเขียน skill สอนใช้ CLI ง่ายกว่า MCP ยกเว้นส่งให้ลูกค้าไม่เทคนิค แต่ยังต้องใช้ MCP ของคนอื่นสำหรับ Slack/email และ tool schema ใน system prompt ทำให้ 20 servers x 15 tools กินเกือบทั้ง context ส่วน tool search ช่วยได้ระดับหนึ่งแต่ 'no free lunch'", "en": "MCP suits chatbots without a shell; with a CLI, a skill is easier. Many MCP tools bloat context; tool search helps but is not free."}, {"th": "Skills คือ 'lazy system prompt': body จ่ายเมื่อใช้ แต่ description โหลดตลอด (ราว 300-400 token ถึงจะ trigger น่าเชื่อถือ) และยังไม่มี hierarchy หรือ lazy sub-skills ผู้พูดบอกว่าอาจมีประกาศเรื่องนี้ใน 2-3 สัปดาห์ ส่วน hooks เป็น zero overhead จริงเพราะรันนอก context ถ้าไม่ match ก็ไม่มีต้นทุน token", "en": "Skills: body is pay-per-use but descriptions are always loaded; no hierarchy yet. Hooks run outside the context so cost zero tokens when they do not fire."}, {"th": "Subagents ย้าย system prompt และการอ่านไฟล์ไปอยู่ context แยก แต่ description บรรทัดเดียวของแต่ละตัวยังอยู่ใน parent prompt ผู้พูดจึงไม่ยอมให้ plugin ใส่ CLAUDE.md แบบ unconditional (ดูถูกแต่แพงมาก) ถ้าจำเป็นให้คืนข้อความจาก session start hook เพื่อให้เห็นชัดว่าผู้ใช้จ่ายทุกครั้ง และมองว่า plugin คือ context engineering primitive ไม่ใช่ memory", "en": "Subagents move work to a separate context but descriptions still sit in the parent prompt; plugins should not ship unconditional CLAUDE.md, use a session-start hook instead."}, {"th": "ทิศทางการทำงานคือ async + parallel ผู้พูดใช้ git worktrees อายุยาวหลายตัว แต่ละตัวมี agent เฉพาะ, /color และ rename เพื่อสลับ context, agents คุยกันผ่าน send message tool, /loop (cron tool) สำหรับ babysit PR, auto mode แทนการถาม permission (ผู้พูดบอกว่าแพงขึ้นราว 30-40% แต่ไม่แน่ใจตัวเลข), Cloud agents view และ Remote Control", "en": "Async + parallel workflow: long-lived worktrees, /color and rename, send message between agents, /loop, auto mode, agents view and Remote Control."}], "numbers": [{"th": "context window ของ Opus 4.7 ราว 1 ล้าน token ตามที่ผู้พูดบอก (ผู้พูดว่า window ไม่ได้โตขึ้นเทียบกับปีก่อน)"}, {"th": "uncached token ราคาแพงกว่า cached ประมาณ 10 เท่า ตามที่ผู้พูดอธิบายเรื่อง KV cache"}, {"th": "MCP 20 servers x 15 tools ต่อตัว ผู้พูดบอกว่าส่วนใหญ่ของ context จะกลายเป็น tool definitions"}, {"th": "description ของ skill ที่ trigger ได้น่าเชื่อถือมักยาวราว 300-400 token"}, {"th": "ผู้พูดอ้างว่าบริษัทบางแห่งมี skill ใน monorepo เป็นหมื่นถึงแสนตัว และชนขีดจำกัด scaling"}, {"th": "auto mode แพงขึ้นราว 30-40% (ผู้พูดบอกเองว่าไม่แน่ใจตัวเลข อาจน้อยกว่านี้แล้ว)"}, {"th": "วิศวกรที่สร้าง Cloud agents view ผ่านงานราว 1,000 PR ในเดือนที่ผ่านมา ตามที่ผู้พูดเล่า"}], "quotes": [{"text": "if Cloud can't do everything you can do, it can't do your job with you", "th": "ถ้า Claude ทำทุกอย่างที่คุณทำไม่ได้ ก็ทำงานของคุณร่วมกับคุณไม่ได้"}, {"text": "The fastest way to make your agent better at your code base isn't a smarter model. It's a tighter feedback loop.", "th": "ทางลัดที่ทำให้ agent เก่งขึ้นใน codebase ไม่ใช่โมเดลที่ฉลาดกว่า แต่เป็น feedback loop ที่แน่นกว่า"}, {"text": "You have to be very intentional about what you put into your context window.", "th": "ต้องจงใจมากกับสิ่งที่ใส่เข้า context window"}], "steps": [], "takeaways_th": ["ลองทำงานทั้งวันโดยไม่ออกจาก Claude Code แล้วจดทุกครั้งที่ต้องสลับไปเครื่องมืออื่น จากนั้นต่อ Chat/CI/dashboard/doc เหล่านั้นให้ Claude", "ใช้ post-tool-use hooks เป็น feedback แบบเตือน (linter, LSP, แจ้งว่าไฟล์ generated) แทน hard block ใช้สคริปต์ที่ทีมมีอยู่แล้ว", "ถ้ามี CLI อยู่แล้ว เขียน skill สอนใช้ CLI ก่อนจะคิดห่อเป็น MCP server", "เลือก abstraction ตามต้นทุนใน context: อะไรที่ต้องจ่ายตลอดเวลา (description, tool schema, CLAUDE.md ของ plugin) ให้ระวังเมื่อจำนวนโตเป็นพัน-แสน", "ฝึกทำงาน parallel: worktree ต่อ agent, ตั้งชื่อ/สี session, /loop ดู PR, และลอง auto mode แทน dangerously-skip-permissions"], "caveats_th": ["แหล่งคือ transcript จาก Whisper large-v3 ที่ถอดเอง ไม่ใช่ YouTube caption: ชื่อเพี้ยนบ่อย เช่น 'Cloud' = Claude, 'Quad' = Claude ในช่วงหลัง", "ชื่อผู้พูด 'Daisy Holman' สะกดตามที่ Whisper ได้ยินจากการแนะนำตัว อาจเพี้ยน", "transcript ไม่แยกผู้พูด ส่วนที่พูดเรื่องโครงสร้าง repo (Anthropic monorepos, Claude Code repos) ถอดมาไม่ชัดและมีประโยคสับสน จึงไม่ได้สรุป", "ตัวเลข 30-40% ของ auto mode ผู้พูดบอกเองว่าไม่แน่ใจ", "ข้ออ้างเรื่องงานวิจัยปลายปี 2025 ว่า fine-tuning ทำให้ hallucination มากขึ้น ผู้พูดไม่ได้ระบุที่มา ตรวจสอบไม่ได้", "เรื่อง skill hierarchy 'ประกาศใน 2-3 สัปดาห์' เป็นแค่คำใบ้ของผู้พูด ไม่ใช่ข้อมูลยืนยัน"], "related_existing": ["claude-code-plugins", "claude-code-hooks", "claude-code-mcp", "kv-cache", "context-management"], "dur": "47:19", "url": "https://www.youtube.com/watch?v=tuY2ChJIx48", "asr": "whisper", "wiki": "cwc-london-02"}, {"n": 3, "id": "IA5LWIGqnyM", "title_en": "Running an AI-native engineering org", "title_th": "บริหารทีมวิศวกรรมแบบ AI-native: คอขวดย้ายแล้ว กติกาทีมก็ต้องเขียนใหม่", "speakers": [{"name": "Fiona Fung", "role": "Leads engineering and product for Claude Code and Cowork; เคยสร้างและนำทีมที่ Meta และ Microsoft"}], "track": "enterprise", "tags": ["enterprise-adoption", "claude-code", "devex", "subagents"], "tldr_th": "Fiona Fung เล่าว่าพอการเขียนโค้ดไม่ใช่คอขวดอีกต่อไป กติกาทีมหลายข้อก็ค่อยๆ หมดประโยชน์โดยไม่มีใครรู้ตัว ทีม Claude Code เลยเขียนใหม่ทั้งเรื่องรีวิว วางแผน onboarding การจ้างงาน และ source of truth ข้อสรุปคือให้เน้นการ verify เน้น dogfooding และให้ทีมมีสิทธิ์ฆ่า process เก่าได้เสมอ", "tldr_en": "Fiona Fung explains how the bottleneck moved away from writing code at Anthropic and which team norms the Claude Code team rewrote (review, planning, onboarding, hiring, source of truth), with verification and dogfooding as the main themes.", "audience_th": "เหมาะกับ engineering manager และ tech lead ที่กำลังเปลี่ยนทีมให้ใช้ agentic coding เป็นค่าเริ่มต้น", "points": [{"th": "คอขวดย้ายที่ ประโยคหลักคือ 'what served you prior may no longer' ตอนก่อนนี้ bandwidth ของวิศวกรแพง ทุกอย่างเลยหมุนรอบการปกป้องมัน (วางแผนเยอะ รีวิวเยอะ) แต่ตอนนี้การเขียนโค้ด เขียนเทสต์ และ refactor ไม่ใช่ส่วนที่ช้าแล้ว", "en": "Bottlenecks have moved: coding, tests and refactoring are rarely the slow part; processes built to protect scarce engineering bandwidth need re-examining."}, {"th": "คอขวดใหม่คือ verification, ใครรีวิว และ maintenance เธอเล่าว่า TDD ที่เคยเหมือนกินบรอกโคลีกลับสนุกขึ้นเมื่อให้ Claude เขียนเทสต์ก่อน", "en": "New bottlenecks are verification, who reviews, and maintenance; TDD became pleasant once Claude writes the tests."}, {"th": "ถกเถียงเชิงเทคนิค 'code wins' ไม่ต้องขึ้นไวต์บอร์ด ให้สร้างหลายเวอร์ชันของ PR มาเทียบกัน ลด design doc ยาวๆ คุยกันใน PR หรือ prototype แทน และ prototype ก็ขยายไปสู่ production ได้เร็วขึ้น", "en": "Technical debate: code wins; generate several PR versions, fewer long design docs, prototypes scale to production faster."}, {"th": "รีวิวโค้ด Claude เก่งเรื่อง style, lint, bug ชัดๆ และตรวจ spec drift (แนะนำให้เช็ค spec เข้า codebase) แต่ต้องมีคนในลูปสำหรับเรื่องกฎหมาย risk tolerance trust boundary รวมถึง product sense และ taste", "en": "Claude handles style, lint, obvious bugs, spec drift; humans stay for legal, risk tolerance, trust boundaries, product sense and taste."}, {"th": "โครงทีม: roles กำลังเบลอ เธอเน้น 2 โปรไฟล์ คือ creative builders ที่มี product sense กับคนที่มี deep system expertise manager ทุกคนในทีม Claude Code เริ่มจากเป็น IC ก่อน และ product sense สร้างจาก dogfooding ('ant food')", "en": "Team makeup: creative builders with product sense and deep system experts; every manager starts as an IC; product sense comes from dogfooding."}, {"th": "Source of truth คือ codebase: ใช้ Claude ทำ tech deep dive ตอน onboard และถ้ามี spec ให้แปลงเป็น skill ที่เช็คเข้า codebase จะได้ไม่ล้าสมัย", "en": "Code is the source of truth; use Claude for onboarding deep dives; turn specs into skills checked into the codebase."}, {"th": "การ rollout: กติกาที่ต้องตรงกันทั้งทีม (ทุกคนใช้ Claude Code/Cowork, Claude-ify ทุกอย่างที่ทำได้, มีสิทธิ์ฆ่า process เก่าอย่างชัดแจ้ง) กับพื้นที่ให้แต่ละ pod ปรับเองจากล่างขึ้นบน", "en": "Rollout: team-wide principles (everyone uses Claude, Claude-ify everything, explicit permission to kill old processes) plus bottom-up freedom for pods."}, {"th": "สัญญาณว่าได้ผล: onboarding ramp-up ลดลง, PR cycle time ลดลง (แต่ให้แตกเป็นช่วงดูว่าคิว CI/build ไม่ติด), commit ที่มี Claude ช่วยเพิ่มขึ้น และต้องวัดผลลัพธ์ผลิตภัณฑ์ด้วย ไม่ใช่แค่ throughput คำถามที่ยังเปิดอยู่: ต้องแยกทีม iOS/Android ไหม และจะ automate รีวิวไปไกลแค่ไหน", "en": "Signals: shorter onboarding ramp-up, PR cycle time (break it into stages), more Claude-assisted commits, plus product outcomes; open questions on separate iOS/Android orgs and fully automated review."}], "numbers": [{"th": "เธอบอกว่าแทบทุก commit ใน Claude Code ตอนนี้ co-authored โดย Claude (ไม่เห็น commit ที่ไม่ใช่มาหลายเดือน)"}, {"th": "ตัวอย่างอดีต: ตอนอยู่ Visual Studio ต้อง merge ได้ทีละ 6 PR เพราะคิว build เป็นคอขวด"}, {"th": "ตัวชี้วัดที่แนะนำ: onboarding ramp-up time (เวลาจนวิศวกรส่ง PR แรก), PR cycle time, สัดส่วน Claude-assisted commits"}], "quotes": [{"text": "building is cheap, arguing is expensive.", "th": "การสร้างถูก การเถียงแพง"}, {"text": "if Claude can do it, Claude should.", "th": "ถ้า Claude ทำได้ ก็ให้ Claude ทำ"}, {"text": "what served you prior may no longer.", "th": "สิ่งที่เคยรับใช้เรามา อาจไม่ใช่อีกต่อไป"}], "steps": [], "takeaways_th": ["เลือก workflow หรือการประชุมที่เสียแรงมากที่สุดมาหนึ่งอย่าง แล้วถามว่ายังตอบเป้าหมายเดิมไหม มี part ไหนให้ Claude ช่วยได้", "ทบทวน process ที่สะสมไว้ (SLA, design doc, ขั้นรีวิว) และให้ทีมมีสิทธิ์ยกเลิกอย่างเป็นทางการ", "ลงทุนกับ verification แบบ shift left: เช็ค spec เข้า repo, ใช้ automated review แต่คงคนไว้ที่ trust boundary", "ย้าย source of truth ไว้ใน codebase (เช่น spec เป็น skill) และใช้ Claude ช่วย onboard คนใหม่", "เวลาวัดผล PR cycle time ให้แยกช่วง ไม่งั้นอาจเข้าใจผิดว่า adoption ไม่ได้ผล ทั้งที่คอขวดย้ายไปอยู่ที่ CI"], "caveats_th": ["Transcript เป็น YouTube auto-caption: 'Cloud Code' = Claude Code, 'quad' = Claude, 'Mr. Peanut' เป็นตัวอย่างที่ผู้พูดเล่าเอง", "ผู้พูดเตือนเองว่าสไลด์บางแผ่นล้าสมัย (ควรเป็น 'ทุก teammate ใช้ Claude Code' ไม่ใช่ 'ทุก engineer')", "ผู้พูดไม่ได้ให้ตัวเลขเชิงปริมาณของ onboarding หรือ PR cycle time แค่บอกทิศทาง จึงไม่ใส่ตัวเลขเพิ่ม", "เรื่อง 'quietly stops working' กับกติกาทีม เป็นประสบการณ์ของทีม Claude Code ยังไม่ใช่หลักฐานว่าใช้ได้กับทุกองค์กร"], "related_existing": ["t-shaped-ai-native-engineer", "claude-code-enterprise", "ai-org-transformation", "skills-as-organization", "claude-code-practices"], "dur": "26:38", "url": "https://www.youtube.com/watch?v=IA5LWIGqnyM", "asr": "yt-captions", "wiki": "cwc-london-03"}, {"n": 4, "id": "QIriO1-vHYw", "title_en": "Getting more out of the Claude Platform", "title_th": "รีดประสิทธิภาพ Claude Platform: caching, context engineering, advisor strategy", "speakers": [{"name": "(ไม่ได้ระบุชื่อ)", "role": "product manager ทีม platform ที่ Anthropic (แนะนำตัวเอง ไม่ได้บอกชื่อ) และเป็น 'CEO ของ HeroCorp' ในเดโม"}, {"name": "Ben", "role": "CTO ของ HeroCorp (ตัวละครในเดโม) ขึ้นมาควบคุมเครื่องเดโม"}], "track": "agents-platform", "tags": ["prompt-caching", "model-selection", "agent-reliability", "cloud-platforms"], "tldr_th": "เซสชันปิดงานที่เดโมเอเจนต์ dashboard ของบริษัทสมมติ HeroCorp ลดต้นทุนทีละขั้น: เปิด prompt caching, ทำ context engineering (tool search, programmatic tool calling, compaction) แล้วสลับไปใช้ Sonnet คู่กับ Opus เป็น advisor ผู้พูดสรุปว่าต้นทุนลดลงกว่า 10 เท่าจากจุดเริ่มต้นโดยไม่เสียคุณภาพ ข้อสรุปหลักคือถ้าทำอย่างเดียวให้ทำ prompt caching", "tldr_en": "A live demo that cuts an agent's cost step by step: prompt caching, then context engineering (tool search, programmatic tool calling, compaction), then Sonnet with an Opus advisor. If you do one thing, do prompt caching.", "audience_th": "นักพัฒนาที่มี agent แล้วหรือกำลังจะขึ้น production และอยากลดต้นทุน/latency โดยคุณภาพไม่ตก (รู้จัก tool use และ Claude API เบื้องต้น)", "points": [{"th": "prompt caching ให้ผลสามอย่างตามที่ผู้พูดบอก: ส่วนลด 90% สำหรับ token ที่ cache, rate limit ไม่นับ cached token (hit rate 80% เท่ากับ limit ใหญ่ขึ้นราว 5 เท่า) และ time to first token ลดลง เป้าหมายสำหรับ agent คือ 80% ขึ้นไป ลูกค้าอย่าง Replit, Cursor, Perplexity, Claude Code ได้ 90%+", "en": "Prompt caching: 90% discount, effectively larger rate limits, lower latency. Target 80%+ hit rate; named customers reach 90%+."}, {"th": "ขั้นแรกคือรู้ cache hit rate ของตัวเอง ตอนนี้ console มี analytics ของ prompt caching ข้าง cost/usage และเพิ่งเพิ่มฟีเจอร์บอกว่าทำไม cache แตก ข้อผิดพลาดที่เจอบ่อยคือใส่ timestamp ไว้ใน system prompt เพราะ token ต้องตรงกันทุกตัว ทางเริ่มคือ auto caching (เปลี่ยนโค้ดบรรทัดเดียว) หรือ Claude API skill ที่ช่วยปรับลำดับ prompt", "en": "Measure hit rate first; console analytics now show why a cache broke (e.g. timestamps in the system prompt). Start with auto caching or the Claude API skill."}, {"th": "เดโม HeroCorp: เริ่มที่ hit rate 0 ต้นทุนราว 31 ปอนด์ต่อการโหลด พอเปิด caching ได้ราว 58% hit rate ต้นทุนลดเกือบครึ่ง โดย output เหมือนเดิมเพราะ caching ไม่กระทบความฉลาด แต่ context เต็มเมื่อมี 5 OKR จึงต้องทำ context engineering", "en": "Demo: from 0% hit rate and about 31 pounds to a 58% hit rate and nearly half the cost, then context fills up."}, {"th": "Tool search: ส่งให้โมเดลแค่ tool สำหรับค้น แล้วโหลดนิยาม tool จริงเมื่อต้องใช้ ผู้พูดบอกว่า Lovable ลดการใช้ token รวม 10% และผลลัพธ์ดีขึ้นด้วย ในเดโมเห็น schema ของ tool ใหญ่ๆ (เช่น 14,000 token) ไม่ถูกโหลดจนกว่าจะเรียกใช้", "en": "Tool search loads tool definitions on demand; Lovable reportedly cut token use 10% and improved quality."}, {"th": "Programmatic tool calling: ให้ Claude เขียนสคริปต์ Python เรียก tool แล้วกรองผลก่อนส่งกลับโมเดล ในเดโมผลจาก Gong ที่ยาวมากถูกย่อเหลือเฉพาะ aggregate sentiment ผู้พูดบอกว่า Quora ใช้กับ HTML โดยตัดส่วนไม่เกี่ยวข้องและประสิทธิภาพดีขึ้น", "en": "Programmatic tool calling lets Claude script the calls and filter results, e.g. Gong transcripts reduced to aggregate sentiment."}, {"th": "Compaction: เมื่อถึง threshold (เดโมตั้ง 400K) ระบบสรุป context ด้วย prompt ที่ปรับเองได้ แล้วคุยต่อ ให้ความรู้สึกว่า context ไม่จำกัด ผู้พูดแนะนำเริ่มที่ 400K-500K และบอกว่าขึ้นกับโมเดล ผู้พูดอ้างว่า Hex ใช้แล้วโค้ดง่ายขึ้น ต้นทุนในเดโมลดเหลือราว 11 ปอนด์", "en": "Compaction summarizes at a threshold (400K in the demo), cost fell to about 11 pounds; start at 400-500K."}, {"th": "Advisor strategy: ให้ executor เป็น Sonnet/Haiku แล้วเรียก Opus เป็น advisor เฉพาะเมื่อเจอเคสยาก เปรียบเหมือน junior จับคู่ senior ผู้พูดบอกว่า Bolt ใช้แล้วได้การตัดสินใจเชิงสถาปัตยกรรมดีขึ้นในงานซับซ้อน และงานง่ายไม่มี overhead เพราะไม่เรียก tool ในเดโม Sonnet มองสัญญา Metropolis เป็นสีเขียว แต่ Opus อ่านลึกแล้วพบว่าเป็นสีแดง (ตัวละครที่ลูกค้าต้องการไม่ว่างวันงาน)", "en": "Advisor strategy: Sonnet/Haiku executor consults Opus only on hard cases; in the demo Opus overturned Sonnet's green rating."}, {"th": "ข้อสรุป: ทำ prompt caching ก่อน (รู้ hit rate, ใช้ Claude API skill) แล้ว context engineering (คัดว่า tool ใดถูกส่ง, ผลลัพธ์ใดถูกส่งกลับ, compact เมื่อยาว) แล้ว advisor strategy และ 'ดู transcript ของ agent เสมอ' ผู้พูดบอกด้วยว่ามีฟีเจอร์ที่เพิ่งเปิดตัวใน 24 ชั่วโมง เช่น automatic prompt caching และ Claude Platform บน AWS", "en": "Takeaway order: caching, then context engineering, then advisor; always read your transcripts."}], "numbers": [{"th": "prompt caching: ส่วนลด 90% สำหรับ token ที่ cache; hit rate 80% = rate limit ใหญ่ขึ้นราว 5 เท่าในทางปฏิบัติ (ตามผู้พูด)"}, {"th": "เป้า cache hit rate 80%+ สำหรับ agentic app; Replit, Cursor, Perplexity, Claude Code 90%+"}, {"th": "เดโม: ต้นทุนราว 31 ปอนด์ที่ hit rate 0 -> ราว 11 ปอนด์หลัง caching + context engineering -> ลดต่ออีกด้วย Sonnet 4.6 + Opus 4.7 advisor; ผู้พูดสรุปว่าลดจากจุดเริ่มกว่า 10 เท่า"}, {"th": "cache hit ในเดโมหลังเปิด caching ราว 58%; cache write 172 tokens แล้ว cache hit 172 tokens ในตัวอย่างที่ซูม"}, {"th": "Compaction threshold ในเดโม 400K token; แนะนำเริ่มที่ 400K-500K แล้วปรับตามโมเดล"}, {"th": "ขนาด tool schema ในเดโม: hero retention metrics ราว 14,000 token, hero list 6,100, อีกตัว 9,300"}, {"th": "Lovable: ลด token รวม 10% ด้วย tool search (ตามผู้พูด)"}, {"th": "โมเดลในเดโม: Opus 4.7 (เริ่มต้น) แล้ว Sonnet 4.6 เป็น executor + Opus 4.7 เป็น advisor"}], "quotes": [{"text": "If you remember nothing else from this session, think about prompt caching.", "th": "ถ้าจำอย่างอื่นไม่ได้เลย ให้จำเรื่อง prompt caching"}, {"text": "Remember, prompt caching has no impact on intelligence, it is the exact same thing, just pre-processed and saving you money.", "th": "prompt caching ไม่กระทบความฉลาดของโมเดล ผลเหมือนเดิม แค่ประมวลผลล่วงหน้าและประหยัดเงิน"}, {"text": "It's green on the outside, but deep, deep red on the inside.", "th": "ข้างนอกเขียว แต่ข้างในแดงเข้มมาก (เปรียบ 'แตงโม' ในเคสสัญญา Metropolis)"}], "steps": ["เปิดเดโม dashboard ของ HeroCorp ดู developer console และ transcript ของ agent ซึ่งดึงข้อมูลจาก web, Slack, Gong, Jira", "เช็ก prompt cache hit rate (เริ่มที่ 0) แล้วเปิด prompt caching ได้ราว 58% hit rate และต้นทุนลดเกือบครึ่ง (31 ปอนด์เป็นเริ่มต้น)", "ใส่ context engineering ทีละชั้น: tool search (ไม่โหลด schema จนกว่าจะเรียกใช้), programmatic tool calling (สคริปต์กรองผลจาก Gong เหลือ aggregate sentiment), compaction (threshold 400K พร้อม prompt สรุปของตัวเอง) ต้นทุนเหลือราว 11 ปอนด์", "เปลี่ยน executor เป็น Sonnet 4.6 และตั้ง Opus 4.7 เป็น advisor ตรวจสัญญา Metropolis ที่ Sonnet ประเมินเป็นเขียว แต่ Opus แก้เป็นแดง", "ปิดด้วยการกดปุ่ม 'save the Metropolis contract' ในแดชบอร์ด และสรุปลำดับ caching, context engineering, advisor"], "takeaways_th": ["วัด prompt cache hit rate ของ agent ตัวเองก่อน (console analytics) ถ้าต่ำให้เริ่มจาก auto caching หรือ Claude API skill", "อย่าใส่ข้อมูลที่เปลี่ยนตลอด เช่น timestamp ไว้ต้น system prompt เพราะทำให้ cache แตกทั้งหมด", "เปิดอ่าน transcript ของ agent เป็นประจำ เพื่อเห็นว่าโมเดลเห็นอะไรจริงและมีของไม่จำเป็นอะไรปนอยู่", "ถ้า tool เยอะหรือผลลัพธ์ยาว ลอง tool search, programmatic tool calling และตั้ง compaction threshold ที่ 400K-500K", "ลองจับคู่ executor ราคาถูก (Sonnet/Haiku) กับ Opus advisor แล้ววัดคุณภาพและต้นทุนเทียบกับรัน Opus ล้วน"], "caveats_th": ["แหล่งคือ transcript จาก Whisper large-v3 ที่ถอดเอง ไม่ใช่ YouTube caption: 'Cloud' = Claude, 'cash/cashed' = cache/cached, 'CacheSkill' และ 'Cloud API skill' ควรเป็น Claude API skill", "ผู้พูดหลักไม่ได้บอกชื่อใน transcript จึงใส่ชื่อไม่ได้; Ben เป็นตัวละคร CTO ในเดโม (อาจเป็นคนจริงบนเวที แต่ transcript ไม่ยืนยัน)", "ผลลัพธ์ทั้งหมด (ลด 10 เท่า, 90% discount, Lovable 10%, Hex, Bolt, Quora) เป็นข้ออ้างของผู้พูดและเดโมสมมติ ตรวจสอบเองไม่ได้ ตัวเลขต้นทุนเป็นสกุลปอนด์ต่อการโหลด dashboard ในเดโมเท่านั้น", "ตัวเลขจาก ASR เช่น 58%, 172 tokens, 14,000/6,100/9,300 ควรตรวจกับวิดีโอ", "ผู้พูดบอกว่าหลายฟีเจอร์ (cache break analytics, automatic prompt caching, Claude Platform บน AWS) เพิ่งเปิดตัวใน 24 ชั่วโมงก่อนงาน ไม่ได้ตรวจสถานะปัจจุบัน", "Advisor strategy ไม่ได้ระบุชื่อ tool/พารามิเตอร์ API ใน transcript จึงไม่ได้ใส่ในขั้นตอน"], "related_existing": ["claude-code-prompt-caching", "kv-cache", "token-economics", "context-management", "cheap-model-delegation"], "dur": "26:41", "url": "https://www.youtube.com/watch?v=QIriO1-vHYw", "asr": "whisper", "wiki": "cwc-london-04"}, {"n": 5, "id": "G2B0YWuJUgI", "title_en": "The prompting playbook", "title_th": "Prompting playbook: ซ่อม prompt ที่มีอยู่ด้วย evals และสร้าง agent จากศูนย์", "speakers": [{"name": "Margo van Laar", "role": "Applied AI engineer, Anthropic (London)"}], "track": "models-prompting", "tags": ["prompt-engineering", "evals", "model-selection", "extended-thinking", "agent-reliability"], "tldr_th": "Margo van Laar พาดูสองสถานการณ์จริง คือซ่อม prompt เก่าที่พังหลังย้ายโมเดล (บอท support ของ Meridian Mobile) และสร้าง agent ใหม่ (จัดตารางพนักงาน) ข้อสรุปหลักคือเริ่มจาก eval แล้วแก้ failure mode ทีละข้อ เก็บกวาด prompt ให้มีโครงสร้าง ถอด patch เก่าที่ overfit ใส่ tool แทนการสั่งให้ทำดี และแยกงานเป็น prompt หลายตัวเมื่อทำ agent", "tldr_en": "Two walk-throughs, repairing a production prompt after a model migration (telco support bot) and building a scheduling agent from scratch. Start from evals, fix failure modes one at a time, clean up structure, remove stale patches, add tools, and split agent work into separate prompts.", "audience_th": "เหมาะกับวิศวกรที่ดูแล prompt ใน production หรือกำลังย้ายโมเดล และเคยเขียน eval เบื้องต้นมาแล้ว", "points": [{"th": "เริ่มจาก eval suite ก่อนแตะ prompt เพราะต้องมีหลักฐานว่าการแก้ช่วยจริง ตัวอย่างมี 5 เทสต์ที่ครอบ 3 แบบ คือ control (ต้องผ่านเสมอ), edge case ที่เคยพลาด, และเคสที่โมเดลต้องส่งต่อมนุษย์หรือปฏิเสธ", "en": "Start with an eval suite covering control cases, past-failure edge cases, and handoff/refusal cases."}, {"th": "เก็บกวาดทั่วไปก่อน: เอาข้อมูลซ้ำที่ copy มาจากเว็บออก, เลิกบอกบอทว่าเป็นมนุษย์, แยก role/guidelines/policy/tone ด้วย XML tags ผลดีขึ้นทันที ตามหลัก ถ้าคนอ่านแยก guideline policy data ไม่ออก โมเดลก็น่าจะแยกไม่ออก", "en": "General cleanup (remove pasted junk, fix role, add XML structure) improved results immediately."}, {"th": "ทำ output contract: กำหนดรูปแบบ output ด้วย XML tag และเพิ่ม stop sequence ที่ฝั่ง API ส่วน output ซับซ้อนให้ใช้ structured outputs", "en": "Output contract: XML tags plus a stop sequence in the API call; use structured outputs for complex schemas."}, {"th": "เคส hotspot: โมเดลเลี่ยงตอบเพราะ prompt มีคำสั่งเก่า 'never give the wrong plan details' ที่เป็น patch จากโมเดลรุ่นก่อน ผู้พูดบอกว่าโมเดลใหม่ทำตามคำสั่งเก่งขึ้นจึง overfit ให้ปรับเป็นมุมที่สมดุล และเก็บเหตุผลของ patch ไว้ใน version control", "en": "Hotspot case: an old defensive patch made the model withhold data it had; replace with balanced guidance and track patch rationale in version control."}, {"th": "เคส proration: การสั่งว่า 'ต้องคำนวณให้ถูก' ไม่ได้เพิ่มความสามารถ แก้ด้วยการเพิ่ม tool คำนวณ (กำหนด schema, ใส่ใน API, เขียนฟังก์ชันจริง) โมเดลไม่ต้องคิดเลขในหัว", "en": "Proration case: instructions don't add capability; give the model a calculation tool."}, {"th": "เคส escalation: prompt บอกแต่ต้นทุนของการ escalate (ประมาณ $8) ทำให้โมเดล overfit ไปไม่ escalate ให้บอกทั้งสองด้านของ trade-off รวมต้นทุนเมื่อพลาด (refund และความเชื่อใจลูกค้า)", "en": "Escalation case: state both sides of the trade-off, including the cost of getting it wrong."}, {"th": "สร้าง agent จัดตารางจากศูนย์: ตรวจด้วยฟังก์ชัน Python แทน LLM judge เพราะกฎตายตัว เทียบ Sonnet 4.6 (ล้มทุกเคส) กับ Opus 4.7 (ผิดน้อยลงแต่ยังไม่ผ่าน) กับ Opus 4.7 + adaptive thinking (ผ่านแต่ token และ latency เพิ่มราว 3 เท่า)", "en": "Scheduling agent graded by a Python checker: Sonnet 4.6 fails, Opus 4.7 improves, Opus 4.7 with adaptive thinking passes at about triple tokens and latency."}, {"th": "ทางที่ดีกว่า: loop แบบ generate, evaluate, repair ที่แยกเป็น 3 prompt ผ่านทุกเคสด้วย token และ latency ต่ำกว่า Sonnet ที่ปรับ prompt และยังใส่ soft constraint ตอน runtime ได้ (เช่น คนสองคนไม่ควรเข้ากะเดียวกัน)", "en": "A generate-evaluate-repair loop with three prompts passes all cases cheaper and faster, and supports runtime soft constraints."}], "numbers": [{"th": "Eval ตัวอย่างมี 5 test cases (ของจริงจะมากกว่านี้) สำหรับบอท support ของบริษัทสมมติ Meridian Mobile"}, {"th": "ต้นทุน escalate ไปหา care specialist ใน prompt เดิม: ประมาณ $8 ต่อเคส"}, {"th": "เคส hotspot: ข้อมูลลูกค้า legacy plan มี 5 GB แต่ policy ปัจจุบันของแพ็กเกจ unlimited คือ 4 GB"}, {"th": "งานจัดตาราง: พนักงาน 8 คน, รัน 5 trials ต่อการตั้งค่า, ตรวจด้วยฟังก์ชัน Python นับ violation"}, {"th": "Opus 4.7 + adaptive thinking: ผู้พูดบอกว่า token เพิ่มราว 3 เท่าและ latency ราว 3 เท่า (ตัวอย่างหนึ่ง 100 วินาที)"}, {"th": "โมเดลที่เทียบ: Sonnet 4.6 และ Opus 4.7"}], "quotes": [{"text": "instructions don't add capability.", "th": "คำสั่งไม่ได้เพิ่มความสามารถ"}, {"text": "if you're reading a prompt and you can't tell guidelines from policy from data, most likely the model isn't able to either.", "th": "ถ้าอ่าน prompt แล้วแยก guideline, policy, data ไม่ออก โมเดลก็น่าจะแยกไม่ออกเหมือนกัน"}, {"text": "we need to remember to state both sides of the trade-offs", "th": "ต้องบอกทั้งสองด้านของ trade-off"}], "steps": ["ตั้ง eval suite 5 เคส (control, edge case, escalation/refusal) แล้วรัน baseline V0", "เก็บกวาด prompt: ลบเนื้อหาที่ copy จากเว็บ, แก้ role, แยกส่วนด้วย XML tags แล้วรัน eval ซ้ำ", "เพิ่ม output contract (รูปแบบ XML) และ stop sequence ที่ API call", "แก้เคส hotspot: เอาคำสั่ง 'never give the wrong plan details' ออก ให้ใช้ข้อมูลลูกค้าเป็น source of truth", "แก้เคส proration: เพิ่ม tool calculate proration (กำหนด schema, ลงทะเบียนใน API, implement ฟังก์ชัน) และสั่งใน prompt ให้ใช้ tool", "แก้เคส escalation: บอกทั้งต้นทุนของการ escalate และต้นทุนเมื่อตอบพลาด", "agent ใหม่ (จัดตาราง): เขียน baseline ด้วย Sonnet 4.6, ตรวจด้วยฟังก์ชัน Python, ลองเปลี่ยนเป็น Opus 4.7, ต่อด้วย adaptive thinking", "ลอง prompt ที่ดีขึ้นบน Sonnet 4.6 (บอกให้ตรวจงานก่อนตอบ) พบว่าชนเพดาน output token", "สร้าง loop generate, evaluate, repair แยก 3 prompt แล้วเทียบ token กับ latency"], "takeaways_th": ["สร้าง eval ให้ครบ 3 แบบ (control, edge case, handoff) ก่อนแตะ prompt หรือย้ายโมเดล", "ตรวจ prompt เก่าหา patch ที่เขียนไว้กันโมเดลรุ่นก่อน อาจ overfit กับโมเดลใหม่ และจดเหตุผลใน version control", "ถ้าอยากให้งานแม่น (คำนวณ ฯลฯ) ให้ใส่ tool ไม่ใช่เพิ่มคำสั่งว่า 'critical'", "เขียน trade-off ให้ครบสองด้าน แทนการใส่แต่ข้อห้ามหรือต้นทุนด้านเดียว", "ถ้างานมีกฎตายตัว ลองแยก generate, evaluate, repair เป็น prompt สั้นๆ สามตัว แล้วเทียบกับการใช้โมเดลใหญ่ + thinking"], "caveats_th": ["ผู้พูดบอกว่าผลรันเป็น live demo มีความแปรปรวนระหว่างรอบ (เช่น เคส hotspot ถอยหลังชั่วคราวหลังเก็บกวาด) ผลที่เห็นไม่ใช่ benchmark", "ตัวอย่างใช้ prompt ย่อส่วน 5 เทสต์ ผู้พูดบอกเองว่าของจริงจะยาวและซับซ้อนกว่า", "ตัวเลข 3 เท่าของ token/latency เป็นค่าประมาณจากคำพูดของผู้พูด ไม่ได้เห็นตาราง", "Transcript เป็น YouTube auto-caption จึงไม่ได้เห็นหน้าจอ ชื่อ tool/ฟังก์ชันที่ไม่ได้ออกเสียงไม่มีในสรุป", "คำอธิบายคลิปบอกว่า 'ใช้หลัก prompting กับระบบ agentic' แต่เนื้อหาจริงเน้นการซ่อม prompt และเปรียบเทียบ 4 วิธีของ agent จัดตาราง"], "related_existing": ["prompt-engineering", "prompt-playbook-recipes", "prompt-chaining-meta-prompting", "token-economics", "cheap-model-delegation"], "dur": "33:49", "url": "https://www.youtube.com/watch?v=G2B0YWuJUgI", "asr": "yt-captions", "wiki": "cwc-london-05"}, {"n": 6, "id": "DNRddIEoH3c", "title_en": "The capability curve", "title_th": "เส้นโค้งความสามารถของโมเดล และวิธีขี่ไปกับมัน", "speakers": [{"name": "Jeremy", "role": "Product Manager ที่ Anthropic ทำงานกับทีม research ดูแลเรื่อง coding behaviors และ capabilities (ผู้พูดแนะนำตัวเองด้วยชื่อแรกเท่านั้น)"}], "track": "keynote", "tags": ["model-selection", "evals", "agent-reliability", "extended-thinking", "self-improving"], "tldr_th": "ผู้พูดไล่ให้เห็นว่าโมเดลเก่งขึ้นเร็วแค่ไหนในรอบ 12 เดือน ผ่านสามเรื่องหลัก คือ วางแผนก่อนลงมือ กู้คืนจาก error และรักษาสมาธิในงานยาว แล้วสรุปเป็นแนวปฏิบัติสำหรับ developer ว่า ต้องมี evals ที่เชื่อถือได้ ลด scaffolding ลง เปิดพื้นที่ให้โมเดลทำงาน และปิด loop ให้ agent ช่วยปรับปรุง agent ด้วยกันเอง", "tldr_en": "Anthropic's Jeremy traces how models improved in a year (planning, error recovery, long-run coherence) and gives developers four habits to ride the curve: trusted evals, shrinking scaffolding, giving the model room to work, and closing the agent loop.", "audience_th": "developer ที่สร้างแอปหรือ agent บน Claude และอยากรู้ว่าต้องปรับวิธีทำงานอย่างไรเมื่อโมเดลใหม่ออกมาทุกไม่กี่เดือน", "points": [{"th": "ผู้พูดเล่าว่าเมื่อปีก่อน Opus 4 ยังเป็น state of the art และ Claude Code เพิ่งเปิดตัว ตอนนี้ coding agent เปลี่ยนวิธีทำซอฟต์แวร์ไปเกือบหมด ถามผู้ฟังแล้วราวครึ่งห้องเคย ship PR ที่ Claude เขียนทั้งหมดในสัปดาห์ที่ผ่านมา", "en": "A year ago Opus 4 was state of the art and Claude Code had barely launched; now about half the room shipped a fully Claude-written PR last week."}, {"th": "SWE-bench Verified เคยอยู่ราว 60% ตอน Sonnet 3.7 และ Opus 4.7 ผ่าน 87% ผู้พูดบอกว่าโมเดลระดับ frontier ภายใน (Mythos Preview) อิ่มตัว benchmark นี้จนไม่ใช้วัดแล้ว คอขวดจึงย้ายจากการแก้ PR ไปที่เรื่องอื่น", "en": "SWE-bench Verified went from ~60% to 87%+ and is saturated for their top internal models, so the bottleneck has moved."}, {"th": "เดโมให้ Claude สร้างเว็บ Claude.ai ใหม่ในครั้งเดียว Sonnet 4 เขียน 2,000 บรรทัดแต่ chat ไม่ตอบ ส่วน Opus 4.7 เขียนราว 1,700 บรรทัด ได้แอปที่ chat ใช้งานได้ มี sidebar ประวัติ แผนภาพ mermaid และ dark mode", "en": "Same prompt, 12 months apart: Sonnet 4 gave a non-working chat in ~2,000 lines; Opus 4.7 gave a working app in ~1,700 lines."}, {"th": "ความก้าวหน้าสามด้าน ได้แก่ วางแผนและให้เหตุผลก่อนลงมือ (ไม่ต้อง scaffold บังคับ แค่ตั้ง reasoning effort สูง) กู้คืนจากความล้มเหลวจน doom looping แทบหายไป และรักษา coherence ได้ถึง 1 ล้าน token หรือมากกว่า ทำให้ไม่ต้องหั่นงานเป็นชิ้นเล็กหรือคอยเฝ้า", "en": "Three gains: planning before acting, error recovery (doom-looping largely solved), and coherence up to 1M+ tokens, so tasks need less slicing and babysitting."}, {"th": "รวมสามด้านแล้วได้ long-horizon agent ที่รันได้หลายชั่วโมง ตัวอย่างที่ผู้พูดเล่าคือผู้ก่อตั้ง Bun ให้ Claude เขียน JavaScript engine ของ Bun ใหม่เป็น Rust ภายในหนึ่งสัปดาห์ จนเกือบผ่าน test suite ครบ เพราะ Bun มี test suite coverage เกือบ 100% คอยตรวจ", "en": "Combined, these yield agents running for hours; the Bun founder had Claude rewrite Bun's engine in Rust in a week, verified by a near-100% coverage test suite."}, {"th": "Evals คือ unit test และ regression test ของยุค AI ควรสร้างให้ตรงกับ traffic จริงแทนใช้ academic benchmark และต้องรู้ว่าเมื่อไหร่ eval อิ่มตัว (เช่นโมเดลได้ 90% แล้วที่เหลือทำไม่ได้) มิฉะนั้นจะมองไม่เห็นว่าโมเดลใหม่ดีขึ้น ทีมที่มี evals ปรับตัวกับโมเดลใหม่ได้เร็วกว่า", "en": "Evals are the unit/regression tests of the AI era: match real traffic, avoid saturated evals, and use them to adopt new models fast."}, {"th": "ให้ลด scaffolding (prompt, tools, harness) ลงเมื่อได้โมเดลใหม่ เพราะ prompt ยาวสะสมคำสั่งที่ออกแบบกับข้อบกพร่องของโมเดลเก่า ผู้พูดยกตัวอย่างตัวอย่าง citation format เก่าใน prompt ของ Claude.ai ที่โมเดลใหม่ทำตามจนผิดรูปแบบ พอแก้ไม่กี่ตัวอักษรก็หายทั้งกลุ่ม", "en": "Shrink scaffolding with each new model; an outdated citation example in Claude.ai's prompt caused a class of errors until tweaked."}, {"th": "ให้พื้นที่โมเดลทำงาน คือเปิด adaptive thinking และตั้ง effort สูง ปล่อยให้ทำงานแบบอัตโนมัติอย่างควบคุมได้ด้วย Auto Mode ที่มี classifier ตรวจทุก tool call และปิด loop ให้ Claude Code รัน eval ของ agent แล้วช่วยปรับ prompt กับ tools เอง", "en": "Give room to work: adaptive thinking with high effort, Auto Mode with a tool-call classifier, and let Claude Code run your evals to improve your agent."}], "numbers": [{"th": "SWE-bench Verified: Sonnet 3.7 ราว 60% เมื่อปีก่อน เทียบกับ Opus 4.7 ผ่าน 87% ผู้พูดสรุปว่าแก้ issue ได้มากขึ้นราว 3 เท่า"}, {"th": "เดโมสร้าง Claude.ai: Sonnet 4 ราว 2,000 บรรทัด เทียบกับ Opus 4.7 ราว 1,700 บรรทัด"}, {"th": "โมเดลรักษา coherence ได้ถึง 1 ล้าน token และมากกว่านั้นตามที่ผู้พูดบอก (แต่ยังไม่สมบูรณ์เมื่อถึงหลายล้าน token)"}, {"th": "เคส Bun เขียนใหม่เป็น Rust ใช้เวลาประมาณ 1 สัปดาห์ ผ่าน test suite เกือบ 100% ซึ่งผู้พูดบอกว่าถ้าทำเองจะใช้หลายเดือน"}, {"th": "ตัวอย่าง eval อิ่มตัว: Opus 4.7 ทำได้ 90% แล้วอีก 10% ที่เหลือไม่มีโมเดลไหนทำได้ (ผู้พูดยกเป็นตัวอย่างสมมติ)"}, {"th": "ตัวอย่าง prompt แบบ Frankenstein ราว 3,000 บรรทัดที่สะสมจากการแก้ failure ของโมเดลเก่า"}], "quotes": [{"text": "evaluations are just the unit tests and the regression tests of the AI era.", "th": "evals ก็คือ unit test กับ regression test ของยุค AI"}, {"text": "you want to cut down your prompt, figure out what's not necessary anymore, and describe what you actually intend for your application", "th": "ตัด prompt ให้สั้นลง หาว่าอะไรไม่จำเป็นแล้ว แล้วบอกเจตนาจริงของแอปแทน"}, {"text": "you don't want it to delete your cluster or deploy jobs to prod without you asking.", "th": "ไม่อยากให้มันลบ cluster หรือ deploy ขึ้น prod เองโดยไม่ถามก่อน"}], "steps": [], "takeaways_th": ["สร้าง eval ชุดแรกจาก failure mode และ traffic จริงของแอปตัวเอง ไม่ต้องรอให้สมบูรณ์ แล้วใช้รันเทียบโมเดลใหม่ทันทีที่ออก", "เช็กว่า eval ที่ใช้อยู่อิ่มตัวหรือยัง ถ้าโมเดลใหม่ได้คะแนนเพิ่มแค่ 1% ให้ลองเพิ่มความยากก่อนสรุปว่าโมเดลไม่ดีขึ้น", "ทบทวน system prompt ทุกครั้งที่เปลี่ยนโมเดล ลองตัดให้เหลือน้อยที่สุดแล้วใช้ evals ยืนยันว่าคุณภาพไม่ตก", "ตั้ง effort สูงและเปิด adaptive thinking ในงานที่ต้องการความฉลาด แล้วลดการบังคับให้วางแผนเอง", "ให้ Claude Code รัน eval ของ agent ตัวเองเพื่อเสนอการปรับ prompt และ tools แทนการแก้ทีละจุดด้วยมือ"], "caveats_th": ["transcript ถอดด้วย Whisper large-v3 ในเครื่อง ไม่ใช่ข้อความต้นฉบับของผู้พูด ชื่อเฉพาะอาจเพี้ยน (ในไฟล์เขียน Claude เป็น Quad/Cloud, SWE-bench เป็น SweeBench, Sonnet เป็น Sonic ในบางจุด)", "ผู้พูดพูดว่าเริ่มงานที่ Anthropic 'March of 2021' ซึ่งน่าจะเป็นการฟังผิดหรือพูดผิด (ปีก่อนหน้าคือ 2025) ไม่นำไปใช้ยืนยันวันที่", "ชื่อ Windsor น่าจะเป็นการถอดผิดของลูกค้ารายหนึ่ง และผู้ก่อตั้ง Bun ถูกเรียกว่า 'Jared' ใน transcript ไม่ยืนยันการสะกดชื่อ", "ตัวเลขและเคส (SWE-bench, Bun rewrite, ตัวเลขลูกค้า Vercel/Shopify) เป็นข้ออ้างของผู้พูด ไม่ได้ตรวจสอบกับแหล่งอื่น", "ช่วงเรื่อง evals และ Auto Mode มีประโยคซ้ำจาก ASR ในต้นฉบับ (ประโยคถูกพูดวนซ้ำ) เนื้อหาที่สรุปยึดส่วนที่อ่านได้ชัด"], "related_existing": ["long-horizon-agents", "harness-engineering", "claude-code-model-config", "prompt-engineering", "claude-code-permissions"], "dur": "26:25", "url": "https://www.youtube.com/watch?v=DNRddIEoH3c", "asr": "whisper", "wiki": "cwc-london-06"}, {"n": 7, "id": "Uvl-tRga98g", "title_en": "Designing with Claude: From prompt to production", "title_th": "เบื้องหลังสร้าง Claude Design ใน 10 สัปดาห์ด้วยทีมสามคน", "speakers": [{"name": "Dan Carey", "role": "Product Manager ผู้นำผลิตภัณฑ์หนึ่งตัวใน Anthropic Labs"}], "track": "domain-case", "tags": ["design-ai", "devex", "product-keynote", "claude-code"], "tldr_th": "Dan Carey เล่าว่าทีมเล็กใน Anthropic Labs สร้าง Claude Design จากไอเดียถึงเปิดตัวใน 10 สัปดาห์ ด้วยการใช้ prototype แทน PRD ทีมสามคนที่ทุกคนทำได้ทุกบทบาท และวน loop ship-watch-learn ซ้ำ 50 ถึง 100 รอบ ข้อสรุปคือคอขวดย้ายจากการสร้างฟีเจอร์ไปสู่การรู้ว่าควรสร้างอะไร จึงต้องทำ loop ให้สั้นและสร้างเครื่องมือของตัวเอง", "tldr_en": "A small Anthropic Labs team built Claude Design in about 10 weeks by replacing PRDs with prototypes, keeping a 3-person team with merged roles, and running a ship-watch-learn loop 50-100 times.", "audience_th": "PM, designer และ engineer ที่อยากรู้ว่าทีมเล็กทำงานเร็วอย่างไรเมื่อมี Claude ไม่ต้องมีพื้นฐาน Claude Design มาก่อน", "points": [{"th": "Anthropic Labs เรียกตัวเองว่า bet factory ทีมเล็กทดลองที่ขอบเขตของโมเดล ขยายตัวที่ได้ผล ยุติตัวที่ไม่ได้ผล ผู้พูดบอกว่า Claude Code, Claude Design, MCP, Skills, Claude in Chrome เกิดจาก Labs", "en": "Labs is a 'bet factory' of small teams; Claude Code, Design, MCP and Skills came from it."}, {"th": "ไม่พยายามทำนายอนาคต ใช้ loop ship, watch, learn ซ้ำ คุยกับ user และนักวิจัยทุกวัน ship ทุกวันหรือสองวัน และตอบ feedback ภายในวันถัดไป สำหรับ Claude Design วน loop นี้ราว 50 ถึง 100 รอบใน 10 สัปดาห์", "en": "No predicting the future: ship, watch, learn, repeated 50-100 times over 10 weeks with daily user contact."}, {"th": "จุดเริ่มคือหลัง Claude Code ทำให้ engineer เร็วขึ้นมาก คอขวดย้ายไปที่การรู้ว่าควรสร้างอะไร designer กับ PM ตามไม่ทัน Nate จึงแฮ็ก prototype จาก Agent SDK เป็น IDE wrapper บางๆ ในสุดสัปดาห์เดียว แล้วโพสต์ใน Slack", "en": "With coding sped up, designers/PMs became the bottleneck; Nate hacked a thin Agent SDK prototype over one weekend."}, {"th": "ทีมไม่เขียน PRD, vision doc, OKR หรือ press release ล่วงหน้า เพราะเอกสารกำกวมให้คนสองคนเห็นผลิตภัณฑ์ต่างกัน จึงคุยแล้วอัด transcript ส่งให้ Claude Design ขอหลายตัวเลือก prototype ซึ่งแทน PRD ของผู้พูดเอง", "en": "No PRDs or vision docs; talk through the problem, transcribe it, and ask Claude Design for prototype options."}, {"th": "ทีมเล็ก: เริ่มด้วยคนเดียวหาประกายความน่าสนใจ เมื่อมีแววขยายเป็นสามคน และอาจถึงห้าคนก่อนเปิดตัว ทุกคนทำทุกบทบาท (engineer คุย user, PM เขียนโค้ด, designer วิเคราะห์ข้อมูล) ช่วยลด coordination overhead", "en": "Start with one person, scale to three (maybe five); roles blur and coordination overhead drops."}, {"th": "ทีมเร่ง loop ทุกขั้นด้วย Claude: ให้ Claude วิเคราะห์บทสนทนากับ user หาจุดร่วม ใช้ Claude Design ออกแบบ Claude Design เอง (multiplayer และ handoff ไป Claude Code เกิดจากความต้องการของทีมก่อน) และสร้างเครื่องมือ feedback clustering ในหนึ่งบ่าย", "en": "Claude accelerated each loop step: user-conversation analysis, dogfooding Design, handoff to Claude Code, and a feedback-clustering tool built in an afternoon."}, {"th": "บทเรียนจากความผิดพลาด: ชุดควบคุมระดับ pixel สำหรับ power user ได้รับคำชมจากผู้ทดสอบกลุ่มเล็ก แต่ผู้ใช้ส่วนใหญ่เกลียด ทีมถอดออกภายในประมาณหนึ่งสัปดาห์ ได้ข้อสรุปว่าเครื่องมือควรยกระดับ craft ของทุกคน และเปิดให้ export เป็น HTML, CSS, JavaScript", "en": "Pixel-level power-user controls were loved by a few and hated by most; removed within a week, shaping the open-export philosophy."}, {"th": "หลังเปิดตัววันศุกร์ ทีม ship การปรับปรุง 62 รายการภายในวันจันทร์ถัดไป และบอกให้ทำ prototype ของสิ่งที่ 'เกือบใช้ได้' เพราะโมเดลรุ่นถัดไปอาจแก้ปัญหาที่วิศวกรรมแก้ไม่ได้ (ปัญหาของ prototype ต้นๆ หายเมื่อ Opus 4.7 ออก)", "en": "62 improvements shipped by the Monday after launch; prototype what almost works because the next model may fix it."}], "numbers": [{"th": "ทีมสามคนเป็นส่วนใหญ่ของการพัฒนา สร้าง Claude Design ในราว 10 สัปดาห์จากไอเดียถึงเปิดตัว"}, {"th": "วน loop ship-watch-learn ราว 50 ถึง 100 รอบ"}, {"th": "Claude Design อยู่ใน research preview มาประมาณหนึ่งเดือน ณ วันที่พูด และเพิ่งเพิ่ม token limits เป็นสองเท่าในทุก subscription plan"}, {"th": "ใน pitch-off ครึ่งหลัง 100% ของ pitch เป็น prototype หรือสไลด์ที่ทำด้วย Claude Design"}, {"th": "หลังเปิดตัววันศุกร์ ship 62 improvements ภายในวันจันทร์ถัดไป"}, {"th": "ถอดฟีเจอร์ควบคุมระดับ pixel ที่ผิดทางออกภายในราวหนึ่งสัปดาห์ เทียบกับการวางแผนรายไตรมาสที่จะเสียทั้งไตรมาส"}, {"th": "ผู้พูดบอกว่าเป็น PM มาเกือบสองทศวรรษ และ prototype เข้ามาแทนการเขียน PRD"}], "quotes": [{"text": "Instead, we try to ship. We watch people use the stuff. We learn what they do.", "th": "แทนที่จะทำนาย เรา ship ดูคนใช้ แล้วเรียนรู้ว่าเขาทำอะไร"}, {"text": "So docs are imprecise. Prototypes, they're more concrete.", "th": "เอกสารกำกวม ส่วน prototype เป็นรูปธรรมกว่า"}, {"text": "you do not want to work on the thing that already works. You often want to prototype the thing that almost works.", "th": "อย่าทำสิ่งที่ใช้ได้อยู่แล้ว ให้ทำ prototype ของสิ่งที่เกือบใช้ได้"}], "steps": [], "takeaways_th": ["ครั้งหน้าที่จะเขียน PRD ให้ข้าม แล้วคุยกับเพื่อนร่วมทีมเรื่องทำไมต้องแก้ปัญหานี้และลักษณะของคำตอบที่ดี อัด transcript ส่งให้ Claude ขอ prototype สามแบบ", "เลือกเครื่องมือภายในที่รอมานาน เช่น feedback clustering แล้วสร้างให้เสร็จในบ่ายเดียว", "ลองรับ feature request จริงหนึ่งอันจาก user แล้วส่งถึงมือเขาภายใน 24 ชั่วโมง เพื่อค้นหาคอขวดใน deploy และ code review", "ออกแบบรอบทดลองให้สั้นพอที่จะรู้ว่าผิดทางภายในไม่กี่วัน แทนผูกกับรอบรายไตรมาส", "ใช้ Claude วิเคราะห์บทสนทนากับ user เบื้องต้น แต่ให้คนเป็นฝ่ายคุยเอง"], "caveats_th": ["transcript ถอดด้วย Whisper large-v3 ในเครื่อง ไม่ใช่ข้อความต้นฉบับของผู้พูด ชื่อเฉพาะอาจเพี้ยน (ในไฟล์ Claude ถูกเขียนเป็น Cloud ในบางจุด และท้ายคลิปมี 'Collage Design' ซึ่งน่าจะเป็น Claude Design)", "ชื่อ Nate (designer จาก Claude Code เดิม) มาจาก transcript เท่านั้น ไม่มีนามสกุล", "ข้อความกล่าวถึงการเชื่อม design tool ต่างๆ เข้ากับ Claude Code 'สัปดาห์นี้หรือสัปดาห์หน้า' เป็นแผนที่ผู้พูดบอก ไม่ยืนยันว่าเกิดขึ้นแล้ว", "ตัวเลขทั้งหมด (10 สัปดาห์, 62 improvements, 50 ถึง 100 รอบ) เป็นข้ออ้างของผู้พูด ไม่ได้ตรวจสอบกับแหล่งอื่น", "ประโยคเรื่อง Nate โพสต์ใน Slack ถูกตัดทอนและมีข้อความแหว่งในต้นฉบับ รายละเอียดบางส่วนจึงอาจขาด"], "related_existing": ["claude-code-fundamentals", "claude-agent-sdk", "design-md", "ai-director-method"], "dur": "28:00", "url": "https://www.youtube.com/watch?v=Uvl-tRga98g", "asr": "whisper", "wiki": "cwc-london-07"}, {"n": 8, "id": "l8fxVYIP4HQ", "title_en": "Building with Claude on Google Cloud", "title_th": "สร้างและ deploy แอปบน Google Cloud ด้วย Claude Code ตั้งแต่ศูนย์", "speakers": [{"name": "Ivan Nardini", "role": "Developer Advocate ที่ Google Cloud (แนะนำตัวเองใน transcript)"}], "track": "workshop", "tags": ["claude-code", "cloud-platforms", "subagents", "mcp-tools-skills", "devex"], "tldr_th": "Ivan Nardini สาธิตสดการสร้างแอปเก็บ feedback ตั้งแต่ wireframe จนถึง production บน Google Cloud โดยสวมห้าบทบาทของทีม (PM, UI/UX, software engineer, security, analytics) ใช้ Claude Code ร่วมกับ plan mode, subagents, MCP server ของ Google Cloud, skills และ plugin ข้อสรุปคือคนไม่ต้องรู้ Google Cloud ลึกก็ ship ได้ถ้าให้ Claude อ่านเอกสารผ่าน MCP", "tldr_en": "A live demo takes a feedback app from wireframe to production on Google Cloud across five team roles, using Claude Code plan mode, subagents, Google Cloud MCP servers, skills and a plugin.", "audience_th": "developer ที่เคยใช้ Claude Code อยู่แล้วและอยากรู้ว่าจะต่อกับ Google Cloud เพื่อ build, deploy, ตรวจความปลอดภัย และทำ analytics อย่างไร", "points": [{"th": "ตั้งสถานการณ์ว่าทีม enterprise ปกติมี PM, UI/UX, software engineer, security engineer และคนดู analytics ผู้พูดสวมแต่ละบทบาททีละหมวก แล้วให้ Claude Code เสริมตลอด software life cycle", "en": "The speaker plays five team roles in turn, with Claude Code augmenting the whole lifecycle."}, {"th": "การใช้ Claude models บน Google Cloud: ตั้งค่า Claude Code ผ่าน application default credentials มี wizard ตรวจ project/region และ pin โมเดล จ่ายตาม token ไม่มี message cap มี provisioned throughput ข้อมูลอยู่ใน project ของตัวเอง ไม่ต้องจัดการ API key และรองรับ multi-region endpoint", "en": "Claude models on Google Cloud: ADC-based setup, pay per token, provisioned throughput, data stays in your project, no API keys."}, {"th": "บทบาท PM: เขียน CLAUDE.md กำหนดบทบาท แล้วให้ Claude เปลี่ยนภาพร่างเป็น wireframe ภายในไม่กี่นาที", "en": "PM: a CLAUDE.md role plus a sketch becomes a wireframe in minutes."}, {"th": "บทบาท UI/UX: ใช้ plan mode ให้ Claude คิดและเสนอสเปกก่อนเขียนโค้ด แล้วแปลง wireframe เป็นสี่หน้าสำหรับ production (รวม dashboard) ผู้พูดบอกว่าในงานจริงอาจเชื่อมกับ Figma", "en": "UI/UX: plan mode proposes a spec before coding and turns the wireframe into four production pages."}, {"th": "บทบาท software engineer: ใช้ Developer Knowledge API กับ MCP server ที่ให้เอกสารและ implementation guide ที่รีเฟรชทุก 24 ชั่วโมง ออกแบบสถาปัตยกรรมเป็น Cloud Run, Firestore และข้อมูลดิบเข้า BigQuery พร้อม Looker แล้วใช้ official Google Cloud skills ลงมือ deploy", "en": "Engineer: Developer Knowledge API MCP server plus official Google Cloud skills drive architecture (Cloud Run, Firestore, BigQuery, Looker) and deployment."}, {"th": "ใช้ subagents ขนานกันหนึ่งตัวต่อ API, data pipeline ใน BigQuery และ dashboard เหมือน sprint ของทีม ใช้โมเดลต่างกันได้ จากนั้นรันเทสต์ สร้าง CI/CD ด้วย Cloud Build กับ Cloud Deploy เปิด PR แล้ว merge ทริกเกอร์ pipeline ไป dev environment", "en": "Parallel subagents build API, pipeline and dashboard; tests run; Cloud Build + Cloud Deploy provide CI/CD to a dev environment."}, {"th": "บทบาท security: สร้าง custom plugin ตรวจ input validation และลดสิทธิ์ service account ซึ่ง Claude แก้โค้ด รันเทสต์ซ้ำ เปิด PR ใหม่ และหลังรีวิวใน dev ก็ promote ไป production ผ่าน Cloud Deploy", "en": "Security: a custom plugin fixes input validation and service-account permissions, then promotes to production via Cloud Deploy."}, {"th": "บทบาท analytics: ใช้ BigQuery MCP server วิเคราะห์ข้อมูล feedback เช่นเวลาที่ผู้ใช้ใช้กรอก แล้วใช้ MCP server อีกตัวสร้าง dashboard ใน Looker ได้เป็นลิงก์เดียวโดยไม่ต้องรู้เครื่องมือเหล่านี้ล่วงหน้า", "en": "Analytics: BigQuery MCP for analysis and a second MCP server to build a Looker dashboard from one link."}], "numbers": [{"th": "เอกสารจาก Developer Knowledge API รีเฟรชทุก 24 ชั่วโมงตามที่ผู้พูดบอก"}, {"th": "ห้าบทบาทในเดโม: PM, UI/UX, software engineer, security engineer, analytics"}, {"th": "ผู้พูดบอกว่าบน Google Cloud จ่ายตาม token ไม่มี message cap และมี provisioned throughput สำหรับ production"}, {"th": "คำอธิบายคลิประบุเป้า 'zero to deployed ใน 30 นาที' ส่วนเนื้อหาจริงยาวประมาณ 25 นาที"}], "quotes": [{"text": "You get access to models directly from your dedicated project where you can set your own policy.", "th": "เข้าถึงโมเดลได้ตรงจาก project เฉพาะของตัวเอง และตั้ง policy เองได้"}, {"text": "this mode puts Cloud in a mode where it thinks and it proposes before it starts coding.", "th": "plan mode ทำให้ Claude คิดและเสนอแผนก่อนเริ่มเขียนโค้ด (Cloud ใน transcript = Claude)"}, {"text": "I can parallelize tasks simulating like a team sprint", "th": "แตกงานขนานกันเหมือนทีมทำ sprint ด้วย subagents"}], "steps": ["ตั้งค่า Claude Code ให้ใช้โมเดลที่โฮสต์บน Google Cloud ผ่าน application default credentials แล้วใช้ wizard ตรวจ project/region และ pin โมเดล", "PM: เขียน CLAUDE.md ระบุบทบาท แล้วให้ Claude เปลี่ยนภาพร่างเป็น wireframe", "UI/UX: เข้า plan mode ให้ Claude ร่างสเปก ตรวจ แล้วสั่งสร้างสี่หน้า (landing ถึงหน้าสุดท้าย บวก dashboard) และ push PR", "Engineer: ต่อ MCP server ของ Developer Knowledge API กับ Google Cloud skills แล้วให้ Claude ออกแบบสถาปัตยกรรมและสเปก API", "สั่ง subagents ขนาน: API, data pipeline ใน BigQuery, dashboard พร้อมเทสต์ แล้วใช้ skill สร้าง CI/CD ด้วย Cloud Build และ Cloud Deploy", "Merge PR เพื่อทริกเกอร์ pipeline ไป dev environment", "Security: ใช้ custom plugin ตรวจ input validation และลดสิทธิ์ service account แล้วเปิด PR ใหม่ รีวิวใน dev และ promote ไป production ผ่าน Cloud Deploy", "Analytics: ใช้ BigQuery MCP วิเคราะห์ข้อมูล feedback แล้วสร้าง dashboard ใน Looker ผ่าน MCP server อีกตัว"], "takeaways_th": ["ถ้าไม่ชำนาญ Google Cloud ให้ต่อ Developer Knowledge API MCP server และ Google Cloud skills แล้วให้ Claude อ่านเอกสารสดแทนการเดา", "ใช้ plan mode กับงานที่ต้องการให้ตัดสินใจก่อนลงมือ เช่นเปลี่ยน wireframe เป็นหน้า production", "แตก subagent ต่อส่วน (API, pipeline, dashboard) เพื่อทำงานขนาน แล้วให้เทสต์รันก่อนสร้าง CI/CD", "สร้าง plugin ตรวจ security ที่ตรงกับข้อกำหนดขององค์กร (เช่น input validation, สิทธิ์ service account) แล้วใช้ก่อน promote", "ถ้าต้องการ analytics ให้ใช้ BigQuery MCP กับ Looker MCP ทำ dashboard ที่ PM นำไปคุยต่อได้"], "caveats_th": ["transcript ถอดด้วย Whisper large-v3 ในเครื่อง ไม่ใช่ข้อความต้นฉบับของผู้พูด ชื่อเฉพาะอาจเพี้ยน (Cloud = Claude, 'Anthropix' = Anthropic) และมีประโยค 'I'm Ivan Nardini. I'm the founder of Anthropix' ซึ่งน่าจะเป็นการถอดวนผิด จึงใช้เฉพาะบรรทัดที่แนะนำตัวเป็น developer advocate ที่ Google Cloud", "ช่วงต้นเดโม PM (ราวนาทีที่ 3-6) transcript วนซ้ำประโยค 'I'm going to use a very simple code' หลายครั้ง เป็นอาการ Whisper hallucination จึงไม่มีรายละเอียดของขั้นตอนนั้น", "ชื่อผลิตภัณฑ์ Google Cloud (Firestore, Cloud Run, Cloud Build, Cloud Deploy, BigQuery, Looker) บางตัวผู้พูดเรียกกว้างๆ เช่น 'file stores' ที่ผู้สรุปตีความเป็น Firestore จากบริบท", "ผู้พูดพูดถึงการ merge PR และ plugin แบบรวบรัด ไม่ได้ระบุชื่อ skills หรือ plugin ที่ใช้ ลิงก์ repo/quickstart ที่ว่าจะแชร์ท้าย session ไม่มีใน transcript", "เดโมเป็นการรันที่เตรียมไว้ล่วงหน้า (ตัดให้เร็ว) ผู้พูดอ้างว่าได้ผลตามที่เห็น ไม่ได้มีการยืนยันอิสระ"], "related_existing": ["claude-code-subagents", "claude-code-mcp", "agent-skills", "claude-code-plugins", "claude-code-enterprise"], "dur": "24:38", "url": "https://www.youtube.com/watch?v=l8fxVYIP4HQ", "asr": "whisper", "wiki": "cwc-london-08"}, {"n": 9, "id": "EOg4gY0Yln0", "title_en": "Building signals that trade themselves", "title_th": "Man Group: governed skills ทำให้ AI สร้างสัญญาณเทรดที่ใช้เงินจริงได้", "speakers": [{"name": "Sharan Fernando", "role": "Head of data and AI, Man Group (ชื่อตาม caption; คำอธิบายคลิปเขียน 'Tushara Fernando')"}], "track": "domain-case", "tags": ["finance-ai", "mcp-tools-skills", "enterprise-adoption", "claude-code"], "tldr_th": "Man Group (ผู้จัดการกองทุนทางเลือก) เล่าว่ามีสัญญาณเทรดที่ AI คิดไอเดีย ดึงข้อมูล backtest และเขียนข้อเสนอ รันด้วยเงินจริงแล้ว โดยมีมนุษย์รีวิว ตัวเปิดทางคือ skills ที่ผ่าน governance ไม่ใช่การเทรนโมเดลใหม่ ข้อสรุปคือ skill ต้องมีเจ้าของที่เป็นเจ้าของ workflow จริง มี eval รีวิว และ lifecycle เหมือน production code", "tldr_en": "Man Group says trading signals researched, backtested and proposed by AI are running real capital, enabled by a governed skills marketplace rather than retraining. Skills need workflow owners, evals, review and lifecycle like production code.", "audience_th": "เหมาะกับคนที่ต้องพา AI เข้าองค์กรที่มี compliance เข้มและอยากรู้ว่า governance ของ skills ควรหน้าตาเป็นอย่างไร", "points": [{"th": "Man Group บริหารสินทรัพย์เกิน 200 พันล้านดอลลาร์ ลูกค้าเป็นกองทุนบำนาญและกองทุนความมั่งคั่ง ผู้พูดจึงบอกว่าความเสี่ยงสูงถ้า AI ผิดพลาด ธุรกิจหลักส่วนหนึ่งคือ systematic trading ที่ตัดสินใจจากสัญญาณข้ามหลักทรัพย์จำนวนมาก", "en": "Man Group manages over $200bn; stakes are high; systematic trading is driven by signals."}, {"th": "ผู้พูดเปรียบสัญญาณเทรดกับทีมแฟนตาซีฟุตบอล: จัดอันดับหุ้นด้วย factor (เช่น ผลตอบแทน 3 เดือน) แล้วทดสอบย้อนหลังด้วย backtest ดูตัวชี้วัดอย่างผลตอบแทนต่อปี drawdown และ Sharpe ratio", "en": "Signals explained via a fantasy football analogy; ranking stocks by a factor and backtesting with return, drawdown, Sharpe ratio."}, {"th": "ผู้พูดบอกว่ามีสัญญาณที่ AI คิดไอเดีย หาข้อมูล รัน backtest เขียนข้อเสนอ และทำเป็น production ซึ่งรันด้วยทุนจริงอยู่ตอนนี้ โดยมนุษย์รีวิวผลทั้งหมด แต่ไม่เปิดเผยว่าเป็นสัญญาณอะไร เพราะเป็น IP", "en": "Signals researched, backtested, proposed and productionized by AI with human review are live; details withheld as IP."}, {"th": "สัญญาณเป็นแค่ยอดภูเขาน้ำแข็ง ใต้น้ำคือ workflow (ล้างข้อมูล, ต่อราคา, จับ outlier, infra, backtest) ถ้าแต่ละทีมใช้ workflow คนละเวอร์ชัน ผลจะเทียบกันไม่ได้ จึงต้องมีฐานร่วม", "en": "The signal is the tip of an iceberg; differing workflows make results incomparable, so a shared foundation is needed."}, {"th": "สอน Claude ด้วยการให้เข้าถึงข้อมูล ความสามารถ และ workflow ขององค์กร ไม่ใช่ fine-tuning โดย skills เป็นชั้นเชื่อม", "en": "Teach Claude via access to data, capabilities and workflows, not fine-tuning; skills are the connective layer."}, {"th": "บทเรียนความผิดพลาด: รอบแรกเน้น adoption (workshop, hackathon, show-and-tell) ได้คนเขียน skill เยอะ แต่ส่วนใหญ่เป็น power user ไม่ใช่เจ้าของ process ตัวอย่างคือ skill ทำใบเบิกค่าใช้จ่ายที่ hardcode cost center ทำให้ผู้อนุมัติฝ่ายขายได้รับรายงานของแผนกอื่น", "en": "First attempt focused on adoption; power users, not process owners, wrote skills; the hardcoded cost-center expense skill is the example."}, {"th": "ทางแก้: marketplace กลาง (Man a knowledge) ที่ทุก skill มองเห็นได้ มี tag มีเจ้าของคือ workflow owner ทดสอบด้วย evals ติดตามการใช้งาน รีวิว และมี lifecycle เดโมแสดงการค้นหา alternative data (credit card data) ใช้ 4 skills สร้างสัญญาณเบื้องต้นแล้วรัน backtest บน compute แบบกระจาย", "en": "A central marketplace where each skill has an owner, evals, usage tracking, review and lifecycle; demo builds a toy signal from credit-card data using four skills."}, {"th": "บทเรียนปิดท้าย: organizational context คือ moat, ปฏิบัติต่อ skills เหมือน production code, วางแผนเจ้าของ/รีวิว/ปลดระวางก่อน rollout, และ adoption เป็นปัญหาของคน ไม่ใช่ license", "en": "Lessons: org context is the moat, treat skills like production code, plan ownership before rollout, adoption is a people problem."}], "numbers": [{"th": "Man Group บริหารสินทรัพย์เกิน 200 พันล้านดอลลาร์ (ตามที่ผู้พูดบอก)"}, {"th": "Backtest รันบนประวัติศาสตร์ 15 ปี หรือนานกว่า"}, {"th": "ใช้ Claude Code 750 คน จากพนักงานราว 17,800 คน (ผู้พูดพูดทั้ง 17,800 และ 1,700 ในประโยคเดียว จึงไม่แน่ใจ)"}, {"th": "มี governed skills เกิน 100 ตัว และ community skills อย่างน้อยเท่ากัน"}, {"th": "เดโม: ลงทุน $1,000 ในปี 2021 ตามสัญญาณ credit card จะเป็นราว $2,500 สำหรับ Amazon (ผู้พูดบอกเองว่าอาจเป็นความบังเอิญ จึงรันกับกลุ่มค้าปลีกเพิ่ม)"}, {"th": "เคสเดโมใช้ 4 skills สร้างสัญญาณ"}], "quotes": [{"text": "Treat those skills like production code because that's what they will become.", "th": "ปฏิบัติต่อ skills เหมือนโค้ด production เพราะสุดท้ายมันจะกลายเป็นอย่างนั้น"}, {"text": "Adoption is not a licensing problem. It's a people problem.", "th": "การนำไปใช้ไม่ใช่ปัญหาเรื่องไลเซนส์ แต่เป็นปัญหาของคน"}, {"text": "The work is on exposing it, not reinventing it.", "th": "งานคือเปิดเผยบริบทที่มี ไม่ใช่คิดใหม่"}], "steps": [], "takeaways_th": ["ก่อนปล่อย skill ตัวแรก ตกลงให้ชัดว่าใครเป็นเจ้าของ ใครรีวิว ทดสอบอย่างไร และปลดระวางเมื่อไร", "ให้เจ้าของ workflow จริงเป็นคนถือ skill ไม่ใช่ power user ที่ใช้บ่อยที่สุด และอย่า hardcode ค่าเฉพาะบุคคล เช่น cost center", "รวม skills ไว้ใน marketplace กลางที่ tag ค้นหาได้ ติดตามการใช้ และมี eval", "เริ่มจากการเปิดเผยข้อมูลและ workflow ที่องค์กรมีอยู่ให้ Claude เข้าถึง แทนการเทรนโมเดล", "วางแผนด้าน training และ engagement เพราะการรับไปใช้เป็นเรื่องของคน"], "caveats_th": ["ชื่อผู้พูดไม่ชัด: caption เขียน 'Sharan Fernando' แต่คำอธิบายคลิปเขียน 'Tushara Fernando' ควรตรวจกับแหล่งทางการ", "ผู้พูดไม่เปิดเผยตัวสัญญาณหรือผลตอบแทนจริง ข้ออ้างว่ามี signal รันเงินจริงจึงตรวจสอบไม่ได้จากคลิป", "ตัวเลขพนักงาน (17,800 กับ 1,700) ฟังจาก ASR ไม่ชัด และตัวเลข $2,500 มาจากเดโมแบบง่าย ผู้พูดบอกเองว่าจริงซับซ้อนกว่า", "ชื่อแพลตฟอร์มภายใน 'Man a knowledge' ตาม caption อาจสะกดเพี้ยน", "ไม่ใช่คำแนะนำการลงทุน เป็นกรณีศึกษาเรื่อง governance ของ skills"], "related_existing": ["skills-as-organization", "agent-skills", "agentic-ai-enterprise", "ai-coworker-company-brain", "claude-code-enterprise"], "dur": "20:45", "url": "https://www.youtube.com/watch?v=EOg4gY0Yln0", "asr": "yt-captions", "wiki": "cwc-london-09"}, {"n": 10, "id": "P0uMXS6emHA", "title_en": "Picking the right model", "title_th": "เลือกโมเดลให้ถูกด้วย eval ของตัวเอง แล้วขยับ effort, thinking, caching ให้ได้จุดคุ้มที่สุด", "speakers": [{"name": "Lucas", "role": "Applied AI team, Anthropic"}], "track": "models-prompting", "tags": ["model-selection", "evals", "prompt-caching", "extended-thinking"], "tldr_th": "Lucas จาก Applied AI บอกว่าเวลามีโมเดลใหม่ออก วิธีตัดสินใจที่ทำซ้ำได้คือสร้าง eval เล็กๆ ของ use case ตัวเอง แล้ววัด quality, latency, cost พร้อมกัน โมเดลที่ใช่คือตัวที่ถูกที่สุดต่อ 1 ผลลัพธ์ที่สำเร็จ ไม่ใช่ถูกที่สุดต่อ token และยังขยับ frontier ได้ด้วย effort, thinking, prompt caching กับ context hygiene", "tldr_en": "Build a small private eval, measure quality/latency/cost, and pick the model that is cheapest per successful outcome; then shift the frontier with effort, thinking, prompt caching and cleaner tool outputs.", "audience_th": "คนที่ต้องเลือกหรืออัปเกรดโมเดลใน product จริง และอยากได้กระบวนการตัดสินใจที่ใช้ข้อมูลแทน hot take", "points": [{"th": "เวลาโมเดลใหม่ออกจะมี model card, prompting guide, benchmark และ hot take บน X ท่วมไปหมด แต่คำถามจริงคือมันดีขึ้นกับ use case ของเราไหม ผู้พูดเสนอให้สร้าง eval เป็นกระบวนการที่ใช้ซ้ำได้ ให้คำตอบ yes/no ชัดๆ", "en": "New releases bring noise; the repeatable answer is an eval that gives a clear yes/no for your use case."}, {"th": "กรอบเลือกโมเดลมี 3 เสา คือ quality, latency, cost และยังมีตัวแปร effort/thinking เพิ่มเข้ามา เช่น Sonnet max thinking เทียบ Opus low thinking", "en": "Three pillars: quality, latency, cost, plus effort and thinking settings as extra variables."}, {"th": "benchmark สาธารณะอย่าง SWE-bench Verified บอกได้แค่ทิศทางกว้างๆ งานจริงมักผสมหลายแบบ (เช่น ค้น SDK แล้วเขียนโค้ด) และภาษาที่ใช้อาจไม่อยู่ใน benchmark เลย", "en": "Public benchmarks are directional only; real workloads are heterogeneous."}, {"th": "eval ประกอบด้วย task (input + เกณฑ์สำเร็จ) ให้มองเหมือนข้อสอบคณิต ตรวจทั้งคำตอบและวิธีทำ เช่น customer service agent ใช้ LLM-as-judge ตรวจคำตอบสุดท้ายกับวิธี query database และใช้ code-based grader ตรวจกฎตายตัวอย่างต้องเรียก tool ไหนหรือใส่ argument ประเทศ", "en": "An eval is a set of tasks graded on outcome and process, mixing LLM-as-judge and deterministic code graders."}, {"th": "กับดักของ eval มี 3 อย่าง คือเอา noise มาเป็น signal (ต้องรันซ้ำต่อ task), infra failure ที่ปนเป็นคะแนนโมเดล (ต้องอ่าน transcript แยกออก), และ silent saturation (ชุดข้อมูลต้องตรงกับ production และป้อน trace จริงกลับเข้า eval set)", "en": "Pitfalls: noise vs signal, infra failures mixed into scores, and silent saturation of the eval set."}, {"th": "ต้องอ่าน transcript จริงเสมอ ผู้พูดเล่าว่า eval ของ Claude Code เคยได้คะแนนสูงมาก แต่พอเปิดดูพบว่า Claude เข้าไปอ่าน git history ของรอบก่อนแล้วดึงคำตอบจากตรงนั้น และแนะนำให้ตั้ง observability (LangSmith, Braintrust ฯลฯ) ให้ trace system prompt, tool call, tool result ครบ", "en": "Read transcripts: one eval looked great because the model read git history for answers; set up tracing."}, {"th": "โมเดลแต่ละตัวมีนิสัยต่างกัน ต้องปรับ prompt ตามรุ่น ผู้พูดยกตัวอย่าง tool ตัวหนึ่งที่ trigger น้อยเกินไปบน Opus 4.5 แต่ trigger มากเกินไปบน Opus 4.6 ด้วย prompt เดิม แนะนำให้อ่าน prompting guide หรือป้อนให้ Claude ช่วยปรับ prompt", "en": "Each model behaves differently; the same prompt under-triggered a tool on Opus 4.5 and over-triggered on 4.6."}, {"th": "ตัวอย่างภายในของ code fix pipeline: Haiku 4.5 ไม่ใช้ thinking ได้ 92% เปิด thinking ถึง 100% ส่วน Sonnet กับ Opus ได้ 100% เหมือนกันแต่เร็วกว่า เพราะวางแผนได้ดีกว่าและใช้ turn น้อยกว่า จึงไม่ควรเดาจากภาพว่าโมเดลเล็กต้องเร็วกว่า", "en": "Internal example: bigger models reached 100% faster than Haiku because they needed fewer turns."}, {"th": "ตัวขยับ frontier ที่ผู้พูดเน้นคือ prompt caching (จ่าย 1/10 ของราคา input, ระบบดีๆ มี hit rate ราว 80-90%, ใช้ append-only อย่าใส่ datetime ใน system prompt) กับ context hygiene (เปลี่ยน JSON เป็น markdown, ย่อ timestamp ได้ลด token 66.4% ในตัวอย่างผลบอล Premier League, dedupe บทความจาก web search ลด input 77%)", "en": "Prompt caching (1/10 input price, append-only) and context hygiene (markdown, dedupe) shift the cost-quality curve."}, {"th": "ช่วง workshop ใช้ skill ที่ช่วย audit eval และ sweep ข้ามโมเดล/thinking/effort บน Tau-bench (ฝั่ง airline) แล้วพลอตผล พบว่า Opus 4.7 thinking on + high effort ได้ pass rate สูงสุดโดยใช้ output token น้อยกว่า Sonnet แต่แพงสุด ส่วน Haiku + thinking ใกล้เคียง Sonnet ตอนเน้นต้นทุน", "en": "Workshop sweep on Tau-bench airline: Opus high effort best pass rate with fewer tokens than Sonnet but most expensive."}], "numbers": [{"th": "Haiku 4.5 ไม่ใช้ thinking ใน code fix pipeline ภายใน ได้ 92% เปิด thinking ถึง 100% ส่วน Sonnet กับ Opus ได้ 100% ด้วยเวลาน้อยกว่า (ตามที่ผู้พูดเล่า)"}, {"th": "prompt caching: จ่าย 1/10 ของราคา input token และ hit rate ของระบบที่ดีที่เห็นอยู่ราว 80-90%"}, {"th": "ทำความสะอาด tool response ของข้อมูล Premier League (markdown แทน JSON, timestamp สั้นลง, เพิ่มวันในสัปดาห์) ลด token ลง 66.4%"}, {"th": "dedupe บทความจาก web search ก่อนส่งให้ Claude: input token ลด 77% ต้นทุนลด 65% และ accuracy เพิ่ม 9% (ตามที่ผู้พูดบอกว่าวัดด้วย eval)"}, {"th": "adaptive thinking ใช้ได้ตั้งแต่โมเดลตระกูล 4.6 ขึ้นไป (Sonnet 4.6)"}, {"th": "workshop sweep ใช้ Haiku, Sonnet 4.6, Opus 4.7 บน Tau-bench ฝั่ง airline"}], "quotes": [{"text": "the model that's right for your use case is not necessarily the one that's cheapest or fastest per token, but the one that is cheapest per successful outcome.", "th": "โมเดลที่ใช่ไม่จำเป็นต้องถูกหรือเร็วที่สุดต่อ token แต่คือตัวที่ถูกที่สุดต่อผลลัพธ์ที่สำเร็จ"}, {"text": "You like really need to read your transcripts of what the agent or model is doing at different points in your system.", "th": "ต้องอ่าน transcript ว่า agent หรือโมเดลทำอะไรในแต่ละจุดจริงๆ"}, {"text": "people spend too much time thinking about these like super complex multi-agent orchestration systems and not enough time doing the simple thing that works", "th": "คนมัวคิดเรื่อง multi-agent orchestration ซับซ้อน แต่ไม่ค่อยทำสิ่งง่ายที่ได้ผล คือ context hygiene"}], "steps": ["นิยาม task ของ eval: input + เกณฑ์สำเร็จ แล้วรวมเป็น dataset", "ตั้ง grader ต่อ task ทั้ง LLM-as-judge (คำตอบสุดท้าย, วิธี query) และ code-based (ต้องเรียก tool ไหน, argument ประเทศ)", "รันซ้ำหลายรอบต่อ task เพื่อแยก noise จาก signal และอ่าน transcript แยก infra failure ออก", "รัน sweep ข้ามโมเดล, thinking on/off และ effort level แล้วพลอต pass rate เทียบ output token, ต้นทุน, latency", "เลือกจุดบน Pareto frontier ตามสิ่งที่ให้ความสำคัญ แล้วขยับ frontier ด้วย prompt caching และ context engineering", "ใน workshop: โหลด skill ที่ audit eval + instrument โค้ดให้ sweep, ใช้ Tau-bench (airline) เป็นตัวอย่าง, ให้ Claude ช่วยติดตั้ง"], "takeaways_th": ["สร้าง eval เล็กๆ ของงานตัวเองก่อนตัดสินใจเปลี่ยนโมเดลทุกครั้ง และเติม trace จริงจาก production กลับเข้า eval set", "วัดต้นทุนต่อผลลัพธ์ที่สำเร็จ ไม่ใช่ราคาต่อ token", "ตั้ง tracing ให้เห็นสิ่งที่โมเดลเห็นทุกจุด แล้วอ่าน transcript ก่อนเชื่อคะแนนสรุป", "วัด prompt cache hit rate จาก usage ที่ API คืนมา ใช้ messages แบบ append-only และอย่าใส่ค่าที่เปลี่ยนทุก turn (เช่นเวลา) ใน system prompt", "ทำความสะอาด tool output ก่อนส่งให้โมเดล (markdown, dedupe, ตัดฟิลด์ไม่จำเป็น) แล้วปรับ prompt ตามรุ่นโมเดลที่ใช้"], "caveats_th": ["transcript เป็น YouTube auto-caption ไม่แยกผู้พูด ชื่อ Lucas ได้ยินตอนแนะนำตัว ไม่ได้ยินนามสกุล", "ตัวเลขทั้งหมดเป็นข้ออ้างจากผู้พูด ผมยืนยันเองไม่ได้ และตัวเลขเปอร์เซ็นต์ใน workshop ไม่ได้อ่านออกเสียง (ดูจากกราฟบนจอ)", "ชื่อ benchmark อย่าง Tau-bench / SWE-bench / Browse-comp สะกดตามที่ ASR เขียนมา (Tao bench, browse com) และ 'Sonic 4 6' ในช่วงท้ายน่าจะหมายถึง Sonnet 4.6", "ผู้พูดบอกว่า 'Cohere' ใช้ prompt caching เช่นกัน ซึ่งน่าจะเป็น ASR ฟังผิดหรือพูดผิด ไม่ได้นำมาใส่ในสรุป", "ผลสรุปการ sweep เป็นการอธิบายกราฟบนจอ ไม่เห็นตัวเลขจริงใน transcript"], "related_existing": ["claude-code-prompt-caching", "claude-code-model-config", "token-economics", "context-management", "claude-code-costs"], "dur": "31:39", "url": "https://www.youtube.com/watch?v=P0uMXS6emHA", "asr": "yt-captions", "wiki": "cwc-london-10"}, {"n": 11, "id": "IGo225tfF2I", "title_en": "Memory and dreaming for self learning agents", "title_th": "Memory กับ dreaming ทำให้ Managed Agents เรียนรู้ข้ามงานได้", "speakers": [{"name": "Ravi", "role": "leads the API knowledge team within platform, Anthropic"}], "track": "agents-platform", "tags": ["managed-agents", "agent-memory", "self-improving", "enterprise-adoption"], "tldr_th": "Ravi อธิบายว่า memory ของ Claude Managed Agents ออกแบบเป็น file system ที่หลาย agent แชร์ได้พร้อมสิทธิ์ read-only/read-write และมี version history ส่วน dreaming เป็น batch process นอก session ที่อ่าน transcript ข้าม session แล้วเสนอปรับ memory ให้ถูกต้องและเป็นระเบียบขึ้น ปิด loop ให้ agent เรียนรู้ต่อเนื่อง", "tldr_en": "Managed Agents memory is a shared, versioned file-system store; dreaming is an out-of-band batch process that reviews session transcripts and curates memory so agents self-improve.", "audience_th": "คนที่ทำ agent ระยะยาวหรือหลาย agent และอยากให้ agent เรียนรู้จากงานก่อนหน้า ควรรู้จัก Managed Agents ระดับพื้นฐาน", "points": [{"th": "ภาพรวมเส้นเวลาตามที่ผู้พูดเล่า: MCP (2024), Claude Code กับ Agent SDK (2025), skills ปลายปีนั้น และ Claude Managed Agents เมื่อเดือนก่อน agent ทำงานยาวขึ้นเรื่อยๆ แต่การจัดการ context ในงานยาวยังเป็นงานที่ทำอยู่ memory จึงสำคัญ", "en": "Timeline from MCP to Managed Agents; long-horizon context management still needs work, hence memory."}, {"th": "เป้าหมายของ memory คือประสิทธิภาพดีขึ้นจาก task หนึ่งไปอีก task, ข้าม environment และข้าม agent เพราะถ้าไม่มี memory ทุก task เริ่มจากกระดานเปล่า", "en": "Goal: performance improves task to task, across environments and agents."}, {"th": "ผู้พูดอ้างผลจากลูกค้า: Rakuten ลด first-pass error ใน production agent ลง 97%, WiseDocs ลดปัญหาซ้ำในงานตรวจเอกสารด้วย cross-session memory", "en": "Claimed results: Rakuten 97% fewer first-pass errors; WiseDocs fewer recurring issues."}, {"th": "หลักการออกแบบคือ 'get out of Claude's way' โมเดลเก่งกับ file system, bash, grep อยู่แล้ว จึงโมเดล memory เป็นไฟล์ (ต่างจากเดิมที่เป็น capability ใน harness เช่น Claude.md หรือ memory tool) และบอกว่า Opus 4.7 เก่งเรื่อง file-system-based memory", "en": "Design principle: model memory as files since Claude is strong with file systems; Opus 4.7 is described as state of the art here."}, {"th": "สำหรับหลาย agent: หลาย session แชร์ memory store เดียวกันพร้อมกันได้ มี scope read-only (เช่น memory ระดับองค์กรที่อัปเดตไม่บ่อย) กับ read-write (เฉพาะงาน) เกิดเป็นลำดับชั้น และใช้ optimistic concurrency control กันเขียนทับกัน", "en": "Shared stores with read-only and read-write scopes, plus optimistic concurrency control."}, {"th": "ฝั่ง enterprise: version control เป็น audit trail ดู diff ระหว่างเวอร์ชันได้ บอกได้ว่า agent ตัวไหนเขียนส่วนไหน และมี standalone API ทั้ง CRUD และ export กับ redaction", "en": "Enterprise controls: version history, diffs, attribution, standalone API with export and redaction."}, {"th": "ปัญหาที่เจอเมื่อขยายเป็น multi-agent: agent ทำผิดซ้ำและเรียนรู้แยกกัน ใช้วิธีที่ไม่มีประสิทธิภาพคล้ายกัน memory ถูกอัปเดตแบบ optimal เฉพาะที่ ไม่ optimal ทั้งระบบ เกิดซ้ำซ้อนและกระจัดกระจาย", "en": "At scale memory becomes locally optimal but globally messy: duplication and fragmentation."}, {"th": "dreaming (research preview ใช้กับ managed agents) เป็น batch process นอก session แยกจาก agent loop เรียกได้แบบ ad hoc, รายคืน, รายชั่วโมง หรือผูกกับ event เช่นจบ session ผ่าน API มันวิเคราะห์ transcript ตรวจ memory ปัจจุบัน แล้วเสนอ snapshot ใหม่ที่ตรวจแล้วให้ agent เลือกรับ", "en": "Dreaming is an out-of-band batch process producing a verified memory snapshot agents can adopt."}, {"th": "เหตุผลที่ต้องอยู่นอก hot path: เห็น pattern ข้าม session/agent ที่ agent เดี่ยวมองไม่เห็น, มี objective ชัดไม่ต้องแลก memory quality กับการทำงานให้เสร็จ, และไม่เพิ่ม latency ให้ agent", "en": "Out-of-band design: cross-agent patterns, clean objectives, no added latency."}, {"th": "เดโม SRE: agent triage alert อ่าน memory org-wide แบบ read-only (SLO policy, runbook, on-call mapping) และเขียน memory เฉพาะงาน session ถัดมาเห็นว่ามี fix กำลังไป จึงประสานกันได้ จากนั้นสั่ง dream ใน console บน 5 session ย้อนหลัง 7 วัน dreaming ใช้ sub-agent วิเคราะห์ transcript คู่ขนาน และเสนอ diff เช่น พบ alert ที่เกิด 60 วินาทีหลัง CPU spike จึงบันทึกสมมติฐานเรื่อง retry behavior", "en": "SRE demo: shared memory coordinates agents; a dream over 5 sessions surfaces a recurring alert pattern and updates memory."}], "numbers": [{"th": "Rakuten: first-pass error ใน agent ที่ deploy จริงลด 97% (ตามที่ผู้พูดบอก)"}, {"th": "Harvey: completion rate ใน legal benchmark เพิ่ม 6 เท่าเมื่อใช้ dreaming (ตามที่ผู้พูดบอก)"}, {"th": "METR study ปี 2025 ที่ผู้พูดอ้าง: ความยาวงานที่ agent ทำได้เพิ่มเป็นสองเท่าทุก 7 เดือน"}, {"th": "Opus 4.7 ถูกอธิบายว่า state of the art ด้าน file-system-based memory และเปิดตัว 'เดือนที่แล้ว'"}, {"th": "เดโม dreaming: ใช้ 5 session จาก 7 วันล่าสุด พบ alert ที่ตามหลัง CPU spike 60 วินาที"}], "quotes": [{"text": "Memory lets agents learn. It lets agents carry forward learnings from their previous tasks.", "th": "memory ทำให้ agent เรียนรู้และพาสิ่งที่ได้จากงานก่อนหน้าไปต่อได้"}, {"text": "Creating a process that's decoupled from the underlying agent loop has benefits.", "th": "การแยกกระบวนการออกจาก agent loop เดิมให้ประโยชน์หลายอย่าง"}, {"text": "dreaming is the bridge between memory as we know it today and organization scale memory and knowledge.", "th": "dreaming คือสะพานจาก memory ปัจจุบันไปสู่ memory และความรู้ระดับองค์กร"}], "steps": ["เดโม SRE: ระบบรับ alert/page แล้วสร้าง agent มา triage และแก้", "agent อ่าน memory store org-wide แบบ read-only (SLO policy, runbook, on-call mapping) และมี memory store read-write เฉพาะงาน", "agent หนึ่งหา root cause เปิด fix แล้วจดใน memory ว่า fix กำลังมา session ถัดไปที่เจอเหตุคล้ายกันอ่านแล้วรู้ทันที", "เปิดดู version history และ attribution ของการเขียน ซึ่งมี precondition จาก optimistic concurrency", "ใน Cloud console เปิดหน้า memory stores ดูไฟล์ใน team SRE store แล้วไปแท็บ Dreams", "สร้าง dream: เลือก store และ batch ของ session 7 วันล่าสุด (ราว 5 session) แล้วกด start", "ดู dream session (สร้างบน Managed Agents เอง ใช้ sub-agent วิเคราะห์ transcript คู่ขนาน) มี output memory store ที่กำลังคอมไพล์", "ดู diff ของ memory ที่ได้ เช่น บันทึก pattern alert หลัง CPU spike และจัด triage log ใหม่ให้เป็นภาพรวม"], "takeaways_th": ["ถ้าจะให้ agent เรียนรู้ ออกแบบ memory เป็นไฟล์ที่ Claude อ่านเขียนด้วยเครื่องมือที่เก่งอยู่แล้ว ไม่ต้องสร้างโครงซับซ้อน", "แยก memory เป็นชั้น: ระดับองค์กรแบบ read-only กับระดับงานแบบ read-write เพื่อคุมสิทธิ์และคุณภาพ", "เปิด version history และ attribution ไว้ เพื่อ audit และ diff ว่า memory เปลี่ยนไปยังไง", "ถ้าหลาย agent เขียน memory ซ้ำซ้อน ให้พิจารณารัน dreaming เป็นรอบ (รายคืนหรือเมื่อจบ session) เพื่อ curate", "ลองใช้ dreaming ใน research preview กับ memory store ของ managed agents ที่มีอยู่"], "caveats_th": ["transcript เป็น auto-caption ชื่อ Ravi ได้ยินตอนแนะนำตัวเอง ไม่ได้ยินนามสกุล", "ตัวเลข Rakuten 97%, Harvey 6 เท่า และ METR doubling ทุก 7 เดือน เป็นข้ออ้างของผู้พูด ผมยืนยันเองไม่ได้", "ASR เขียน 'Cloud console' และ 'Cloud Manage agents' ซึ่งหมายถึง Claude console / Claude Managed Agents", "ท่อนต้นของ transcript มีประโยคขาดหายตอนพูดถึง skills ('gave model else ... a models a generic abstraction') แต่ใจความไม่เสียหาย", "ประโยคท้ายช่วงสรุปที่ว่า 'a frontier your system' ASR ผิดชัดเจน ไม่แน่ใจว่าพูดว่าอะไร (น่าจะ 'frontier memory system') จึงไม่ได้นำมาอ้าง"], "related_existing": ["long-horizon-agents", "context-management", "claude-agent-sdk", "agent-skills", "harness-engineering"], "dur": "21:34", "url": "https://www.youtube.com/watch?v=IGo225tfF2I", "asr": "yt-captions", "wiki": "cwc-london-11"}, {"n": 12, "id": "nho1YAEPuwA", "title_en": "What legal agents inherit from coding agents: Lessons from Legora", "title_th": "agent กฎหมายสืบทอดอะไรจาก coding agent: บทเรียนจาก Legora", "speakers": [{"name": "Jakob Emmerling", "role": "Engineer ที่ Legora (คำอธิบายคลิประบุ Staff Software Engineer; transcript สะกด Jacob)"}], "track": "domain-case", "tags": ["legal-ai", "agent-reliability", "claude-code", "managed-agents"], "tldr_th": "Jakob จาก Legora เสนอกรอบสา
