, พารามิเตอร์ลด token และ rate limit, เปิด telemetry, ปิด login prompt/onboarding message"], "takeaways_th": ["ถ้าองค์กรอยู่บน AWS ลองใช้ Claude Code ผ่าน Bedrock เพื่อให้ข้อมูลอยู่ใน boundary และรวมบิล", "เลือก region (เช่น London/EU) ตามข้อกำหนดข้อมูลก่อน deploy", "เริ่มจากเวิร์กชอปโมดูล 1-3 แล้วค่อยไปชุดขั้นสูงเรื่อง team standards และ cost control", "ต้องการ agent hosting ให้ดู Bedrock AgentCore คู่กับ Claude Agent SDK", "เทียบสามทางใช้งาน (Bedrock, Claude platform on AWS, Desktop/Enterprise) ว่า feature parity และ billing แบบไหนตรงกับทีม"], "caveats_th": ["ASR เขียน \"Cloud\" แทน Claude และ \"CodeWhisperer\" ปรากฏในที่ที่น่าจะหมายถึง Claude Code / Claude Desktop ตัวชื่อไม่ชัด", "\"Scaled Draw\" ใน transcript น่าจะเป็น Excalidraw (ตีความจาก ASR ไม่ได้ยืนยัน)", "ตัวเลข 100 billion ไม่ระบุหน่วยในเสียง ตัวเลขทุกตัวเป็นข้ออ้างของผู้พูด", "คลิปจบกลางเนื้อหา advanced configuration ไม่เห็นผลรันจริงของ lab", "ชื่อ Antonio Rodriguez แนะนำตัวเอง นามสกุลอาจเพี้ยน"], "related_existing": ["claude-code-enterprise", "claude-code-subagents", "claude-code-mcp", "claude-agent-sdk", "claude-code-model-config"], "dur": "19:42", "url": "https://www.youtube.com/watch?v=5YHIrTYxM3w", "asr": "yt-captions", "wiki": "cwc-london-22"}, {"n": 23, "id": "wI0ptqCSL0I", "title_en": "Stop babysitting your agents", "title_th": "เลิกเฝ้า agent: verification loop, multi-Claude และงานเบื้องหลัง", "speakers": [{"name": "Sid Bidisaria (สะกดตาม Whisper อาจเพี้ยน)", "role": "founding engineer ของ Claude Code"}], "track": "claude-code", "tags": ["claude-code", "agent-reliability", "mcp-tools-skills", "self-improving", "devex"], "tldr_th": "ผู้พูดจาก Claude Code team บอกว่าโมเดลเก่งขึ้นแต่คนยังต้องเฝ้าหน้าจอและนั่งเป็น QA ให้ Claude ทางออกคือสอน Claude ให้ verify งานตัวเองเป็น loop (รัน app, ใช้ browser, พิสูจน์ผล, ปลดบล็อก auth/state) แล้วเก็บไว้เป็น skill ที่แก้ตัวเองได้ จากนั้นขยายเป็นหลาย session และงานเบื้องหลัง", "tldr_en": "A Claude Code founding engineer shows how to stop babysitting: give Claude a verification loop (run app, drive browser, prove result, unblock auth/state), package it as a self-improving skill, then scale with desktop app, Claude Agents, web and Remote Control.", "audience_th": "คนที่ใช้ Claude Code ทุกวันและอยากได้ระดับ advanced ควรมี CLAUDE.md และต่อ tool เข้า Claude Code มาก่อนแล้ว", "points": [{"th": "ผู้พูดตั้ง 3 ข้อพื้นฐาน: CLAUDE.md คุณภาพสูง (ตามคำเขา เป็นสิ่งที่ leverage สูงสุด), ต่อ tool ที่ใช้ในชีวิตจริงให้ Claude (Slack, Asana, Linear, Datadog, BigQuery) และตั้ง remote environment บน Claude Code Web ให้ compute แยกจากแล็ปท็อป", "en": "Prerequisites: a high-quality CLAUDE.md, connected tools, and a remote environment on Claude Code Web."}, {"th": "tooling เดิมสร้างมาเพื่อคน แต่ตอนนี้ agent เป็นคนเขียนโค้ดส่วนใหญ่ จึงต้องถามว่า agent ต้องการอะไรจาก codebase ที่คนมองข้ามไปเพราะคิดว่าเป็นเรื่องปกติ", "en": "Tools were built for humans; ask what an agent needs from your codebase that humans take for granted."}, {"th": "verification loop คือหัวใจ: Claude เขียนโค้ด เช็คว่า fail ไหม debug แล้วเขียนต่อวนจนสำเร็จ ตัวอย่างคือแก้ปุ่ม sign-up เว็บส่วนตัว Claude build app คลิกปุ่มใน browser อ่าน log แก้ แล้วส่ง PR ที่ทำงานจริง", "en": "The verification loop: write code, check failure, debug, repeat until success; example of fixing a broken sign-up button."}, {"th": "ผู้พูดบอกว่าการให้ tool และคำสั่งสำหรับ loop ลงที่ 4 อย่าง: รัน application (เช่น dev server), ให้ Claude ใช้ app ผ่าน browser (Claude in Chrome ผ่าน /chrome หรือ Playwright), พิสูจน์ผล (screenshot ก่อน/หลังแก้) และปลดบล็อก auth กับ state ด้วย script ที่ไม่ตายตัวเกินไป", "en": "Loop ingredients: run the app, drive it via a browser MCP, prove it works (before/after screenshots), and unblock auth/state with flexible scripts."}, {"th": "เก็บ loop เป็น skill แล้วทำให้ self-improving: สั่งให้ skill แก้ตัวเองทุกครั้งที่เจอ blocker ทีม Claude Code ใช้ verification skill เดียวที่ถูกสั่งให้บันทึกตัวเอง ทุกคนในทีมช่วยกันเติม", "en": "Package the loop as a skill told to update itself on each blocker; the Claude Code team uses one such verification skill."}, {"th": "เดโมกับ MonkeyType: สั่งเปิด dev server, ใช้ Chrome MCP ตรวจ front end พิมพ์ทดสอบ เปลี่ยน settings แล้วสั่งสรุปเป็น skill file จากนั้นเพิ่มฟีเจอร์ confetti ตอนพิมพ์ผิดโดยให้ Claude ใช้ skill นั้น verify ตัวเอง (เปิด auto mode) Claude แก้ lint error เองจนผ่าน", "en": "MonkeyType demo: bring up the stack, drive Chrome MCP, distil into a skill, then add a confetti feature verified via that skill in auto mode."}, {"th": "ขยายหลาย session: ผู้พูดบอกว่าเกิน 4-5 session สมองเริ่มรับไม่ไหว เครื่องมือช่วยจัดการความสนใจคือ desktop app (sidebar รวมทุก session, pin/rename/ใส่สี), Claude Agents (เรียงตามระดับที่ต้องการความสนใจ), Claude Code on the web และ Remote Control (/remote-control สั่งจากมือถือ มี notification)", "en": "Scaling: desktop app, Claude Agents view, Claude Code on the web, and Remote Control; the speaker says ~4-5 concurrent sessions is his limit."}, {"th": "ช่วงสุดท้ายเรื่อง background loops: งานแบบเฝ้า PR (review comment, merge conflict, CI fail), อัปเดต docs, triage, monitor feedback และรักษา CI ให้เขียว ควรโยนให้ Claude ทำเบื้องหลัง", "en": "Background loops should take over PR babysitting, docs updates, triage, feedback monitoring and CI upkeep."}], "numbers": [{"th": "ผู้พูดบอกว่าเปิดเกิน 4-5 session พร้อมกันแล้วภาระสมองสูงเกินไป"}, {"th": "การตั้ง verification loop เองใช้เวลาประมาณ 5-10 นาที (ตามที่ผู้พูดประเมิน)"}, {"th": "องค์ประกอบ verification loop 4 อย่าง: run app / use via browser / prove it works / unblock (auth, state)"}, {"th": "ช่องทาง multi-Claude 4 แบบ: desktop app, Agent view (Claude Agents), Claude in the cloud, Remote Control"}, {"th": "Claude Agents ปล่อยมาประมาณหนึ่งสัปดาห์กว่า ณ วันที่พูด (ตามผู้พูด)"}, {"th": "demo app: MonkeyType เขียนด้วย TypeScript + Express backend, MongoDB และ Redis"}], "quotes": [{"text": "what does an agent need from your code base that a human takes for granted?", "th": "agent ต้องการอะไรจาก codebase ที่คนมองว่าเป็นเรื่องปกติจนไม่ได้คิด"}, {"text": "But loops are really what makes the whole thing go around.", "th": "แต่ loop นี่แหละที่ทำให้ทุกอย่างหมุน"}, {"text": "The key takeaway here is you should try to hold Claude's hand and show it how to do verification.", "th": "ข้อสรุปหลักคือให้จูงมือ Claude สอนวิธี verify"}], "steps": ["เตรียม app ไว้ในเครื่อง ติดตั้ง dependencies และมี CLAUDE.md (MonkeyType: Express + MongoDB + Redis)", "เปิด session ใหม่ สั่งให้ Claude spin up dev server แล้วเปิด front end/back end ตรวจเอง", "เปิด Chrome MCP ด้วย /chrome (ตรวจว่า status enabled, extension installed)", "สั่ง 'use the Chrome MCP to make sure the front end is working' แล้วไล่ให้ลองพิมพ์ และเปลี่ยน settings (ตั้ง difficulty เป็น Expert แล้วเช็คว่าค่าถูกเก็บ) ดู tool call ด้วย Ctrl-O", "สั่ง 'take everything we learned and put it into a skill file' ได้ SKILL.md: ขั้น bring up the stack (Docker Compose), โหลด Chrome MCP tools, smoke test ด้วย browser", "เปิด auto mode แล้วสั่งเพิ่มฟีเจอร์ confetti เมื่อพิมพ์ผิด พร้อมให้ใช้ skill ที่สร้าง verify งานตัวเอง", "ดู loop ทำงาน: Claude เขียนโค้ด เจอ lint error แก้ แล้ว verify ซ้ำ จนเห็น confetti จริง"], "takeaways_th": ["ก่อนเรื่องอื่น ตรวจให้ครบ 3 ข้อ: CLAUDE.md ดี, ต่อ tool, ตั้ง remote environment", "ลองจูงมือ Claude ทำ verify ครั้งเดียว (รัน app, ใช้ browser, เช็คผล) แล้วสั่งให้สรุปเป็น skill ทันที", "ใส่คำสั่งใน skill ให้อัปเดตตัวเองเมื่อเจอ blocker แล้วแชร์ในทีม", "ถ้าเปิดหลาย session ให้ใช้ Claude Agents หรือ desktop app จัดตามระดับที่ต้องการความสนใจ และตั้ง /remote-control ไว้รับ notification จากมือถือ", "ระบุงาน bookkeeping ที่เสียเวลา (เฝ้า PR, docs, CI) เพื่อโยนให้ background loop"], "caveats_th": ["Transcript มาจาก Whisper large-v3 ที่ถอดเอง: 'Cloud/Clot' = Claude, ชื่อผู้พูดสะกดตาม Whisper ('Sid Bidisaria') อาจเพี้ยน และคลิปยกชื่อมาจากการแนะนำตัวเองเท่านั้น", "transcript ช่วงท้ายเสียหาย: มีประโยคซ้ำวน (Whisper loop) ช่วง Claude Code desktop ต่อด้วย Claude Agents และช่วง background automation ซึ่งเป็นหัวข้อสุดท้ายถูกตัดเหลือเพียงรายการงานทั่วไป ไม่มีรายละเอียดวิธี implement", "ในส่วน verification loop ผู้พูดบอกว่ามี 4 อย่าง แต่ transcript มีรายละเอียดเฉพาะแนว front-end เท่านั้น", "ผู้พูดข้ามเดโม Claude Agents และ Remote Control เพราะเวลาไม่พอ", "คำอ้างว่า CLAUDE.md 'leverage สูงสุด' เป็นความเห็นของผู้พูด ไม่มีหลักฐานเชิงตัวเลข"], "related_existing": ["claude-code-background-agents", "loop-engineering", "agent-skills", "claude-code-practices", "claude-code-sessions"], "dur": "37:07", "url": "https://www.youtube.com/watch?v=wI0ptqCSL0I", "asr": "whisper", "wiki": "cwc-london-23"}, {"n": 24, "id": "sRvUXLquiRg", "title_en": "What's new in Claude Code", "title_th": "Claude Code มีอะไรใหม่: remote control, auto mode, routines, agent view และอื่น ๆ", "speakers": [{"name": "Ralph", "role": "technical staff ที่ Anthropic (Whisper เขียนเป็น 'Entropic') ทำงานกับ partner และลูกค้าทั่วยุโรป"}], "track": "claude-code", "tags": ["claude-code", "devex", "agent-memory", "subagents", "enterprise-adoption"], "tldr_th": "Ralph สรุปฟีเจอร์ Claude Code ที่ปล่อยช่วงไม่กี่เดือนล่าสุดใน 2 หมวด คือ developer experience (remote control, full screen UI ไม่กระพริบ, desktop app ใหม่) และ autonomy (auto mode, worktrees, auto memory, code review, routines, agent view) พร้อมเดโมสดหลายอัน", "tldr_en": "Ralph walks through recent Claude Code features in two groups, developer experience and autonomy, with live demos of remote control, full-screen TUI, the desktop app, routines and agent view.", "audience_th": "คนใช้ Claude Code อยู่แล้วและอยากตามฟีเจอร์ใหม่ รวมทั้งทีมที่ดูแลการ deploy ระดับองค์กร", "points": [{"th": "Remote control: เริ่ม session บนเครื่อง แล้วคุมต่อจากแอป Claude บนมือถือหรือเบราว์เซอร์ได้ ใช้คำสั่ง remote control ได้เลย มี notification เมื่อ Claude ต้องการ input และตั้งใน settings.json ให้เปิดตลอดได้", "en": "Remote control: start a session on your computer and continue from mobile or browser, with notifications; can be always-on via settings.json."}, {"th": "Flicker-free full screen UI: โหมดใหม่ virtualize scrollback ของ terminal เรนเดอร์เฉพาะส่วนที่เห็น ทำให้ไม่กระพริบและ memory ไม่โตตามความยาว session ยังคลิกขยายข้อความ/ปุ่มและกลับลงล่างสุดได้ เปิดด้วยคำสั่ง tui กับพารามิเตอร์ fullscreen และตั้งเป็นค่าเริ่มต้นได้", "en": "Full-screen TUI virtualizes scrollback: no flicker, flat memory, clickable elements; enabled via /tui fullscreen and can be default."}, {"th": "Desktop app ปรับ UI ใหม่หมด: sidebar จัดกลุ่ม session ตามโปรเจกต์/repo, ดู plan แล้วคอมเมนต์ส่งกลับให้ Claude แก้, ดู diff ของ PR แล้วคอมเมนต์ถามรายบรรทัด, มี GitHub integration และดูไฟล์ทั้งโปรเจกต์ได้", "en": "Revamped desktop app: sessions grouped by project, plan view with comments, diff comments, GitHub integration, file browser."}, {"th": "Auto mode: แทนที่จะถามสิทธิ์ทุกครั้ง ใช้ classifier ตรวจ 2 อย่างคือการกระทำนั้น destructive ไหม และดูเหมือน prompt injection ไหม ถ้าผ่านก็ทำต่อ ถ้าไม่ผ่านจะหาทางอื่นก่อน แล้วค่อยมาถามคนเป็นทางสุดท้าย", "en": "Auto mode uses a classifier checking for destructive actions and prompt injection; passes proceed, failures try a workaround then ask."}, {"th": "Worktrees: รองรับแบบ native ใช้ claude --worktree เพื่อให้หลาย session ทำงานใน repo เดียวกันโดยไม่ชนไฟล์กัน ขอให้ Claude สร้างระหว่าง session ก็ได้ และ desktop app มี flag ให้", "en": "Native worktree support via claude --worktree so parallel sessions don't collide; also in desktop app."}, {"th": "Auto memory: Claude จดโน้ตเองระหว่างทำงาน (coding style, ตัวเลือกสถาปัตยกรรม, debugging insight) เก็บใน memory.md ที่เป็น index สั้น ๆ ชี้ไปไฟล์ memory รายเรื่อง โหลดทีละส่วนแบบ progressive discovery แชร์ข้าม worktree ของโปรเจกต์ ไม่ออกจากเครื่อง และตรวจได้ด้วย /memory", "en": "Auto memory: Claude saves notes to a short memory.md index linking topic files, loaded progressively, local to the machine, auditable via /memory."}, {"th": "Code review อัตโนมัติ: หลาย agent ตรวจคนละด้าน (error, bug, vulnerability, logic) ในเฟสแรก แล้วเฟสสองตรวจ findings เทียบโค้ดจริงว่าจริงหรือไม่ ใช้ผ่าน GitHub app กับทุก PR หรือสั่งเองด้วย /ultra-review", "en": "Multi-agent, two-phase code review: agents find issues, then verify findings against the code; via GitHub app or /ultra-review."}, {"th": "Routines (research preview, ปล่อยต้นเดือนนี้): สร้าง session อัตโนมัติจาก schedule, API call หรือ GitHub event รันบน cloud โดยไม่ต้องเปิดเครื่อง เดโมคือ routine เช็ค repo ทุก 08:00 กับ 16:00 และ routine ที่ trigger เมื่อมี issue ใหม่/PR ใหม่", "en": "Routines (research preview): schedule/API/GitHub-triggered cloud sessions; demos of twice-daily repo check and issue/PR triggers."}, {"th": "Agent view (public preview): เริ่มด้วย claude agents เห็นทุก session จัดกลุ่มตามสถานะ รันเบื้องหลังได้ กด enter เข้า session หรือกด space ส่ง prompt เข้า session โดยไม่ต้องเข้าไป", "en": "Agent view (public preview): one view of all sessions grouped by status, running in the background; space to send a prompt without entering."}, {"th": "สำหรับองค์กร: ปรับปรุงการรองรับ Windows, wizard สำหรับ deploy บน Google Cloud Platform และ AWS, native binaries ให้ติดตั้งผ่าน governance pipeline และแหล่งตามข่าว: @ClaudeDevs, What's New ใน docs, changelog, newsletter", "en": "Enterprise: better Windows support, GCP/AWS deployment wizards, native binaries; follow Claude devs, What's New docs, changelog, newsletter."}], "numbers": [{"th": "รายการฟีเจอร์ที่ผู้พูดไล่ (ตามลำดับ): 1) remote control 2) flicker-free full screen TUI 3) desktop app UI refresh 4) auto mode 5) worktrees 6) auto memory 7) automated code review (/ultra-review) 8) routines 9) agent view"}, {"th": "คำสั่ง/แฟลกที่ปรากฏ: remote control, tui + fullscreen, claude --worktree, /memory, /ultra-review, claude agents (agent view)"}, {"th": "สถานะรุ่น: routines = research preview (ปล่อยต้นเดือน), agent view = public preview"}, {"th": "เดโม routine: รันทุกวันเวลา 8:00 AM และ 4:00 PM ตรวจ commit และ issue ใหม่ของ public repo"}, {"th": "Auto mode classifier ตรวจ 2 อย่าง: destructive หรือไม่ และเข้าข่าย prompt injection หรือไม่"}, {"th": "Code review แบบ multi-agent, 2 เฟส; ผู้พูดบอกว่า error ที่คนใช้เป็นชั่วโมงหา เหลือหลักนาที (ข้ออ้างของผู้พูด)"}, {"th": "ฟีเจอร์องค์กร: Windows support ที่ดีขึ้น, wizard deploy GCP + AWS, native binaries"}], "quotes": [{"text": "Auto mode checks that with a classifier that checks two things.", "th": "auto mode ใช้ classifier ตรวจสองเรื่อง"}, {"text": "So one is a manual. The other one is a note taking.", "th": "อันหนึ่งคือคู่มือ อีกอันคือโน้ตที่จดระหว่างทำงาน (เทียบ CLAUDE.md กับ memory.md)"}, {"text": "Think about it, dispatching a session and go run some errands, walking the dog, that's something I do a lot, or maybe even a bio break if you want.", "th": "ลองนึกภาพการสั่ง session ไว้แล้วออกไปทำธุระ พาหมาเดิน หรือแม้แต่เข้าห้องน้ำ"}], "steps": ["Remote control: พิมพ์ remote control ใน session บนเครื่อง ได้ session บนเว็บและมือถือ ลองส่ง prompt ให้ rename session แล้วสลับไปมา", "Full screen TUI: ใช้ tui กับพารามิเตอร์ fullscreen แล้วสั่งให้เขียนไฟล์ สังเกตการคลิกขยายข้อความและปุ่มกลับลงล่างสุด", "Desktop app: จัดกลุ่ม session ตามโปรเจกต์ ดู plan ใส่คอมเมนต์ ดู diff แล้วถามรายบรรทัด", "Routines: เข้าปุ่ม Routines ใน desktop เลือก remote environment ตั้งชื่อ prompt เลือก repo เลือก GitHub event (issue opened) แล้วสร้าง issue ทดสอบดู routine ถูก trigger ด้วย webhook", "Agent view: เริ่มด้วย claude agents สั่งงานหลายอันขนาน เข้า session ด้วย enter หรือส่ง prompt ด้วย space"], "takeaways_th": ["ตั้ง remote control ให้เปิดตลอดใน settings.json แล้วลองสั่งงานจากมือถือ", "ลอง /tui fullscreen ถ้า terminal กระพริบตอนใช้ session ยาว และตั้งเป็นค่าเริ่มต้นได้", "ใช้ claude --worktree เมื่อรันหลาย Claude บน repo เดียวกัน และเปิด auto mode กับงานยาวที่ไม่อยากถูกขัดจังหวะ", "ตรวจ memory ที่ Claude จดไว้ด้วย /memory เป็นระยะ", "ลองตั้ง routine เล็ก ๆ เช่น triage issue หรือรีวิว PR ผ่าน GitHub event แล้วค่อยขยาย"], "caveats_th": ["Transcript มาจาก Whisper large-v3 ที่ถอดเอง: 'Cloud' = Claude, 'Entropic' = Anthropic; ชื่อผู้พูด 'Ralph' มาจากที่เขาแนะนำตัว ไม่มีนามสกุล", "ชื่อคำสั่งฟังจากเสียง: 'remote control' (น่าจะเป็น /remote-control ตามคลิป 23), 'T-U-I' + fullscreen, 'ultra-review', 'Cloud dash dash work tree' (--worktree) ควรเทียบกับ docs/changelog จริงก่อนใช้", "ชื่อ repo ในเดโมเพี้ยน ('Scolidro'/'Scaledraw' น่าจะเป็น fork ของ Excalidraw ผู้เขียนสรุปไม่แน่ใจ) และ 'Posh MP review' คือ routine ตลกในเดโม", "ผู้พูดบอกว่า agent view อยู่ใน public preview ขณะที่ routines เป็น research preview สถานะนี้อาจเปลี่ยนไปแล้ว", "ข้ออ้างเรื่องประสิทธิภาพ code review (ชั่วโมงเหลือนาที) เป็นของผู้พูด ไม่มีตัวเลข benchmark"], "related_existing": ["claude-code-changelog", "claude-code-background-agents", "claude-code-automation", "claude-code-surfaces", "claude-code-sessions"], "dur": "32:04", "url": "https://www.youtube.com/watch?v=sRvUXLquiRg", "asr": "whisper", "wiki": "cwc-london-24"}, {"n": 25, "id": "19HDQ9HppOA", "title_en": "Ship your first Managed Agent", "title_th": "เวิร์กชอปสร้าง incident-investigator agent ตัวแรกบน Claude Managed Agents", "speakers": [{"name": "Isabella He", "role": "Member of technical staff, Applied AI team, Anthropic (ชื่อจาก auto-caption)"}], "track": "workshop", "tags": ["managed-agents", "devex", "agent-reliability", "cloud-platforms"], "tldr_th": "เวิร์กชอปพาสร้าง SRE agent ที่สืบสวน incident ได้จริงบน Claude Managed Agents โดยประกอบจาก primitive 4 ตัว คือ agent, environment, session และ event stream พร้อม local tools ผู้พูดเน้นว่า agent loop รันฝั่ง server ส่วน tool รันที่ไหนก็ได้ เลยข้ามงาน hosting กับ durability ไปได้ แล้วจบด้วยแผนที่ฟีเจอร์ถัดไป เช่น subagents, memory, outcomes, vaults", "tldr_en": "A hands-on workshop building an SRE incident-investigator agent on Claude Managed Agents from agent, environment, session and event streaming primitives, plus local tools, with the agent loop running server-side.", "audience_th": "นักพัฒนาที่เคยเรียก Claude API มาบ้าง อยากเห็นว่า Managed Agents ประกอบกันยังไงตั้งแต่ศูนย์ (ใช้ Python กับ Streamlit)", "points": [{"th": "ผู้พูดเล่าลำดับวิวัฒนาการ Messages API (ได้แค่ tokens in/out ต้องทำ context management, agent loop, compaction เอง) มา Agent SDK (ยังต้อง host และ scale เอง) แล้วมาเป็น Claude Managed Agents ที่ Anthropic ดูแล harness, sandboxing, observability, tool runtime ให้", "en": "Evolution from Messages API to Agent SDK to Managed Agents, where Anthropic hosts the harness, sandboxing, observability and tool runtime."}, {"th": "เหตุผลที่ harness ต้องวิวัฒนาการตาม agent: ตอนใช้ Sonnet 4.5 เจอพฤติกรรม context anxiety (Claude รีบจบงานทั้งที่ context ยังเหลือ) ต้องใส่ mitigation ใน harness พอ Opus 4.5 ออกมาพฤติกรรมนี้หายไป งานที่ทำไว้เลยล้าสมัย", "en": "Harnesses must evolve with models: mitigations for Sonnet 4.5 context anxiety became obsolete with Opus 4.5."}, {"th": "ทรัพยากรหลัก 3 อย่าง: agent (persona + ความสามารถ: model, system prompt, MCP, skills) เปรียบเป็นสมอง, environment (container ที่ลงมือทำงาน) เปรียบเป็นมือ, session ผูกสองอย่างเข้าด้วยกันแล้ว stream event กลับมา", "en": "Three resources: agent (brain), environment (hands), session (binds them and streams events)."}, {"th": "การแยกมือออกจากสมอง (decouple agent loop จาก tool execution) ช่วยเรื่อง credentials กับ security และลด latency เพราะไม่ต้อง spin up container ทุก session ผู้พูดอ้างว่า TTFT ที่ P95 ลดลงเกิน 90%", "en": "Decoupling the loop from tool execution helps credential security and latency; speaker claims over 90% P95 TTFT reduction."}, {"th": "ภาคปฏิบัติทำใน agent.py ทีละขั้น: สร้าง agent (SRE agent, Opus 4.7, system prompt สั้นๆ, tools) แล้ว environment (cloud, networking แบบ unrestricted หรือจำกัดเป็น allow list) แนบไฟล์ log ผ่าน files API ผูกทุกอย่างเข้า session แล้ว stream event", "en": "Workshop builds agent, environment, uploaded log file, session binding and event streaming step by step."}, {"th": "session ทำงานเป็นหน่วย event (user message, tool call, agent response) ไม่ใช่ request/response ทำให้ log ได้ stream ให้ผู้ใช้เห็นทีละส่วนได้ และ resume ได้ง่าย ถ้า container ล้มก็ spin ใหม่โดยไม่ต้องเริ่ม agent loop ใหม่", "en": "Sessions work in events rather than request/response, enabling logging, streaming, easy resume and container replacement without restarting the loop."}, {"th": "agent บน server รู้จัก local tools (get metrics, get recent deploys, get diff) ผ่านโค้ดฝั่งเรา ผลลัพธ์ในเดโม agent สืบจนได้สาเหตุเป็น database pool exhaustion จาก commit ที่ refactor order summary builder พร้อมคำแนะนำ ผู้พูดบอกว่าย้าย tool ไปใช้ Datadog จริงได้ด้วย wire protocol เดิม", "en": "Local tools run on our side; the demo agent diagnosed DB pool exhaustion from a refactor commit, and tools could be swapped for e.g. Datadog."}, {"th": "state ของ session (idle, running, rescheduling, terminated) ช่วยให้ resume ได้และรับ webhook เพื่อปลุก session ตาม event ภายนอกได้ ข้อมูลอยู่บน cloud จึงไม่ต้องทำ database เอง และลบ session ได้ถ้าไม่อยากให้เก็บ", "en": "Session states (idle, running, rescheduling, terminated) support resume and webhook-triggered runs; data persists in the cloud and sessions can be deleted."}, {"th": "ฟีเจอร์ต่อยอดที่ผู้พูดไล่ให้: skills, subagents (orchestrator + context window แยก), memory กับ dreaming, outcomes (กำหนด rubric ผลลัพธ์), vaults (เก็บ credentials เข้ารหัสแยกจากที่ agent เข้าถึง), webhooks, permission policies, MCP server controls และ console agent builder", "en": "Roadmap features: skills, subagents, memory and dreaming, outcomes, vaults, webhooks, permission policies, MCP controls, console agent builder."}], "numbers": [{"th": "ผู้พูดอ้างว่าทีมต่างๆ สร้างถึง production ได้เร็วขึ้น 10 ถึง 15 เท่าด้วย Claude Managed Agents"}, {"th": "ผู้พูดอ้างว่า time to first token ที่ P95 ลดลงเกิน 90% หลังแยก agent loop ออกจาก tool execution"}, {"th": "โมเดลในเดโม: Claude Opus 4.7 (ใช้กับ SRE agent)"}, {"th": "ตัวอย่าง incident ในเดโม: P99 latency สูงกว่า baseline ประมาณ 10 เท่า"}, {"th": "ตัวอย่าง context anxiety: เกิดกับ Sonnet 4.5 และหายไปใน Opus 4.5"}, {"th": "เวิร์กชอปเป็นคลิป 37:09 และบอกว่า agent ทั้งหมดทำได้ใน six functions ตามคำอธิบายคลิป"}], "quotes": [{"text": "Claude managed agent has the agent loop run server side", "th": "Claude Managed Agents รัน agent loop ฝั่ง server"}, {"text": "instead of responding in tokens in and tokens out, it actually works in units of events", "th": "แทนที่จะตอบเป็น tokens เข้า tokens ออก มันทำงานเป็นหน่วย event"}, {"text": "You want to give the agent the same access to the materials that you would have as a human developer", "th": "ควรให้ agent เข้าถึงเอกสารเหมือนที่นักพัฒนาคนหนึ่งเข้าถึง"}], "steps": ["เตรียมเครื่อง: git clone repo เวิร์กชอป แล้ว cd เข้าโฟลเดอร์ ship your first managed agent, สร้าง virtual env (Python), ติดตั้ง requirements, ก๊อป env key ใส่ไฟล์ .env ด้วย Anthropic API key", "รันแอปด้วย streamlit run app.py แล้วเปิด URL ที่ได้", "เปิด agent.py (ฉบับว่าง) เทียบกับ agent complete แล้วก๊อปทีละส่วนจากฉบับเสร็จมาใส่", "ขั้น 1 agent: นิยาม SRE agent ด้วย model Claude Opus 4.7, system prompt สั้นๆ (บอกว่าเป็น SRE agent ที่ debug incident), และ tools เช่น metrics, recent deployments, get diff, fetch logs", "ขั้น 2 environment: กำหนด environment บน Anthropic cloud และ networking แบบ unrestricted (เปลี่ยนเป็น allow list จำกัด URL ได้)", "ขั้น 3 อัปโหลดไฟล์ metrics/logs เข้า agent ผ่าน files API เพื่อให้ agent รันโค้ดประมวลผลไฟล์", "ขั้น 4 session: ผูก agent ID, environment ID และ resources (ไฟล์ log ที่ mount)", "ขั้น 5 stream events: รับ event (user message, tool call, agent response) กลับมาแสดงผลทีละส่วน", "ขั้น 6 local tools: ต่อ handler ฝั่งเครื่องเราให้ get metrics, get recent deploys, get diff แล้วเพิ่มปุ่ม delete session", "ทดสอบ: new session แล้วสั่ง debug my incident ดู tool call ที่ stream เข้ามา จนได้ root cause และ recommended actions", "ลอง hard refresh เพื่อเห็นว่า session ยังอยู่บน cloud, ลบ session, และดูสถานะ idle กับ running แล้วถามต่อใน session เดิม (เช่น Who are you?)"], "takeaways_th": ["ถ้าจะทำ agent ใหม่ ลองแยกคิดเป็น agent (สมอง) กับ environment (มือ) กับ session ก่อนลงมือ จะวางตำแหน่ง tool ได้ชัดขึ้น", "ให้ข้อมูลกับ agent ให้มากที่สุดผ่านไฟล์ (files API) ผู้พูดมองว่า context engineering คือที่ที่นักพัฒนาควรใช้เวลา", "ออกแบบ UI ให้ stream event ตั้งแต่ต้น ทั้งเพื่อประสบการณ์ผู้ใช้และเพื่อ observability", "เริ่มด้วย local tool ที่อ่าน JSON ก่อน แล้วค่อยสลับเป็นระบบจริง เช่น Datadog ทีหลัง", "ถ้าทำ SRE agent จริง ลองเพิ่ม skill ที่ถือ runbook และ postmortem เก่า เหมือนที่คนใช้ตอน debug"], "caveats_th": ["ชื่อผู้พูด Isabella He มาจาก auto-caption อาจสะกดผิด", "Transcript ไม่มีโค้ดบนจอ ชื่อ API และ function จริงจับได้จากคำพูดเท่านั้น (ที่ได้ยินชัดคือ agent.py, app.py, streamlit run, files API, get metrics, get recent deploys, get diff) คำอธิบายคลิปบอกว่าใช้ six functions แต่ผู้พูดไม่ได้ไล่ชื่อ function ทั้งหกออกเสียง", "ผู้พูดบอกว่าเพิ่งประกาศ bring your own containers/compute และ MCP tunnels เมื่อวันก่อนหน้า ไม่มีรายละเอียดเพิ่มในคลิป", "ตัวเลข 10 ถึง 15 เท่า และ 90% เป็นข้ออ้างของผู้พูด ไม่มีที่มาหรือเงื่อนไขการวัดในคลิป", "ในเดโมจริง session ค้างและต้องลองใหม่ ผลลัพธ์สุดท้ายสำเร็จ"], "related_existing": ["harness-engineering", "long-horizon-agents", "agent-skills", "claude-code-subagents", "context-management"], "dur": "37:09", "url": "https://www.youtube.com/watch?v=19HDQ9HppOA", "asr": "yt-captions", "wiki": "cwc-london-25"}, {"n": 26, "id": "mWvtOHlZM-I", "title_en": "Tool, skill, or subagent? Decomposing an agent that outgrew its prompt", "title_th": "แยก agent ที่ prompt บวมให้ลงตัว: อะไรควรเป็น tool, skill หรือ subagent", "speakers": [{"name": "Will", "role": "Engineering team, Applied AI, Anthropic (ได้ยินแค่ชื่อต้น)"}], "track": "workshop", "tags": ["managed-agents", "evals", "mcp-tools-skills", "subagents", "agent-reliability"], "tldr_th": "เวิร์กชอปรับช่วง StockPilot ซึ่งเป็น inventory agent ที่ system prompt บวมถึง 400 บรรทัดและ eval ตก แล้วค่อยๆ แยกใหม่บน Claude Managed Agents โดยย้าย business logic ไปเป็น skills ลด tool เหลือ bash/read/write และเก็บ subagent ไว้เฉพาะ forecasting ผู้พูดรายงานว่าคะแนน eval ไต่ถึงราว 92% พร้อมใช้ token และต้นทุนน้อยลง", "tldr_en": "Decomposing a bloated 400-line-prompt inventory agent on Managed Agents: logic into skills, tools down to bash/read/write, one native subagent kept, hill-climbing evals to about 92%.", "audience_th": "คนที่มี agent ใช้งานจริงแล้ว prompt กับ tool ยาวขึ้นเรื่อยๆ และกำลังสงสัยว่าควรแยกส่วนไหนเป็นอะไร (ควรรู้จัก skills, subagents, evals มาบ้าง)", "points": [{"th": "ปัญหาที่พบบ่อย: agent ที่ใช้ได้ดี พอเพิ่มความต้องการทีละนิด prompt ก็ยาวเป็นหลายร้อยบรรทัด มี tool กับ subagent เป็นโหล แล้ว performance ที่เคยดีก็ถดถอย StockPilot ตัวอย่างมี prompt ราว 400 บรรทัด 12 tools (3 ตัวเป็น wrapper ของ subagent)", "en": "Agents accumulate requirements: StockPilot had a 400-line prompt and 12 tools, 3 of them wrapping subagents, and regressed."}, {"th": "eval suite มี 12 งาน 5 ชนิด grader (รหัส R = regression งาน single-turn, F = failure mode งาน multi-turn) ผสม deterministic (turn count, latency, token) กับ LLM-as-judge (tone, คุณภาพ output) ผู้พูดทำ triage ผล eval ด้วย Claude Code ได้สาเหตุเป็นกลุ่มๆ", "en": "12 evals, R for regression and F for failure mode, deterministic plus LLM-judge graders, triaged with Claude Code."}, {"th": "รากของความล้มเหลวคือ context ไม่ใช่โมเดล เช่น R8 ที่ agent ดึง promo multiplier ถูก (3.1x) แต่ตอนคำนวณกลับใช้ 1.35 เพราะ policy สองจุดใน prompt ขัดกัน, F1 ไปถึงคำตอบถูกแต่ทางอ้อม, F2 พังที่การสื่อสารระหว่าง subagent กับ orchestrator", "en": "Failures were context problems: contradictory policies in the prompt, inefficient paths, and subagent-orchestrator communication breakdown."}, {"th": "ขั้น skills: เอา policy กับ procedure ออกจาก system prompt ไปเป็น skills เพื่อ progressive disclosure ผู้พูดบอกว่า prompt เหลือสั้นลงมาก และหลักคือ system prompt เก็บเฉพาะสิ่งที่ Claude ต้องรู้ทุกงาน ส่วนที่ใช้บางงานให้เป็น skill", "en": "Move policies into skills for progressive disclosure; keep only always-needed information in the system prompt."}, {"th": "ขั้น tools: เริ่มจาก primitive แบบมนุษย์ (code execution, file system, web search, to-do list) แล้วเพิ่ม custom tool เมื่อจำเป็น อย่ารีบไป MCP ให้ใช้ MCP เมื่อมีชุด tool ที่หลาย client ใช้ร่วมกันและต้อง govern ใน Managed Agents primitive พวกนี้มีให้ในตัว", "en": "Start with Claude-Code-like primitives, then custom tools; reserve MCP for shared governed toolsets. Managed Agents ships the primitives built in."}, {"th": "ผลของการให้ code execution แทนอ่าน CSV เข้า context: token ต่อ task ลดจากกว่า 200,000 อย่างมาก ต้นทุนและเวลารันก็ลด ผู้พูดเตือนว่าไม่ได้ดีขึ้นทุกกรณี บางเคสอาจถดถอย", "en": "Letting the agent write and run code instead of reading CSVs cut tokens from over 200k, plus cost and time, though not always."}, {"th": "ขั้น subagents: ใช้ในสองกรณีหลัก คือ (1) ต้องการ Claude หลายตัวช่วยขนานกัน เช่น research, code exploration (2) ต้องการสายตาใหม่ที่ไม่มี context เดิม เช่น code review และ forecasting ใน StockPilot ซึ่งถูกเก็บไว้เป็น subagent เดียว ใช้ callable agents แบบ native ของ Managed Agents แทนการห่อเป็น tool", "en": "Subagents for parallelism or a fresh perspective; only forecasting kept, via Managed Agents native callable agents for observability."}, {"th": "ผู้พูดบอกว่าหลายลูกค้ากำลังยุบ subagent กลับเข้า orchestrator เพราะโมเดลระดับ frontier จัดการข้อมูลได้มากขึ้นแล้ว", "en": "Many customers are folding subagents back into the main agent as frontier models handle more."}, {"th": "สถาปัตยกรรมปลายทาง: orchestrator เดียวบน Managed Agents, 3 tools (bash, read, write), system prompt ราว 15 บรรทัด, business logic อยู่ใน skills, subagent forecasting หนึ่งตัว และ eval ไต่ขึ้นราว 92% จากหลักคิด hill climbing (วัด baseline แก้ architecture รัน eval ซ้ำ) พร้อมเตือนให้ปรับ eval ตามความสามารถที่เพิ่มขึ้น", "en": "Final: one orchestrator, bash/read/write, ~15-line prompt, skills, one subagent, ~92% evals; keep evals updated as capability grows."}], "numbers": [{"th": "ก่อนแก้: system prompt ราว 400 บรรทัด, 12 tools (3 ตัวคือ wrapper ของ subagent)"}, {"th": "คะแนน eval ตั้งต้นที่ผู้พูดบอกในสไลด์ราว 83% แต่ตอนรันจริงในเดโมได้ 62% (ผ่าน 7 จาก 12)"}, {"th": "ระหว่างทาง: prompt จาก 400 บรรทัดเหลือราว 50 บรรทัด พอจบสุดเหลือราว 15 บรรทัด"}, {"th": "หลังแก้: tools เหลือ 3 (bash, read, write) และคะแนน eval ราว 92%"}, {"th": "token ต่อ task ก่อนแก้เกิน 200,000 แล้วลดลงมากหลังให้ code execution (ผู้พูดไม่ได้อ่านตัวเลขหลังแก้ชัดเจน)"}, {"th": "ตัวอย่างบั๊ก R8: baseline 12 units ต่อวัน, promo multiplier 3.1x แต่ agent คำนวณด้วย 1.35"}, {"th": "ผู้พูดใช้ Opus 4.7 กับ effort ระดับ extra high ใน Claude Code เป็นค่าประจำ"}], "quotes": [{"text": "Leave the system prompt only for the information that Claude needs in its mind, regardless of the task that you give it", "th": "system prompt เก็บเฉพาะสิ่งที่ Claude ต้องรู้ไม่ว่าจะได้งานอะไร"}, {"text": "whenever we build agents, we lean into human-like primitives first", "th": "เวลาสร้าง agent เราเริ่มจาก primitive แบบมนุษย์ก่อนเสมอ"}, {"text": "it's important to make sure that your evals are updated as your product capability expands", "th": "ต้องอัปเดต eval ให้ทันตามความสามารถของผลิตภัณฑ์ที่เพิ่มขึ้น"}], "steps": ["clone repo เวิร์กชอป เข้าโฟลเดอร์ agent decomposition แล้วรัน uv sync", "ก๊อป env example เป็นไฟล์ .env แล้วใส่ API key จาก Claude console", "รัน baseline ด้วย uv run evals --agent before (agent ฉบับ Messages API ในโฟลเดอร์ before)", "ถ้าอยากดูฉบับ Managed Agents ให้ดูโฟลเดอร์ starter และ deploy ด้วย uv run deploy starter", "ใช้ Claude Code รัน eval แล้วให้ช่วย triage หาสาเหตุเป็นธีม (โมเดลทำงานที่ควรเป็น tool, โครงสร้าง output ไม่ถูกบังคับ, policy ขัดกันใน prompt)", "ขั้น skills: ให้ Claude วิเคราะห์ agent.py และย้ายส่วนของ system prompt ไปเป็น skills", "ขั้น tools: ยุบ tool เฉพาะกิจ เหลือ primitive (bash, read, write) แล้ว redeploy ไป Managed Agents", "รัน eval ซ้ำ (เช่น F1) เพื่อเทียบ token, cost, เวลา ก่อนและหลัง", "ขั้น subagents: ถอด wrapper-subagent ที่ไม่จำเป็น เก็บ forecasting ไว้ แล้วเปลี่ยนมาใช้ callable agents ของ Managed Agents", "ทบทวนสถาปัตยกรรมสุดท้ายและคะแนน eval รอบสุดท้าย"], "takeaways_th": ["ถ้า system prompt ยาวเกินร้อยบรรทัด ลองแยกกฎที่ใช้เฉพาะบางงานไปเป็น skills ก่อน แล้ววัด eval เทียบ", "ก่อนเขียน custom tool ใหม่ ถามว่า bash กับ file system ทำแทนได้ไหม โดยเฉพาะงานวิเคราะห์ข้อมูล", "ใช้ MCP เมื่อมีหลาย client ต้องใช้ชุด tool เดียวกันและต้อง govern เท่านั้น", "ใช้ subagent เมื่อต้องการขนานหรือต้องการสายตาใหม่ที่ไม่ปนกับ context หลัก และดูการสื่อสารระหว่าง orchestrator กับ subagent เป็นจุดเสี่ยง", "ตั้ง eval เป็น baseline ก่อนแก้ทุกครั้ง แก้ทีละอย่างแล้วรันซ้ำ และให้ Claude Code ช่วย triage ผล"], "caveats_th": ["ชื่อผู้พูดได้ยินแค่ Will ไม่มีนามสกุล", "ตัวเลขคะแนน eval ตั้งต้นไม่ตรงกัน: สไลด์พูดราว 83% แต่เดโมได้ 62% (7 จาก 12) ต้องอ้างทั้งสองค่าตามที่ผู้พูดบอก", "ผู้พูดบอกก่อนว่าใช้ sub agent สามตัวเป็น tool และพูดว่า prompt เหลือราว 50 บรรทัดระหว่างทางกับราว 15 บรรทัดตอนสุดท้าย ตัวเลขตามคำพูดจาก ASR", "ตัวเลข token หลังแก้ไม่ได้อ่านออกเสียง รู้แค่ว่าลดลงมาก", "เวิร์กชอปเกี่ยวกับ callable agents ของ Managed Agents ผู้พูดไม่ได้อธิบายพารามิเตอร์ API", "ผลทั้งหมด (92%, ลด token) เป็นผลของเดโมกรณีเดียว ผู้พูดเตือนเองว่าไม่ได้ดีขึ้นทุกครั้ง"], "related_existing": ["agent-skills", "claude-code-subagents", "multi-agent-patterns", "context-management", "harness-engineering"], "dur": "45:06", "url": "https://www.youtube.com/watch?v=mWvtOHlZM-I", "asr": "yt-captions", "wiki": "cwc-london-26"}, {"n": 27, "id": "dxqX_6ciVQA", "title_en": "Agent Battle: Mine the most diamonds in 45 minutes", "title_th": "Agent Battle: แข่งสร้าง agent ขุดเพชรใน Minecraft ด้วย Managed Agents", "speakers": [{"name": "Ben", "role": "Applied AI team, Anthropic"}, {"name": "Jeff", "role": "Applied AI team, Anthropic"}], "track": "workshop", "tags": ["managed-agents", "evals", "agent-reliability", "mcp-tools-skills"], "tldr_th": "เวิร์กชอปแข่งขันสั้นๆ ที่ผู้เข้าร่วมแต่ง Claude managed agent ให้เล่น Minecraft ขุดเพชร ผ่าน Mineflayer bot กับ MCP tools แล้วแข่งกันบน leaderboard ในเวลา 35 นาที ตัดสินที่จำนวนเพชร และตัดเสมอด้วยอัตราเพชรต่อ token ผลที่ได้ยินคือมีคนขุดได้ 19 เพชรหลายคน และมีคนทำเกิน 19 ก่อนหมดเวลา", "tldr_en": "A short in-room competition where participants tune a Claude managed agent to mine diamonds in a Minecraft clone via a Mineflayer bot; ranked by diamonds, tie-broken by token efficiency; 19 diamonds was the common top score and one run beat it.", "audience_th": "คนที่อยากเห็นตัวอย่างการจัด eval แบบแข่งขัน และการปรับ system prompt, model, skill, MCP ของ managed agent เพื่อ hill climb", "points": [{"th": "ผู้จัดคือ Ben กับ Jeff จาก Applied AI ที่ Anthropic เป้าหมาย 3 อย่าง: เรียนรู้การสร้างและ deploy managed agent ที่โฮสต์บนโครงสร้างของ Anthropic, เข้าใจผลของ agent configuration (system prompt, model string, skills, MCP) และฝึก hill climb บน evals", "en": "Three goals: build/deploy a managed agent, understand configuration impact, practice hill-climbing on evals."}, {"th": "กติกา: จับเวลาราว 35 นาทีให้สร้างและทดลอง ส่งกี่รอบก็ได้แต่นับรอบที่ดีที่สุดเพียงรอบเดียวต่อคน แต่ละรอบ agent ขุดเพชร 5 นาที หยุดกลางคันได้ด้วย Ctrl-C", "en": "About 35 minutes; best single run counts; each run is 5 minutes; Ctrl-C to stop."}, {"th": "มี eval set ที่รันราว 1 นาทีไว้ให้ปรับ agent อย่างรวดเร็ว ผู้ชนะคือคนที่ได้เพชรมากสุดเมื่อครบเวลา", "en": "A roughly one-minute eval set for quick iteration; most diamonds wins."}, {"th": "กติกาตัดเสมอใช้ token efficiency คืออัตราเพชรต่อ token ผู้จัดย้ำว่าไม่ใช่แค่ขุดให้ได้มากสุด และไม่ควรโยนโมเดลหนักสุดใส่ แต่ต้องปรับ system prompt ให้แหลม", "en": "Ties are settled on diamonds-to-tokens ratio, so prompt tuning matters over raw model size."}, {"th": "harness: Minecraft clone ที่เชื่อมกับ Mineflayer bot ไม่ใช้ภาพ มี MCP tools เช่น mine block, jump, go near; ทุกคนเริ่มจาก seed และ start kit เดียวกัน; แก้ไขที่ myagent.py ในรีโป /agentbattle ได้แก่ model, system prompt (เริ่มต้นว่างเปล่า), skill ที่ Anthropic ส่งมาให้หรือใส่เอง และมี MCP server ให้ปรับ", "en": "Mineflayer-based Minecraft clone with MCP tools; same seed; tune model, system prompt, skill, and MCP in myagent.py."}, {"th": "ในรีโปมี Claude Code skill ช่วย setup และมีปัญหา Cloudflare จาก Wi-Fi งานที่คนเข้าเยอะ ผู้จัดแปะคำสั่งแก้ที่ได้ผลกับอย่างน้อยหนึ่งคน", "en": "A Claude Code setup skill was provided; conference Wi-Fi caused Cloudflare connection problems."}, {"th": "ระหว่างแข่ง: เริ่มมีรอบแรกที่ได้ 10, เหลือราว 5 นาทีเสมอกันสามทาง และคนแรกแสดง 0 token ซึ่งน่าสงสัย ผู้จัดบอกว่า 19 น่าจะเป็นเพดานของที่ทำได้ แต่ก่อนหมดเวลา 1 นาที 20 วินาทีมีคนทำเกิน 19", "en": "Early score 10; three-way tie near the end; a zero-token entry looked suspicious; someone broke 19 with 1:20 left."}, {"th": "ผลสรุป: ผู้ชนะชัดเจนหนึ่งคน คนที่ขุดได้ 19 ให้มาหา Ben กับ Jeff และเนื่องจากอันดับสองแสดง 0 token ผู้จัดยังตัดสินอันดับสองกับสามไม่ได้ จึงเรียกอันดับ 1 ถึง 5 ขึ้นมา โดยยังไม่ประกาศรางวัล", "en": "One clear winner; 19-diamond miners asked to come forward; second/third undecided due to a zero-token entry."}], "numbers": [{"th": "เวลาแข่งราว 35 นาที (ชื่อคลิปบอก 45 นาที)"}, {"th": "แต่ละรอบ agent ขุด 5 นาที; eval set รันราว 1 นาที"}, {"th": "รอบแรกที่เห็นบน leaderboard ได้ 10 เพชร"}, {"th": "19 เพชร ถูกเรียกว่าน่าจะเป็นเพดาน และมีคนทำเกิน 19 เมื่อเหลือ 1 นาที 20 วินาที (ไม่ได้ยินตัวเลขสุดท้าย)"}, {"th": "ตัดเสมอด้วยอัตราเพชรต่อ token"}], "quotes": [{"text": "So, this is not just mine the most diamonds. It is get the best diamonds-to-tokens ratio.", "th": "ไม่ใช่แค่ขุดเพชรให้มากสุด แต่ต้องได้อัตราเพชรต่อ token ที่ดีที่สุด"}, {"text": "Seems like 19 might be the upper echelon of what's possible.", "th": "ดูเหมือน 19 อาจเป็นระดับสูงสุดที่ทำได้"}, {"text": "because our second place has zero tokens, we don't know who actually won second and third place yet", "th": "เพราะอันดับสองแสดง token เป็นศูนย์ เลยยังไม่รู้ว่าใครได้อันดับสองกับสาม"}], "steps": ["เข้ารีโป /agentbattle แล้วเปิดไฟล์ myagent.py", "ปรับ model, system prompt (เริ่มต้นว่าง), skill ที่ให้มา หรือ skill ของตัวเอง และ MCP server ถ้าต้องการ", "ใช้ Claude Code skill ในรีโปช่วย setup ถ้าติดปัญหา", "รัน eval ราว 1 นาทีเพื่อ iterate เร็ว แล้วส่ง run เต็ม 5 นาที (หยุดด้วย Ctrl-C ได้)", "ดู leaderboard และแชตที่ agent คุยกัน; ส่งได้หลายรอบแต่นับรอบที่ดีที่สุดรอบเดียว", "เมื่อหมดเวลาประกาศผล ตัดเสมอด้วย diamonds-to-tokens ratio"], "takeaways_th": ["ตั้ง eval ที่เร็ว (ราว 1 นาที) ไว้ก่อน แล้ว hill climb ที่ system prompt/model/skill ทีละอย่าง", "ตั้งเมตริกตัดสินที่รวมประสิทธิภาพ (เพชรต่อ token) ไม่ใช่แค่ผลลัพธ์ดิบ เพื่อไม่ให้ชนะด้วยการโยนโมเดลหนักสุด", "ใช้ seed และ start kit เดียวกันเพื่อให้เทียบ config ได้เป็นธรรม", "ตรวจค่า token ที่ผิดปกติ (เช่น 0 token) ก่อนเชื่อผล leaderboard"], "caveats_th": ["transcript ไม่ได้ระบุชื่อผู้เข้าแข่งหรือคะแนนของแต่ละคน มีแค่ตัวเลข 10 และ 19 ที่ได้ยิน จึงไม่ทราบว่าใครชนะหรือคะแนนผู้ชนะเกิน 19 เท่าไร", "ชื่อคลิประบุ 45 นาที แต่ผู้พูดพูดว่าจับเวลาประมาณ 35 นาที", "ไม่ได้ยินคำสั่งแก้ปัญหา Cloudflare เพราะผู้พูดบอกว่าแปะไว้บนจอ", "ผู้พูด Ben กับ Jeff ได้ยินจากการแนะนำตัว แต่ transcript ไม่แยกว่าใครพูดช่วงไหน", "ASR เขียน 'MCV server' ในส่วน Jeff น่าจะหมายถึง MCP server และ 'CloudFlare' อาจเป็นชื่อบริการเครือข่ายที่ติดขัด ไม่ใช่ตัว agent", "ที่ว่า 'Minecraft clone' มาจากคำพูดของผู้พูด ไม่ได้ยืนยันว่าเป็น Minecraft ตัวจริง"], "related_existing": ["claude-agent-sdk", "coding-agents-execution-layer"], "dur": "8:45", "url": "https://www.youtube.com/watch?v=dxqX_6ciVQA", "asr": "yt-captions", "wiki": "cwc-london-27"}, {"n": 28, "id": "v9FTCvkV_a0", "title_en": "Evals for taste: Hill-climbing a slide-generation agent", "title_th": "สร้าง eval ให้ agent ทำสไลด์ แล้วไต่คุณภาพขึ้นทีละรอบ", "speakers": [], "track": "workshop", "tags": ["evals", "agent-reliability", "prompt-engineering", "model-selection"], "tldr_th": "เวิร์กชอปพาสร้าง eval ให้ agent สร้างสไลด์ PowerPoint ตั้งแต่ code grader ง่ายๆ ไปจนถึง model judge แล้วใช้คะแนนที่ได้วนปรับ system prompt และเพิ่ม QA loop จนคุณภาพดีขึ้น ผู้พูดย้ำว่า eval ต้องเป็นของที่มีชีวิต ต้อง calibrate grader ต่อเนื่อง ไม่ใช่ตั้งครั้งเดียวแล้วเชื่อตลอด", "tldr_en": "A workshop on building evals for a slide-generation agent: code graders and LLM judges drive a prompt/QA-loop iteration cycle, with the warning that graders must be calibrated and kept alive.", "audience_th": "คนที่กำลังสร้าง agent และอยากรู้ว่า eval ควรวัดอะไร ออกแบบ grader อย่างไร ไม่ต้องมีพื้นมาก่อน", "points": [{"th": "Eval คือชุดทดสอบเชิงระบบที่วัดว่า AI ทำงานในโดเมนเฉพาะได้ดีแค่ไหน ช่วยแปลงความรู้สึกว่า 'วันนี้แย่ลงนะ' ให้เป็นสิ่งที่ลงมือแก้ได้ benchmark ทั่วไปอย่าง SWE-bench บอกเรื่องของคุณได้น้อย จึงควรสร้าง eval ของตัวเอง", "en": "Evals are systematic tests for a specific use case; they turn vibes into actionable signal, and generic benchmarks say little about your own system."}, {"th": "ไม่มี eval จะบินตาบอด ต้องรอลูกค้าบ่นแล้วค่อยตามแก้ แก้จุดหนึ่งอาจทำอีกจุดพัง และยืนยันไม่ได้ว่าดีขึ้นหรือถดถอย ส่วนมี eval แล้วต้องนิยาม 'ความสำเร็จ' ออกมาชัด ย้ายไปโมเดลใหม่ได้เร็วขึ้น และเห็นปัญหาก่อนปล่อย", "en": "Without evals you only catch issues in production and cannot verify improvements; with them you must define success and can adopt new models faster."}, {"th": "Grader มีสามแบบ code-based (เร็ว ถูก deterministic แต่เปราะและไม่มี nuance) model-based (rubric, pairwise comparison, multi-judge consensus ยืดหยุ่นแต่ non-deterministic และแพงกว่า) และ human grader (คุณภาพสูงสุดแต่แพงและช้าที่สุด ใช้ spot check/AB testing)", "en": "Three grader types: code-based, model-based (rubric, pairwise, multi-judge consensus), and human, each with clear trade-offs."}, {"th": "ใน repo เวิร์กชอป agent นิยามด้วย agent.yaml (Managed Agents) code grader นับ emoji, จำนวนสไลด์, สไลด์ที่แน่นเกิน, ฟอนต์เล็ก, text-heavy ส่วน judge ให้คะแนน 0-5 ด้าน text, image, layout, color หลักคิดคือ grader ที่ไม่ให้ข้อมูลที่ลงมือแก้ได้ ไม่ควรอยู่ใน eval", "en": "The repo defines code graders (emoji count, slide count, clutter, small fonts) and 0-5 LLM judges; a grader that yields no actionable info shouldn't be kept."}, {"th": "วงไต่คุณภาพ ดูผลสไลด์กับคะแนน แล้วแก้ system prompt ตามจุดที่พลาด (ขนาดตัวอักษร layout ห้าม emoji ห้ามเส้น accent บางๆ แบบ AI tell) แล้วรันใหม่ รอบหนึ่ง emoji count พุ่งเป็น 20 ทั้งที่ผู้พูดไม่เห็นในสไลด์ แปลว่า grader ยังนิยามไม่ดี จึงต้องมนุษย์ตรวจควบคู่", "en": "Iterate by reading the deck and scores, then editing the system prompt; one run's odd emoji count showed the grader itself was miscalibrated."}, {"th": "เพิ่มข้อกำหนดว่าทุกสไลด์ต้องมีไดอะแกรมหรือกราฟเป็นภาพจริง แล้วเพิ่ม QA loop ที่สั่ง agent ให้ 'assume there are problems' ทำ QA เหมือนล่าบั๊ก แปลงสไลด์เป็นภาพ ตรวจทุกหน้า แก้ render ใหม่ อย่างน้อยหนึ่งรอบ คะแนน judge ขยับไปราว 4.2-4.4", "en": "Requiring a chart per slide and an adversarial QA loop (render, inspect, fix, re-render) lifted judge scores to roughly 4.2-4.4."}, {"th": "ลองสลับเป็น Opus 4.7 กับ prompt เริ่มต้นสั้นๆ ผลดีกว่า Sonnet อย่างเห็นได้ชัด แทบไม่ใช้ emoji แต่คะแนน judge สูงลิ่วทั้งที่บางรอบไม่มีภาพเลย ผู้พูดชี้ว่า rubric ไม่มีจุดยึด (ไม่มีตัวอย่างว่า 0 หรือ 5 หน้าตาเป็นอย่างไร) จึงควรเขียน anchor ตัวอย่างและบังคับให้ judge ให้เหตุผลก่อนแล้วค่อยให้คะแนน เพราะ LLM จะหาเหตุผลมาปกป้องตัวเลขที่พูดไปก่อน", "en": "A bare prompt on Opus 4.7 beat tuned Sonnet but exposed rubric weakness; add anchored examples and make judges give reasons before the score."}], "numbers": [{"th": "ความยาวคลิป 39:16 โดยผู้พูดบอกว่า session ราว 45 นาทีสั้นเกินกว่าจะลง eval ได้ลึก"}, {"th": "คะแนน judge รอบแรกอยู่ราว 2.8 ถึง 4 จากเต็ม 5 ซึ่งผู้พูดมองว่าสูงเกินไปเมื่อดูสไลด์จริง"}, {"th": "หลังเพิ่ม QA loop คะแนน judge ทุกด้านขยับเป็นช่วงประมาณ 4.2 ถึง 4.4"}, {"th": "รอบ Opus 4.7 prompt พื้นฐาน ผู้พูดอ่านคะแนน เช่น color judge 4.8, layout judge 4.2, title-body coherence 4.4, image 5 (ทั้งที่สไลด์นั้นไม่มีภาพ)"}, {"th": "รอบแก้ prompt ครั้งที่สองผู้พูดบอกว่า emoji count ขึ้นเป็น 20 ซึ่งไม่ตรงกับที่เห็นในสไลด์ จึงสงสัยว่าเป็นความผิดพลาดของ grader"}, {"th": "ชื่อโมเดลที่พูดถึง: Sonnet (พูด 4.7 แล้วแก้เป็น 4.6) กับ Opus 4.7"}], "quotes": [{"text": "systematic tests that measure how well an AI system performs on a specific domain or use case", "th": "eval คือชุดทดสอบเชิงระบบที่วัดผลงานของ AI ในโดเมนหรือ use case เฉพาะ"}, {"text": "It's not because you have set up your evals once that they are now like the ground truth", "th": "ตั้ง eval ครั้งเดียวไม่ได้แปลว่ามันเป็นความจริงสูงสุดตลอดไป"}, {"text": "Approach QA as a bug hunt, not a confirmation step.", "th": "ให้ทำ QA แบบล่าบั๊ก ไม่ใช่ขั้นตอนยืนยันว่าดีแล้ว"}], "steps": ["นิยาม agent ใน agent.yaml (Managed Agents) พร้อม system prompt สั้นๆ ให้สร้างไฟล์ PowerPoint ด้วย Python PPTX ใน shell", "รัน agent สร้างสไลด์ 5 หน้า แล้วดูผลจริงเพื่อหา failure mode (ข้อความทับกัน สีแปลก ฟอนต์เล็ก emoji)", "เขียน code grader (emoji count, slide count, cluttered, small font, text-heavy, slides with image) และ judge (color, image, layout, text, title-body coherence ให้คะแนน 0-5)", "รัน script ให้คะแนนอัตโนมัติ อ่าน score.json แล้วแก้ system prompt ตามจุดที่พลาด (typography, layout/density, ห้าม AI tells)", "เพิ่มข้อกำหนดทุกสไลด์ต้องมีไดอะแกรม/กราฟเป็นภาพ แล้วรันซ้ำและเทียบคะแนน", "เพิ่ม QA loop แบบ adversarial: แปลงสไลด์เป็นภาพ ตรวจทุกหน้า แก้ render ซ้ำ อย่างน้อยหนึ่งรอบ fix-and-verify", "สลับเป็น Opus 4.7 ด้วย prompt พื้นฐาน เทียบผล แล้วย้อนไปปรับ rubric ของ judge ให้มี anchor และให้เหตุผลก่อนให้คะแนน"], "takeaways_th": ["สร้าง eval ของ use case ตัวเองก่อนเชื่อ benchmark ทั่วไป และถามทุก grader ว่าให้ข้อมูลที่ลงมือแก้ได้ไหม ถ้าไม่ ตัดทิ้ง", "ใช้ code grader กับของที่นับได้แน่ๆ ใช้ model judge กับของที่ต้องใช้วิจารณญาณ และเขียน rubric พร้อมตัวอย่าง anchor ว่าคะแนนต่ำสุดสูงสุดหน้าตาอย่างไร", "สั่ง judge ให้เขียนข้อดีข้อเสียและเหตุผลก่อน ค่อยให้คะแนนท้ายสุด กันไม่ให้ LLM แต่งเหตุผลมาปกป้องตัวเลขที่เลือกไว้แล้ว", "เพิ่ม QA agent หรือ QA loop แบบสันนิษฐานว่ามีปัญหา แล้วป้อนผลกลับไปให้ agent ผู้สร้างจนทั้งสองฝั่งพอใจ", "อ่านผลจริงด้วยตาควบคู่คะแนนเสมอ เมื่อคะแนนกับสิ่งที่เห็นขัดกัน ให้แก้ grader ไม่ใช่เชื่อตัวเลข และทดลองสลับโมเดลที่เก่งขึ้นโดยใช้ eval ชุดเดิมวัด"], "caveats_th": ["ไม่มีการแนะนำชื่อผู้พูดใน transcript จึงใส่ speakers เป็นว่าง", "ตัวเลขคะแนนและชื่อรุ่นโมเดลมาจาก ASR ผู้พูดพูด 'Sonnet 4 7' แล้วแก้เป็น '4 6' จึงบันทึกเป็นไม่ชัดเจน", "ผู้พูดอ้างว่าทำชุดสไลด์ผลลัพธ์ล่วงหน้าไว้ ตัวเลขทั้งหมดมาจากการเดโมในห้อง ไม่ใช่ผลวัดซ้ำที่ตรวจสอบได้", "ผู้พูดบอกว่า 'Tower Bench' ซึ่งน่าจะเป็นชื่อ benchmark ที่ ASR เพี้ยน ไม่ได้ใส่เป็นข้อเท็จจริง"], "related_existing": ["agent-trust-ladder-verification-first", "prompt-engineering", "claude-code-model-config", "harness-engineering"], "dur": "39:16", "url": "https://www.youtube.com/watch?v=v9FTCvkV_a0", "asr": "yt-captions", "wiki": "cwc-london-28"}, {"n": 29, "id": "geUv4CjPpxI", "title_en": "Agents that remember", "title_th": "agent ที่จำข้าม session ได้: memory store กับ dreaming", "speakers": [{"name": "Kevin", "role": "Engineer, Anthropic (ได้ยินแค่ชื่อต้น)"}], "track": "workshop", "tags": ["managed-agents", "agent-memory", "self-improving", "devex"], "tldr_th": "เวิร์กชอปต่อ memory store (ที่เก็บแบบ file system ที่ mount เข้า session) ให้ agent บน Managed Agents จำข้อมูลข้าม session ได้ แล้วใช้ dreaming เป็น batch job แบบ multi-agent ที่ตรวจ จัดระเบียบ และยุบข้อมูลซ้ำใน memory เพื่อไม่ให้บวม ผู้พูดสาธิตเปรียบเทียบ agent ก่อนมี memory, หลังมี memory และหลัง dream", "tldr_en": "Wiring persistent memory stores onto Managed Agents sessions, then using dreaming, an async multi-agent batch job, to fact-check, organize and deduplicate the memory into a new output store.", "audience_th": "คนที่เคยรู้จัก agent, environment, session ของ Managed Agents แล้ว และอยากให้ agent จำข้าม session ได้", "points": [{"th": "ปัญหาตั้งต้น: session ของ agent แยกกัน ข้อมูลที่บอกใน session หนึ่งไม่ไปถึงอีก session เดโมแสดงว่าถามซ้ำใน session ใหม่ agent ตอบไม่ได้", "en": "Sessions are isolated: information told in one session does not reach another, shown by a failed recall test."}, {"th": "เพิ่ม concept ใหม่สองตัวต่อจาก agent, environment, session คือ memory store (ที่เก็บแบบ file system แนบเป็น resource ของ session) กับ dream (job แบบ async ที่เรียบเรียง memory จาก transcript เก่า)", "en": "Two new concepts: memory store, a filesystem-like store attached to sessions, and dream, an async background job."}, {"th": "memory store mount เป็น file system ใน container ของ session โมเดลมี tool อ่านเขียนและใช้ bash, grep สำรวจได้ จะสร้างกี่ store ก็ได้ แบ่งตามผู้ใช้หรือ workspace ได้ตามต้องการ", "en": "The store is mounted as a file system, so the model can use bash and grep; any number of stores, scoped per user or workspace."}, {"th": "ตอนสร้าง store ใส่ชื่อกับคำอธิบาย ตอนแนบเข้า session ส่ง memory store ID พร้อม prompt ชี้นำว่าควรจดอะไร และ field access (ค่าเริ่มต้นอ่านเขียน ตั้งเป็นอ่านอย่างเดียวได้) เดโมแสดง agent ไปอ่าน memory ก่อน แล้วบันทึกลงไฟล์ sessions.md ในรอบถัดไปก็ grep หาเจอ", "en": "Create a store with name and description, attach to sessions with a store ID, steering prompt and access mode; the agent reads first and writes sessions.md."}, {"th": "ไฟล์ memory มีเวอร์ชัน แก้ทีไรสร้างเวอร์ชันใหม่ มี endpoint ให้ list และตรวจ และใน console ดูแก้ไฟล์เองได้ เช่น แก้เมื่อ Claude เขียนผิด", "en": "Memory files are versioned, with endpoints for listing and inspecting and a console editor for manual fixes."}, {"th": "ปัญหาของ memory เฉยๆ: agent มักเทข้อมูลลง store ไปเรื่อยๆ จนบวม ไม่เป็นระเบียบ และมีข้อมูลเก่า dreaming จึงเป็น batch process ที่รันแบบ async ผ่าน API หรือ console ด้วย harness แบบ multi-agent", "en": "Memory tends to grow disorganized and stale; dreaming is an async batch process with a multi-agent harness."}, {"th": "การสร้าง dream job: เลือกโมเดล (Opus 4.7 หรือ Sonnet 4.6 ตามคุณภาพกับต้นทุน) ใส่ input memory store กับรายการ session ID (ตัวอย่างบอกประมาณ 10 ถึง 20 ได้ สูงสุดราว 100 และกำลังขยาย) และ instructions เสริมได้ แล้วจะได้ dream ID กลับมา", "en": "Create a dream with a model, input store, session IDs and optional instructions; poll status via API."}, {"th": "dream ไม่แตะ store ต้นฉบับ แต่โคลนเป็น output memory store แล้วแก้ที่นั่น (non-destructive) ในเดโมได้ไฟล์ index ที่ชี้ไปยังไฟล์ memory, ไฟล์ event logistics ที่เพิ่มรายละเอียด และไฟล์เดิมถูกจัดรูปใหม่ มี diff ใน console ให้ตรวจ", "en": "Dreaming writes to a cloned output store: adds an index, enriches and reformats files, with a console diff for review."}, {"th": "dreaming สร้างบน primitive ของ Managed Agents เอง จึงเปิดดู session ของ dream ได้ ภายในมี orchestrator เปิด subagent หนึ่งตัวต่อ session อินพุต ตั้งใจให้ exhaustive แล้ว session ใหม่ที่ใช้ output store อ่าน index ก่อนและตอบได้ละเอียดขึ้นมาก", "en": "Dreaming is itself a session: an orchestrator spawns one subagent per input session; a new session using the output store answers much better."}, {"th": "ภาพรวมเป็นสามชั้นที่ประกอบกันได้: session (ชั่วคราว) memory store (เชื่อมข้าม session) dreaming (จัดระเบียบ ปรับปรุง memory ให้คงขนาดที่จัดการได้และไม่ล้าสมัย)", "en": "Three composable layers: ephemeral sessions, memory stores across sessions, dreaming to curate the stores."}], "numbers": [{"th": "dream job รับโมเดล Claude Opus 4.7 หรือ Sonnet 4.6 (ตามที่ได้ยินจาก ASR)"}, {"th": "จำนวน session ต่อ dream: ตัวอย่างประมาณ 10 หรือ 20 สูงสุดราว 100 ผู้พูดบอกว่ากำลังหาทางขยายเกินนี้"}, {"th": "ผู้พูดคาดว่า cache hit rate ราว 95% ในการรัน dream ส่วนใหญ่ เพราะงานเป็น agentic"}, {"th": "ผู้พูดบอกว่ากำลังสำรวจการลดราคา 50% คล้าย batch API โดยจัดตารางรันต่างเวลา (ยังเป็นแค่แนวคิด)"}, {"th": "dream job ในเดโมใช้เวลาราว 1 นาที แต่บอกว่าของจริงอาจกินตั้งแต่ไม่กี่นาทีถึงหลายชั่วโมง"}, {"th": "ผู้พูดบอกว่า access เริ่มต้นเป็นอ่านเขียน และเปลี่ยนเป็นอ่านอย่างเดียวได้"}], "quotes": [{"text": "So this is a non-destructive process.", "th": "กระบวนการนี้ไม่ทำลายของเดิม"}, {"text": "we actually kind of want Dreaming to be exhaustive by design", "th": "ตั้งใจออกแบบให้ dreaming ตรวจทุกอย่างให้ครบ"}, {"text": "it's actually good to kind of write additional details down that a future agent might remember", "th": "จดรายละเอียดเพิ่มไว้ให้ agent ในอนาคตจำได้ เป็นเรื่องดี"}], "steps": ["รัน bootstrap script ใน repo เวิร์กชอป เพื่อสร้างข้อมูลตั้งต้น: agent, environment และ session เก่าๆ (เนื้อหาคีย์โน้ตวันที่หนึ่งกับเวิร์กชอปก่อนหน้า)", "ทดสอบกรณีฐาน: สร้าง session ชื่อ write test with no memory ผ่าน CLI แล้วส่งข้อความแรกให้ข้อมูลเกี่ยวกับ CMA talk (multi-agent orchestration, outcomes, memory) ดู status ใน console", "retest: สร้าง session ใหม่ ถามเรื่องเดิม agent ตอบไม่ได้เพราะไม่มี memory", "สร้าง memory store ผ่าน CLI ตั้งชื่อ (ตัวอย่างชื่อ CWC memory) ใส่คำอธิบาย แล้วดูใน console หมวด memory stores", "สร้าง session ที่แนบ memory store โดยส่ง memory store ID พร้อม prompt ชี้นำ และ access (อ่านเขียนเป็นค่าเริ่มต้น หรืออ่านอย่างเดียว) ส่งข้อมูลอีกรอบ agent จะอ่าน memory แล้วเขียนลงไฟล์ sessions.md", "สร้าง session ใหม่ที่ใช้ memory store เดิมแล้วถาม agent จะ grep หาคำอย่าง CMA ใน memory และตอบได้", "ตรวจ store ด้วย CLI (list memory files, ดูเวอร์ชัน) และดู file system viewer ใน console ที่แก้ไฟล์หรือเพิ่ม memory เองได้", "สร้าง dream job: ระบุโมเดล, input memory store, รายการ session ID, instructions เสริม แล้วได้ dream ID กลับมา", "ติดตามสถานะ (pending, running, completed) ใน console หรือ poll API ดู token count และเปิด session ของ dream เพื่อดู subagent", "ดู diff ของผลลัพธ์ใน console (ไฟล์ index, event logistics, ไฟล์เดิมที่จัดรูปใหม่)", "ดึง output memory store จาก dream resource ด้วย dream ID แล้วสร้าง session ใหม่แนบ store นั้น ถามว่าเข้าร่วม session ไหน มี link อะไร มี follow-up อะไร", "เมื่อพอใจ จะ retire memory store เก่าเพื่อคุมจำนวน store ในองค์กร (ไม่กระทบ session เก่า)"], "takeaways_th": ["ให้ agent ที่ต้องรู้จักผู้ใช้หรือบริบทระยะยาวมี memory store แยกตามผู้ใช้หรือ workspace แล้วใช้ prompt ชี้นำว่าควรจดเรื่องไหน", "ตั้ง access เป็นอ่านอย่างเดียวสำหรับ session ที่ไม่ควรแก้ memory", "รัน dreaming เป็นรอบ เช่น รายวันกับ session ชุดหนึ่ง แล้วอ่าน diff ใน console ก่อนสลับไปใช้ output store", "ใช้ instructions ของ dream job บอกโดเมนที่ต้องการรายละเอียดเฉพาะ หรือโครงสร้างไฟล์ที่อยากได้", "มองเรื่อง token cost ของ dreaming ล่วงหน้า เพราะผู้พูดบอกว่าตั้งใจให้ใช้ token เยอะ และมีตัวเลือกลดต้นทุน เช่น เปลี่ยนโมเดลหรือกำหนดงบ token"], "caveats_th": ["ชื่อผู้พูดได้ยินแค่ Kevin ไม่มีนามสกุล", "รุ่นโมเดลของ dream job (Opus 4.7, Sonnet 4.6) ฟังจาก ASR (พูดว่า Opus 47 กับ Sonnet 46)", "ผู้พูดเรียกบริการนี้ว่า dreaming และเรียก feature ว่า agent memory stores ใหม่ ซึ่งเพิ่งเปิดตัว ชื่อพารามิเตอร์ API จริงไม่มีบนจอใน transcript", "ตัวเลข 95% cache hit และส่วนลด 50% เป็นข้ออ้างหรือแผนของผู้พูด ไม่ใช่ตัวเลขยืนยัน ส่วนลดยังอยู่ระหว่างสำรวจ", "เดโมใช้ข้อมูลตัวอย่างเกี่ยวกับงาน Co
